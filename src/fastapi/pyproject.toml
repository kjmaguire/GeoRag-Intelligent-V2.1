[project]
name = "georag-fastapi"
version = "0.1.0"
description = "GeoRAG Intelligence — FastAPI domain service"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.46.0",
    "pydantic>=2.11",
    # Storage-abstraction plan PR1 — vendor-neutral object storage interface,
    # shared with src/dagster via a uv path dependency (see [tool.uv.sources]
    # below). Local package, not published; version is unused by uv sources.
    "georag-object-storage",
    # Geology format parsers (CSV/XLSX/spatial/raster/LAS/XYZ) for the
    # Hatchet ingestion workflows. Brings polars back with it — see that
    # package's pyproject for why the parsers stay on polars.
    "georag-geoparsers",
    # Phase H — bumped from >=1.0 to >=1.56 to close two GHSAs flagged by
    # osv-scanner against the installed 1.38.0:
    #   GHSA-2jrp-274c-jhv3 — SSRF in URL Download Handler (fix: 1.56.0)
    #   GHSA-wjp5-868j-wqv7 — Stored XSS via Path Traversal in Web UI CDN URL
    #                          (fix: 1.51.0)
    # 2026-06-23 deps-rot fix: switched from `pydantic-ai` (meta) to
    # `pydantic-ai-slim[anthropic,openai]`. The meta package transitively
    # pulls in `pydantic-ai-slim[bedrock]`, whose boto3 range is
    # incompatible with `aioboto3>=13.0` — the uv resolver reported
    # `aioboto3>=13.0.0 and pydantic-ai>=1.56.0 are incompatible` and
    # the build hard-failed at the `uv pip install` step. We only use
    # the Anthropic fallback path + the OpenAI-compatible client against
    # vLLM (`app/agent/llm_calls.py`), so the slim variant with explicit
    # providers is the documented escape hatch.
    # 2026-08-15 — major bump 1.x -> 2.x. Per the V1->V2 upgrade guide,
    # this codebase's actual runtime footprint of pydantic-ai is tiny:
    # the real `Agent()` instance (formerly `geo_agent.py`) was archived
    # when the RAG pipeline moved to the LangGraph-orchestrated
    # `agentic_retrieval` graph. What remains are `RunContext[AgentDeps]`
    # type annotations (never instantiated — call sites pass the
    # `ToolContext` shim from app/agent/deps.py) and `ModelRetry`
    # raised as a plain exception from the Layer 3/4/6 validator
    # functions in app/agent/hallucination/layer*.py, which are
    # themselves vestigial (imported only by app/agent/hallucination/
    # __init__.py and tests — production validation runs through
    # app/agent/hallucination/orchestrator_validators.py instead, which
    # never touches pydantic_ai at all). Neither RunContext nor
    # ModelRetry moved/renamed in the V2 upgrade guide, so no call-site
    # changes were needed beyond the version bump itself.
    "pydantic-ai-slim[anthropic,openai]>=2.0,<3.0",
    "pydantic-settings>=2.7",
    "asyncpg>=0.30.0",
    "redis>=7.0",
    # app/services/rate_limit.py imports this directly but it was never
    # declared here — presumably present only in whichever developer
    # environment originally wrote that module. Every fresh `uv sync`
    # (including CI) has been unable to import it since.
    "slowapi>=0.1.9",
    "qdrant-client>=1.17",
    "neo4j>=6.0",
    # 2026-08-06 re-audit: dropped the `[onnx]` extra. Grepped every
    # SentenceTransformer(...) call site in src/fastapi/app/ (4 total) —
    # none pass backend="onnx" or reference onnx in any way; the extra
    # was declared but never actually exercised at runtime. It was also
    # the ONLY thing pulling in `optimum-onnx`, which is what hard-capped
    # transformers at <4.58.0 (confirmed against optimum-onnx 0.1.0's own
    # published constraint) and blocked patching two HIGH-severity
    # Dependabot CVEs. Base sentence-transformers has no such cap
    # (transformers<6.0.0,>=4.41.0 per its own metadata) — dropping the
    # extra was a zero-functional-impact way to unblock the real fix
    # below instead of accepting the CVEs indefinitely.
    "sentence-transformers>=5.0",
    # SPLADE++ sparse encoder (Module 4 Chunk 2)
    # torch: CPU-only build sufficient -- FastAPI container has no GPU passthrough.
    # transformers: HuggingFace BERT-family models for SPLADE++ masked LM.
    # 2026-08-06: floor raised 2.3->2.13 to close a low-severity memory-
    # corruption CVE in torch.jit.script (fixed 2.13.0). The range already
    # allowed 2.13+ before this change — the committed uv.lock was just
    # pinned to a stale 2.12.1 resolved before the fix shipped, and uv
    # won't proactively upgrade an already-satisfying lock on its own.
    "torch>=2.13,<3.0",
    # 2026-08-06: bumped past 5.5.0, closing two HIGH-severity Dependabot
    # CVEs (LightGlue model-loading RCE fixed 5.5.0; a second RCE fixed
    # 5.3.0) plus the Trainer-class RCE already tracked below (fixed
    # 5.0.0rc3, and moot now regardless since 5.5 postdates it). None of
    # these were reachable from GeoRAG's SPLADE++ inference-only call
    # sites even before the bump, per the original Phase H note — fixing
    # the version is still the right move now that nothing blocks it.
    # See the sentence-transformers entry above for why the old
    # optimum-onnx-imposed <5.0 ceiling is gone. Ceiling matches
    # sentence-transformers' own <6.0.0 constraint.
    "transformers>=5.5,<6.0",
    "httpx>=0.28",
    "prometheus-fastapi-instrumentator>=7.0",
    # Phase H — explicit pins for the LangChain / LangGraph stack used
    # by the §7 Report Builder + §8 Target Recommendation pipelines.
    # Previously pulled in transitively via langfuse / langchain-mcp-adapters
    # — that path served 0.2.76 / 0.3.86, both flagged by osv-scanner:
    #   langgraph              GHSA-g48c-2wqr-h844  unsafe msgpack         fix 1.0.10
    #   langgraph-checkpoint   GHSA-mhr3-j7m5-c7c9  BaseCache deserialization RCE  fix 4.0.0
    #   langgraph-checkpoint   GHSA-wwqv-p2pp-99h5  json-mode RCE          fix 3.0.0
    #   langchain-core         GHSA-2g6r-c272-w58r  SSRF in image_url      fix 1.2.11
    #   langchain-core         GHSA-qh6h-p6c9-ff54  Path Traversal         fix 1.2.22
    # Pin to the GHSA-safe minor of each major. Major-version jumps
    # (langgraph 0.x→1.x, langchain-core 0.x→1.x) may break the
    # Report Builder pipeline at first re-import — run
    # tests/test_report_builder_e2e.py after the image rebuild.
    "langgraph>=1.0.10,<2.0",
    "langgraph-checkpoint>=4.0.0,<5.0",
    "langchain-core>=1.2.22,<2.0",
    # 2026-06-23 sweep — REGRESSION FIX from the langgraph-overlay
    # removal in commit ac3b5fd. The old Dockerfile overlay installed
    # `langfuse>=3.0,<4.0` as a side effect of the downgrade hack;
    # when the overlay was removed, langfuse went missing from the
    # image and `app/main.py::lifespan` started logging
    #   "Failed to initialise Langfuse client — RAG traces will not
    #    be recorded. App continues without observability."
    # on every container start. App continues per the warning, but
    # RAG traces silently stop reaching the Langfuse OLAP store.
    # Promoting langfuse to a top-level dep here so it lands in the
    # image without the overlay. Sibling extras the overlay added
    # (langgraph-checkpoint-postgres, langchain-mcp-adapters) are
    # genuinely unused per the earlier grep — leaving those out.
    "langfuse>=3.0,<4.0",
    # Direct dep so the Anthropic-backed LLM path is first-class, not
    # transitive through pydantic-ai. Needed for prompt caching breakpoints
    # and the messages API shape (priority tier, 300k-batch beta, adaptive
    # thinking) that the OpenAI-compatible proxy path cannot reach.
    "anthropic>=0.100",
    # Phase H4 (2026-05-15) — explicit pins forcing the resolver past the
    # 6 GHSAs surfaced by osv-scanner against the prior transitive
    # versions. All three are transitive (urllib3 via requests, authlib via
    # langfuse, python-multipart via fastapi) but we name them directly so
    # `uv lock` picks the patched versions:
    #
    #   urllib3            GHSA-mf9v-mfxr-j63j (8.9, HTTP smuggling)        fix 2.7.0
    #                      GHSA-qccp-gfcp-xxvc (8.2, CRLF / redirect bypass) fix 2.7.0
    #   python-multipart   GHSA-pp6c-gr5w-3c5g (7.5, DoS via boundary)       fix 0.0.27
    #                      GHSA-mj87-hwqh-73pj (5.3, ResourceWarning leak)   fix 0.0.26
    #   authlib            GHSA-r95x-qfjj-fjj2 (6.1, JWS header confusion)   fix 1.6.12
    #                      GHSA-jj8c-mmj3-mmgv (5.4, weak audience check)    fix 1.6.11
    #
    # 2026-06-24 re-audit: python-multipart floor raised 0.0.27 -> 0.0.31.
    # Two newer advisories now sit ABOVE the old floor:
    #   CVE-2026-53537 (param smuggling)     fix 0.0.30
    #   CVE-2026-53540 (DoS)                 fix 0.0.31
    # urllib3 (>=2.7.0) + authlib (>=1.6.12) re-checked — both floors are
    # still above all current advisories, left unchanged.
    # 2026-07-29 re-audit:
    #   starlette          GHSA-82w8-qh3p-5jfq (urlencoded form DoS) fix 1.3.1
    #   cryptography       GHSA-537c-gmf6-5ccf (bundled OpenSSL)      fix 48.0.1
    "urllib3>=2.7.0,<3.0",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
    # 2026-08-06: floor+ceiling raised 48.x->50.x, closing a HIGH-severity
    # Bleichenbacher-oracle CVE in PKCS#7 EnvelopedData decryption
    # (vulnerable range >=44.0.0,<50.0.0; fixed 50.0.0). The old <49
    # ceiling was just this file's usual "pin to current major" habit,
    # not a real compatibility constraint — nothing here found needing it.
    "cryptography>=50.0,<51",
    "authlib>=1.6.12",
    # §04p Phase 1.A — PDF Ingestion Subsystem
    # pikepdf: MPL-2.0 (weak copyleft scoped to pikepdf itself only; does not
    #   affect GeoRAG's proprietary code per §04p license-posture note).
    # pypdfium2: Apache 2.0 / BSD-3-Clause (bundles PDFium from Chromium).
    # cachetools: MIT (LRU cache for render service; falls back to built-in
    #   OrderedDict if not installed, but cachetools is more battle-tested).
    # NOTE for operator: run `uv pip install 'pikepdf>=9.0' 'pypdfium2>=5.12,<6'
    #   'cachetools>=5.5'` (or rebuild the fastapi Docker image) before using
    #   the /pdf/* endpoints.
    # pypdfium2 floor raised to 5.12 (2026-07-29) — 4.30.1 and 5.0.0b1 were
    # both yanked from PyPI for a PDFium text-extraction regression; 5.0
    # also removed PdfDocument.render() in favor of PdfPage.render(), but
    # this codebase only ever calls page.get_textpage().get_text_bounded(),
    # never the removed method, so the bump is a floor raise, not an API
    # migration. Capped at <6 so a future major bump doesn't land silently.
    "pikepdf>=10.10.0,<11",
    "pypdfium2>=5.12.1,<6",
    "cachetools>=5.5",
    # §04p Phase 1.B — Text + layout extraction (Stage 3)
    # pdfminer.six: MIT — lossless text extraction with bboxes + font metadata.
    #   Primary text source per §04p; OCR is fallback only.
    # pdfplumber: MIT — table extraction with cell-level bboxes.
    #   Built on pdfminer.six; adds table detection and cell-bbox extraction.
    # NOTE for operator: run `uv pip install 'pdfminer.six>=20240706' 'pdfplumber>=0.11'`
    #   (or rebuild the fastapi Docker image) before using
    #   the /pdf/extract_text and /pdf/find_tables endpoints.
    "pdfminer.six>=20260107",
    "pdfplumber>=0.11.10,<0.12",
    # polars: REMOVED 2026-07-28 (B2). It was here for exactly one reason —
    #   georag_dagster.parsers.__init__ eagerly imported xlsx_parser, so the
    #   worker's `from georag_dagster.parsers.pdf_report import ...` dragged
    #   polars in and startup failed without it (surfacing as an
    #   ingest_pdf:parse ModuleNotFoundError even on PDF-only ingests;
    #   hot-patched 2026-05-21). A1 moved the parser to
    #   app/services/ingest/pdf_report.py, so nothing in src/fastapi imports
    #   georag_dagster any more and nothing imports polars directly. Verified
    #   with a repo-wide grep over app/, scripts/ and tests/.
    # langdetect: Apache 2.0 — per-page language detection in
    #   pdf_report._detect_page_language, which feeds ReportParseResult
    #   .page_languages and the `mixed_language` warning.
    #
    #   A1 (2026-07-28): added when the parser moved out of the Dagster tree.
    #   It was NEVER declared by either package — it only reached the Dagster
    #   image transitively via unstructured[pdf], and unstructured was dropped
    #   in Phase 10 (see the note below). _detect_page_language catches
    #   ImportError and returns "unknown", so on the live Hatchet ingest path
    #   language detection has silently reported "unknown" for every page and
    #   the mixed_language warning could never fire. Declaring it here restores
    #   the feature; the image must be rebuilt for it to take effect.
    "langdetect>=1.0.9",
    # Phase 10 (2026-05-22) — unstructured removed.
    # The legacy unstructured-first dispatch was supplanted by the
    # Phase 2.1 fitz-first tree. _parse_with_unstructured() and its
    # `unstructured[pdf]>=0.15` dep have been dropped — fitz +
    # tesseract-fallback + pdfplumber-last-resort provide the full
    # coverage that unstructured did before.
    # pytesseract: Apache 2.0 — Python wrapper around the tesseract OCR
    #   binary used by _parse_with_fitz for per-page OCR fallback.
    #   Phase 10 (2026-05-22): explicit pin so a clean image rebuild
    #   ships with it baked in.
    "pytesseract>=0.3.13,<0.4",
    # pdf2image: MIT — renders PDF pages to PIL images for the tesseract
    #   fallback path (_ocr_single_page/_attempt_ocr call convert_from_path).
    #   Was an undeclared transitive dependency until this pin (2026-07-29) —
    #   directly imported in pdf_report.py but never had its own line here.
    "pdf2image>=1.17",
    # Pillow: MIT-CMU — the actual image type pdf2image/pytesseract pass
    #   around, and what the oversized-scan tiling preprocessor is built on.
    #   Also undeclared before this pin (2026-07-29).
    "Pillow>=12.3",
    # docling (and its onnxruntime-gpu dependency) removed 2026-07-29.
    # It powered §04p Phase 1.C-i layout region detection (GET
    # /pdf/find_legends, now also removed) plus optional OCR/table
    # dispatch in pdf_report.py — none of it ever ran in production
    # (PDF_PARSER_DOCLING_ENABLED was false in every live deployment;
    # 1,173 real silver.reports rows show parser_used as fitz or
    # pdfplumber, never docling). Azure Document Intelligence
    # (azure-ai-documentintelligence below) is the OCR path going
    # forward alongside tesseract.
    #
    # paddlepaddle/paddleocr (region-targeted `POST /pdf/ocr_region`) removed
    # the same day — the endpoint, app/ocr/, and services/pdf_ocr.py had zero
    # callers anywhere in Laravel/frontend code (same orphan pattern as
    # /pdf/find_legends). Task #17/A3 had already deleted most of §04p but
    # missed this leg.
    # #28 (2026-07-28) — Azure Document Intelligence OCR adapter (MIT).
    # Gated OFF by default (OCR_ENGINE=tesseract). When selected, the live
    # per-page and whole-document OCR paths use Azure first, tile oversized
    # rasters below the 10,000px service limit, and retain Tesseract as the
    # last-resort fallback.
    "azure-ai-documentintelligence>=1.0.2,<2.0",
    # azure-core: MIT — directly imported for AzureKeyCredential, not just a
    #   transitive dep of azure-ai-documentintelligence. Undeclared until
    #   this pin (2026-07-29).
    "azure-core>=1.41",
    # §04p Phase 1.D — Qwen-VL vision-language reasoning (Stage 6)
    # NO NEW PYTHON DEPS REQUIRED.  httpx, asyncpg, and pydantic (all already
    # listed above) are sufficient to call the Ollama / vLLM backend via the
    # OpenAI-compatible /v1/chat/completions endpoint with multipart-image content.
    #
    # OPERATOR ACTION REQUIRED (model pull — NOT pip install):
    #   The Qwen2.5-VL model weights must be loaded into the LLM backend before
    #   the /pdf/summarize_section endpoint returns anything other than 503.
    #   Model weights are Apache 2.0 — fully permissive per §04p license posture.
    #
    #   Ollama (dev):
    #     ollama pull qwen2.5-vl:7b      # ~5 GB on disk, 8 GB VRAM minimum
    #     # or for higher quality (Milestone 2 benchmark candidate):
    #     ollama pull qwen2.5-vl:72b     # ~42 GB on disk, 80 GB VRAM
    #
    #   vLLM (prod):
    #     python -m vllm.entrypoints.openai.api_server \
    #       --model Qwen/Qwen2.5-VL-7B-Instruct \
    #       --max-model-len 32768
    #
    #   Configure via .env:
    #     PDF_VL_MODEL_ID=qwen2.5-vl:7b
    #     PDF_VL_BACKEND=ollama           # or "vllm" / "anthropic"
    #     PDF_VL_BACKEND_URL=http://ollama:11434/v1
    #     PDF_VL_TIMEOUT_S=120
    #     PDF_VL_MAX_PAGES=4

    # Doc-phase 122-fix — explicit deps that were missing from HEAD's
    # pyproject but are required by app.hatchet_workflows / app.routers /
    # app.ocr. The OLD image must have had these transitively or via a
    # working-tree drift that wasn't in HEAD.
    # hatchet-sdk → app.hatchet_workflows.* uses Hatchet client class
    # aioboto3 → ingest_pdf S3 download helpers
    # PDF stack (CC-1 audit 2026-05-27): pymupdf REMOVED — AGPL-3.0 is
    # on the project's permanent-reject list (plan §"What is deliberately
    # not in this plan"). Replaced with permissive alternatives:
    #   pypdfium2 (Apache 2.0) — page rendering, image extraction
    #   pypdf     (BSD-3)      — text / metadata / form fields
    # NB: figure_extractor.py is currently a no-op stub awaiting a
    # full pypdfium2 rewrite; see its module docstring + Kyle's
    # OVERNIGHT_LOG follow-up list.
    # pyjwt (imports as `jwt`) → app.services.flow_jwt
    "hatchet-sdk>=1.33",
    "aioboto3>=13.0",
    # pypdfium2 pin lives once, above (§04p Phase 1.A) — duplicate entry
    # removed 2026-07-29, same package pinned twice in this list.
    "pypdf>=6.14.2,<7",
    # Phase 5 (2026-05-22) — used by the parse-subprocess memory guard
    # in ingest_pdf.py. Pre-fork RAM check prevents OOM when running
    # multiple concurrent PDF parses on the ingestion worker. Already
    # transitively present via dagster; this is the explicit pin.
    "psutil>=7.0",
    # GHSA-xgmm-8j9v-c9wx: mixed-family JWK/HMAC confusion fixed in 2.13.
    # GeoRAG already pins HS256 at every decode call, but the patched floor
    # keeps the library safe if a future verifier is misconfigured.
    "pyjwt>=2.13,<3",

    # Master-plan §5 (doc-phase 71) — spatial pipeline + drillhole visuals.
    # geopandas + rasterio bring GeoJSON/GeoTIFF read/write + CRS reprojection
    # into the FastAPI ingestion path (already in src/dagster/pyproject.toml).
    # mplstereonet renders stereonets for §5.8 structure visualizations.
    # matplotlib itself is a hard dep of the static-PNG renderers
    # (cross_section.py, stereonet.py, strip_log.py — Report Builder PDF
    # output) — declared explicitly rather than relying on it arriving as
    # mplstereonet's transitive dependency.
    "geopandas>=1.0",
    "rasterio>=1.4",
    "mplstereonet>=0.6",
    "matplotlib>=3.11,<4.0",

    # 2026-08-25 — canonical-lithology promotion (promote_silver_to_gold)
    # fuzzy-matches legacy lithology codes against the silver.rock_codes
    # catalogue, ported from the retired bronze_to_silver Dagster asset.
    # Until now rapidfuzz reached the image only transitively via
    # georag-geoparsers, and the Dockerfile's requirements.lock.txt install
    # runs AFTER the geoparsers install — declaring it here is what makes
    # the version deterministic rather than incidental.
    "rapidfuzz>=3.0",

    # Master-plan §7 (doc-phase 122) — Reporting + report bundle generation.
    # weasyprint → PDF rendering from HTML+CSS (§7.9 primary). Needs Pango /
    # Cairo system libs (added in docker/fastapi.Dockerfile).
    # python-docx → DOCX generator. Pure-Python.
    # openpyxl → XLSX generator. Pure-Python.
    # Phase H — bumped from >=63.0,<64.0 to >=68.0,<69.0 to close
    # GHSA-983w-rhvv-gwmv (SSRF protection bypass via HTTP redirect,
    # fix in 68.0). Stays inside a major-version range so the PDF
    # renderer's HTML/CSS expectations don't shift.
    # 2026-06-24 re-audit: cap raised <69.0 -> <70.0. The old <69.0 cap
    # EXCLUDED the only patched release for CVE-2026-49452 (CSS injection),
    # which was fixed in weasyprint 69.0. Admitting 69.x closes it while
    # still blocking a 70.x major jump.
    "weasyprint>=68.0,<70.0",
    "python-docx>=1.1,<2.0",
    "openpyxl>=3.1,<4.0",

    # Doc-phase 179 — LAS file parsing for §04b drillhole ingestion.
    # `lasio` reads LAS 1.2 / 2.0 / 3.0 well-log files. Used by the
    # Phase B Cameco e-log + WSGS historical archive ingest pipeline
    # (uranium_logs_all.zip). Pure-Python, no system deps.
    # Mirrors the dagster service's lasio>=0.31 pin so cross-service
    # parsing is consistent.
    "lasio>=0.31",

    # Master-plan §12 (doc-phase 122) — XGBoost + source trust + advanced learning.
    # All install via wheel on linux x86_64 — no system deps beyond libgomp1.
    # 2026-06-23 sweep: xgboost cap lifted <3.0 -> <4.0 to track the active
    # 3.x line (latest 3.3.0). Default tree method + GPU pipeline changes
    # land in 3.x; the legacy 2.x APIs we use are preserved.
    # 2026-08-19: split to the CPU-only distribution on linux. Plain
    # `xgboost` declares nvidia-nccl-cu13 (288 MB of multi-GPU collective
    # comms) as a hard linux dependency for its GPU tree method, which no
    # deployment uses -- nothing in the Azure stack has a GPU and the
    # scoring paths in services/target_scoring_ml/ are CPU inference.
    # `xgboost-cpu` is the upstream project's own CPU-only build: same
    # `xgboost` module, same 3.4.1 version, no CUDA dependencies. It only
    # publishes linux/windows wheels, so non-linux keeps the plain package
    # (already CPU-only on macOS). Verified drop-in: `import xgboost`
    # reports 3.4.1 with zero nvidia/nccl/cuda packages installed.
    "xgboost-cpu>=2.1,<4.0; sys_platform == 'linux'",
    "xgboost>=2.1,<4.0; sys_platform != 'linux'",
    "shap>=0.46,<1.0",
    "scikit-learn>=1.5,<2.0",
    # 2026-06-23 deps-rot fix: shap transitively depends on numba ->
    # llvmlite. Without these top-level pins uv backtracks to
    # `llvmlite==0.36.0` (a 2021 release that doesn't build on Python
    # 3.13) — observed in the failed --no-cache fastapi build of 2026-06.
    # llvmlite 0.43 + numba 0.60 are the first versions with Py 3.13
    # binary wheels on PyPI. Pinning them at the top level overrides
    # the transitive-constraint backtracking and keeps the resolver
    # on a wheel-installable path. Bump these when Py 3.14 cutover
    # forces another floor raise.
    "llvmlite>=0.43",
    "numba>=0.60",
]

[project.optional-dependencies]
prod = [
    "gunicorn>=23.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
    "mypy>=1.15",
    # Parses the hand-written SQL in the unattended sweeps (the nightly
    # bronze recovery runs at 02:00 and 04:00, the stale sweep every 15
    # minutes) so a syntax error is a red PR rather than a silent no-op at
    # two in the morning. Test-only: not in `prod`, so it is not in the
    # deployed image. See tests/test_nightly_bronze_recovery.py.
    "sqlglot>=25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
# editable = false (the default) deliberately: this Dockerfile's builder
# stage copies only /usr/local/lib/python3.13/site-packages into the
# runtime stage, not the source tree an editable install would redirect
# to. A non-editable path install builds a real wheel into site-packages
# so the package survives the multi-stage copy.
georag-object-storage = { path = "../georag_object_storage" }
# Same non-editable path-install rationale as above: the builder stage copies
# site-packages, not the source tree.
georag-geoparsers = { path = "../georag_geoparsers" }

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Cosmetic + opinionated rules ignored at first CI bootstrap. The safe + unsafe
# auto-fixes have already landed. Each ignore below is a deliberate trade-off —
# re-enable once a focused PR addresses each category.
#
# E501  — line too long (long URLs in comments; many false positives)
# E701  — multi-statement line (compact test fixtures)
# E731  — lambda assignment (used for Pydantic field defaults)
# B008  — function call in default arg (FastAPI Depends() pattern is correct usage)
# B904  — `raise ... from` (exception chain hygiene; cosmetic, ~14 sites)
# B017  — pytest.raises(Exception) (pre-existing broad-catch test; intentional)
# B023  — function uses loop variable (1 deliberate closure capture)
# SIM102 — combine nested ifs (3 sites where the nested form reads better with
#          its inline comment explaining the inner condition's purpose)
# SIM103 — return condition directly (1 site; explicit return reads clearer
#          alongside the SCREAMING_CASE_RE / SNAKE_CASE_RE pair)
# SIM117 — combine `with` statements (1 site; readability tradeoff)
ignore = ["E501", "E701", "E731", "B008", "B904", "B017", "B023", "SIM102", "SIM103", "SIM117"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires the live Docker Compose stack (fastapi, postgresql, ollama)",
    "golden: golden query set — failure blocks milestone acceptance",
    "hallucination: adversarial queries that must be refused",
    # live: requires a live LLM (Ollama/vLLM). Superset of integration.
    # Used to partition tests that would time-out on GitHub-hosted runners
    # even with the full Docker stack running (15+ GB model download).
    # Chunk 10.2 will wire a self-hosted runner or staging URL for these.
    "live: requires Ollama/vLLM running with a loaded model — not run in CI",
    # Module 10 Chunk 10.7 — chaos / resilience tests run on a weekly CI cron
    # rather than per-PR (they intentionally inject failures and are slow).
    "chaos: chaos / resilience tests — scheduled-only, NOT run on PRs",
    # Registered 2026-08-21. Used by tests/test_qwen3_citation_compliance.py
    # (a manual benchmark scaffold, skipped unless QWEN3_COMPLIANCE_MANUAL=1)
    # but never declared, so it only ever produced a PytestUnknownMarkWarning
    # — harmless until chaos.yml added --strict-markers, which turns an
    # unregistered marker into a collection ERROR that aborts the whole run.
    "qwen3_compliance: live Qwen3 citation-compliance trials — manual only",
]
# Integration tests are slow (LLM calls) AND data-dependent (need the
# Cameco Shirley Basin corpus seeded + a healthy vLLM). Default to
# skipping them so `pytest tests/` produces a clean green signal for
# the unit-test surface. Run them explicitly:
#
#   pytest -m integration  tests/test_golden_queries.py
#   pytest -m golden       tests/
#   pytest -m hallucination tests/
#   pytest -m chaos        tests/
#   pytest -m live         tests/
#
# Phase H — moved this filter from "manual choice" to "defensive
# default" because the historical 33-failure long tail of the full
# `pytest tests/` invocation was almost entirely uncovered integration
# tests that need fixtures the unit-test environment lacks. Filed
# in docs/phase_h_test_triage.md.
addopts = "-v -m 'not integration and not golden and not hallucination and not chaos and not live'"

[tool.mypy]
python_version = "3.13"

# ─── Why this is not `strict = true` any more (2026-08-21) ────────────
#
# It was, and it had never once gone green. The 2026-08-15 promotion audit
# recorded 824 errors across 198 of 363 files, and the CI job has carried
# `continue-on-error: true` ever since — so the checker produced a wall of
# red nobody read, which means a genuinely new type regression was
# indistinguishable from the existing noise and merged silently. That is
# strictly worse than no checker: it costs CI minutes and buys nothing.
#
# MEASURED, not guessed. Both numbers are from `mypy app` over the same
# tree on 2026-08-21:
#
#              strict = true          this config
#   errors            850                    286
#   modules           197                     91
#
#   by category   207 type-arg            84 attr-defined
#                 146 import-untyped      50 no-any-return
#                  93 no-untyped-def      47 arg-type
#                  86 attr-defined        21 union-attr
#                  50 no-any-return       18 assignment
#                  42 unused-ignore        …
#                  33 import-not-found
#
# Two thirds of the strict output was strictness noise — missing generic
# parameters, un-annotated defs, and third-party libraries that ship no
# stubs. None of it describes a defect. What remains is the list on the
# right, which is mostly real: `attr-defined`, `arg-type`, `union-attr`
# and `assignment` are the categories that catch bugs.
#
# It found one the day this was written. mypy reported
#   app/services/qdrant_fallback.py:223: "None" has no attribute "labels"
# and it was correct: `_fire_fallback_metric` guarded its lazy singleton
# with `except NameError` while the module assigned the sentinel at import,
# so the Counter was never built and the call raised AttributeError past
# an `except ImportError`. Latent (the function has no callers) but it
# would have gone live the moment anyone wired the Qdrant fallback up —
# a crash in the code whose only job is to keep working when Qdrant is
# down. Under strict that line sat between 207 type-arg entries.
#
# WHAT IS STILL OFF, AND WHY EACH ONE
#   disallow_untyped_defs      93 errors, all "add a signature". Real work,
#                              zero of it urgent, and turning it on blocks
#                              the gate on cosmetics.
#   disallow_any_generics      207 errors — the single largest category,
#                              overwhelmingly bare `dict`/`list` in code
#                              that is correct.
#   disallow_untyped_decorators  fires on every FastAPI/Hatchet decorator
#                              this codebase is built out of.
#   warn_unused_ignores        42 errors, and they invert: an ignore that
#                              is unused HERE is load-bearing in CI, where
#                              the third-party stubs actually exist.
#   ignore_missing_imports     on, for the 179 import errors from libraries
#                              that ship no `py.typed`. Nobody here can fix
#                              those, and they hide the ones we can.
#
# Ratchet these back on one at a time, each with its own green run.
#
# STILL ADVISORY IN CI, and the remaining step is written down at the
# `mypy` job in .github/workflows/ci.yml. The short version: promoting
# needs a per-module `ignore_errors` list for the 91, and the list has to
# come from a CI run rather than this one, because a locally-missing
# package makes a module Any-typed and therefore quiet.
check_untyped_defs = true
warn_return_any = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_any_generics = false
disallow_untyped_decorators = false
warn_unused_ignores = false

# ─── Per-module overrides: the burn-down list ─────────────────────────
#
# These exist so the mypy job can BLOCK. Everything not listed here is
# checked, which means a new module, and any module someone finishes
# cleaning, is covered from the moment it stops appearing below.
#
# Delete entries, never add them. Adding one is how a gate stops meaning
# anything; the CI job prints the current list to its step summary so a
# genuine addition is always a deliberate, visible act.

# TIER 1 — MEASURED. 90 modules mypy actually reports errors in,
# from `mypy app --platform linux` on 2026-08-21 with georag_geoparsers on
# MYPYPATH. The set was stable across the platform switch and across making
# that package resolvable (which added 27 errors and zero new modules), so
# it is close to what CI sees.
[[tool.mypy.overrides]]
ignore_errors = true
module = [
