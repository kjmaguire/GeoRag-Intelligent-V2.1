[project]
name = "georag-object-storage"
version = "0.1.0"
description = "GeoRAG Intelligence — vendor-neutral object storage interface (S3-compatible today, portable seam for an Azure Blob backend later)"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.35",
    "botocore>=1.35",
    "aioboto3>=13.0",
    "azure-storage-blob>=12.24",
    # Only imported when STORAGE_BACKEND=azure_blob AND
    # AZURE_STORAGE_ACCOUNT_URL (managed-identity mode) is set — see
    # azure_sync_client.build_blob_service_client's lazy import. Declared
    # as a hard dep anyway since it's small and every real Azure deployment
    # needs it; connection-string-only test/local usage just won't import it.
    "azure-identity>=1.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    # [server] (pulls in flask) is required by the async-client tests, which
    # run moto as a real HTTP server rather than the mock_aws()
    # patched-internals mode — see test_async_client.py's module docstring
    # for why (an open moto/aiobotocore incompatibility, getmoto/moto#8694).
    "moto[s3,server]>=5.0",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["georag_object_storage"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
