[project]
name = "georag-object-storage"
version = "0.1.0"
description = "GeoRAG Intelligence — vendor-neutral object storage interface (S3-compatible; the Azure Blob backend was retired 2026-09-08, ADR-0022)"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.35",
    "botocore>=1.35",
    "aioboto3>=13.0",
    # azure-storage-blob and azure-identity were removed 2026-09-14. They
    # were declared for azure_sync_client.build_blob_service_client's lazy
    # import, and that module no longer exists — ADR-0022 retired the Azure
    # Blob backend on 2026-09-08 and factory.py now raises on
    # STORAGE_BACKEND=azure_blob rather than dispatching to it. So they were
    # installed into every image for a code path that could not be reached.
    #
    # The Azure references that REMAIN in this package are deliberate and
    # are not dependencies: metadata.py's key rule exists because a hyphen
    # 400ed against Azure Blob on every TIFF upload, and the rule is kept
    # because it is the stricter of the two. A constraint outlives the
    # vendor that taught it.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    # [server] (pulls in flask) is required by the async-client tests, which
    # run moto as a real HTTP server rather than the mock_aws()
    # patched-internals mode — see test_async_client.py's module docstring
    # for why (an open moto/aiobotocore incompatibility, getmoto/moto#8694).
    "moto[s3,server]>=5.0",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["georag_object_storage"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
