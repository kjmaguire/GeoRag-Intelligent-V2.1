# ──────────────────────────────────────────────────────────────────
# K3s tuning — defaults assume `local-path` StorageClass + Traefik
# ingress, both of which K3s ships out of the box. No GPU is needed:
# this chart deploys no inference server, and the model sidecars run
# on CPU.
# ──────────────────────────────────────────────────────────────────
global:
  storageClass: local-path
  ingressClass: traefik
  tier: small

ingress:
  enabled: true
  className: traefik
  host: georag.local
  tls:
    enabled: false

# Conservative resource defaults — fits a 4-core / 16Gi K3s node
# (minus the headroom needed for K3s itself).
postgresql:
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits:   { cpu: "2",    memory: "4Gi" }

# Optional services off by default in the K3s preset
laravelReverb:
  enabled: false   # turn on once you wire a websocket-aware ingress
