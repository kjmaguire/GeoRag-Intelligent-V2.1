# ──────────────────────────────────────────────────────────────────
# K3s tuning — defaults assume `local-path` StorageClass + Traefik
# ingress, both of which K3s ships out of the box. No GPU is needed:
# this chart deploys no inference server, and the model sidecars run
# on CPU.
# ──────────────────────────────────────────────────────────────────
global:
  storageClass: local-path
  ingressClass: traefik
  tier: small

ingress:
  enabled: true
  className: traefik
  host: georag.local
  tls:
    enabled: false

# Conservative resource defaults — fits a 4-core / 16Gi K3s node
# (minus the headroom needed for K3s itself).
postgresql:
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits:   { cpu: "2",    memory: "4Gi" }

# Optional services off by default in the K3s preset
laravelReverb:
  # Off, so chat answers do not stream live. There is nothing left to wire: the
  # chart's Ingress routes /app to Reverb when this is on, and Traefik passes
  # WebSocket upgrades through. Set it true together with secrets.reverbAppKey
  # and secrets.reverbAppSecret (charts/georag/README.md, "Live chat (Reverb)").
  enabled: false
