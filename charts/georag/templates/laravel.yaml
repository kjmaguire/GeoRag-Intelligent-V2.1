{{- if .Values.laravelOctane.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-laravel-octane
  namespace: {{ .Values.global.namespace }}
  labels: {{- include "georag.labels" . | nindent 4 }}
    app.kubernetes.io/component: laravel-octane
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.laravelOctane.service.port }}
      targetPort: http
      name: http
  selector: {{- include "georag.selectorLabels" (dict "component" "laravel-octane" "root" .) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-laravel-octane
  namespace: {{ .Values.global.namespace }}
  labels: {{- include "georag.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.laravelOctane.replicas }}
  selector:
    matchLabels: {{- include "georag.selectorLabels" (dict "component" "laravel-octane" "root" .) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "georag.selectorLabels" (dict "component" "laravel-octane" "root" .) | nindent 8 }}
    spec:
      {{- include "georag.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: laravel-octane
          image: {{ include "georag.image" (dict "repo" .Values.laravelOctane.image.repository "tag" .Values.laravelOctane.image.tag "global" .Values.global) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            # The image's CMD is `octane:start --port=80` (docker/laravel.Dockerfile
            # EXPOSEs 80), and this chart does not override it. The Service,
            # the probe and the Ingress all reach this by the name `http`.
            - containerPort: 80
              name: http
          env:
            {{- include "georag.laravelEnv" . | nindent 12 }}
            - name: FASTAPI_INTERNAL_URL
              value: http://{{ .Release.Name }}-fastapi:{{ .Values.fastapi.service.port }}
            - name: FASTAPI_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: FASTAPI_SERVICE_KEY
            # config/services.php falls back to http://martin:3000, the compose
            # service name, which does not resolve here. Octane alone reads it
            # (TileProxyController); no queued job touches Martin.
            - name: MARTIN_INTERNAL_URL
              value: http://{{ .Release.Name }}-martin:{{ .Values.martin.service.port }}
            {{- with (include "georag.reverbPublisherEnv" . | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
          resources: {{- toYaml .Values.laravelOctane.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
{{- if .Values.laravelOctane.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-laravel-octane
  namespace: {{ .Values.global.namespace }}
  labels: {{- include "georag.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-laravel-octane
  minReplicas: {{ .Values.laravelOctane.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.laravelOctane.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.laravelOctane.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
{{- if .Values.laravelHorizon.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-laravel-horizon
  namespace: {{ .Values.global.namespace }}
  labels: {{- include "georag.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.laravelHorizon.replicas }}
  selector:
    matchLabels: {{- include "georag.selectorLabels" (dict "component" "laravel-horizon" "root" .) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "georag.selectorLabels" (dict "component" "laravel-horizon" "root" .) | nindent 8 }}
    spec:
      {{- include "georag.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: horizon
          image: {{ include "georag.image" (dict "repo" .Values.laravelOctane.image.repository "tag" .Values.laravelOctane.image.tag "global" .Values.global) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["php", "artisan", "horizon"]
          # No envFrom: it handed this pod every key in the release Secret —
          # the Postgres superuser password included — and, since the Secret
          # keys the app key LARAVEL_APP_KEY, still left it without APP_KEY.
          # Laravel reads exactly the variables below.
          env:
            {{- include "georag.laravelEnv" . | nindent 12 }}
            # The queued job IS the chat (StreamQueryFromFastApi), and it reads
            # config('services.fastapi.internal_url'), whose fallback is the
            # compose hostname http://fastapi:8000. Octane only dispatches.
            - name: FASTAPI_INTERNAL_URL
              value: http://{{ .Release.Name }}-fastapi:{{ .Values.fastapi.service.port }}
            - name: FASTAPI_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: FASTAPI_SERVICE_KEY
            {{- with (include "georag.reverbPublisherEnv" . | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
          resources: {{- toYaml .Values.laravelHorizon.resources | nindent 12 }}
{{- end }}
{{- if .Values.laravelReverb.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-laravel-reverb
  namespace: {{ .Values.global.namespace }}
  labels: {{- include "georag.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.laravelReverb.service.port }}
      targetPort: ws
      name: ws
  selector: {{- include "georag.selectorLabels" (dict "component" "laravel-reverb" "root" .) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-laravel-reverb
  namespace: {{ .Values.global.namespace }}
  labels: {{- include "georag.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.laravelReverb.replicas }}
  selector:
    matchLabels: {{- include "georag.selectorLabels" (dict "component" "laravel-reverb" "root" .) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "georag.selectorLabels" (dict "component" "laravel-reverb" "root" .) | nindent 8 }}
    spec:
      {{- include "georag.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: reverb
          image: {{ include "georag.image" (dict "repo" .Values.laravelOctane.image.repository "tag" .Values.laravelOctane.image.tag "global" .Values.global) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
          ports:
            - containerPort: 8080
              name: ws
          # No envFrom, for the same reason as Horizon.
          env:
            {{- include "georag.laravelEnv" . | nindent 12 }}
            - name: REVERB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: REVERB_APP_ID
            - name: REVERB_APP_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: REVERB_APP_KEY
            - name: REVERB_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: REVERB_APP_SECRET
            # The WebSocket origin allowlist. config/reverb.php defaults to a
            # localhost/georag.local list for dev; left at that, every upgrade
            # from the real host is rejected and no answer ever streams.
            - name: REVERB_ALLOWED_ORIGINS
              value: {{ default .Values.ingress.host .Values.laravelReverb.allowedOrigins | quote }}
            # REQUIRED. Both default to 10000 bytes, far below a completed LLM
            # answer frame, and Reverb silently rejects an oversized payload.
            # int64, not the bare value: Helm reads a YAML number as a float and
            # `quote` would print 1000000 as "1e+06".
            - name: REVERB_MAX_REQUEST_SIZE
              value: {{ .Values.laravelReverb.maxRequestSize | int64 | quote }}
            - name: REVERB_APP_MAX_MESSAGE_SIZE
              value: {{ .Values.laravelReverb.maxMessageSize | int64 | quote }}
            # The Redis pub/sub backplane (REDIS_HOST / REDIS_PASSWORD above).
            # Each replica holds only the sockets connected to IT, and a
            # publish reaches one replica, so with more than one and no
            # backplane the frames that land on the wrong one are dropped
            # silently. Harmless at one replica.
            - name: REVERB_SCALING_ENABLED
              value: {{ gt (int .Values.laravelReverb.replicas) 1 | quote }}
            - name: REVERB_SCALING_CHANNEL
              value: reverb
          resources: {{- toYaml .Values.laravelReverb.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /up
              port: ws
            initialDelaySeconds: 10
            periodSeconds: 10
{{- end }}
