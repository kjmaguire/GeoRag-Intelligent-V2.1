{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  namespace: {{ .Values.global.namespace }}
  labels: {{- include "georag.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- $ic := default .Values.global.ingressClass .Values.ingress.className }}
  {{- if $ic }}
  ingressClassName: {{ $ic }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Laravel is the only front door (SEC-3, 2026-09-29). There used
          # to be a /tiles rule straight to Martin, which shadowed Laravel's
          # tile proxy — the thing that authenticates, checks membership
          # and resolves workspace_id server-side — and an unconditional
          # /internal rule straight to FastAPI whose comment said "NOT
          # exposed by default". Neither may come back: tiles go through
          # /tiles/... on Laravel, and /internal is service-to-service only.
          {{- if .Values.laravelReverb.enabled }}
          # The one other front door: the browser's WebSocket to Reverb
          # (/app/<key>), which streams every chat answer. Reverb is Laravel's
          # own process, authenticates private channels through Laravel's
          # /broadcasting/auth, and the HTTP publish API it also serves
          # (/apps/<id>/events) stays unexposed: the publishers are in-cluster.
          # A Prefix path matches whole segments, so this does not capture
          # /application or /apple. Traefik and ingress-nginx both upgrade
          # WebSockets without further annotations.
          - path: /app
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-laravel-reverb
                port:
                  number: {{ .Values.laravelReverb.service.port }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-laravel-octane
                port:
                  number: {{ .Values.laravelOctane.service.port }}
{{- end }}
