{{- if .Values.hatchet.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-hatchet
  namespace: {{ .Values.global.namespace }}
  labels: {{- include "georag.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.hatchet.engine.service.grpcPort }}
      targetPort: grpc
      name: grpc
    - port: {{ .Values.hatchet.engine.service.apiPort }}
      targetPort: api
      name: api
  selector: {{- include "georag.selectorLabels" (dict "component" "hatchet-engine" "root" .) | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-hatchet
  namespace: {{ .Values.global.namespace }}
  labels: {{- include "georag.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-hatchet
  replicas: 1
  selector:
    matchLabels: {{- include "georag.selectorLabels" (dict "component" "hatchet-engine" "root" .) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "georag.selectorLabels" (dict "component" "hatchet-engine" "root" .) | nindent 8 }}
    spec:
      {{- include "georag.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: hatchet
          image: {{ include "georag.image" (dict "repo" .Values.hatchet.engine.image.repository "tag" .Values.hatchet.engine.image.tag "global" .Values.global) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 7077
              name: grpc
            # Web UI + REST API. hatchet-lite serves both on 8888.
            - containerPort: 8888
              name: api
          # docker-compose.yml's hatchet-lite environment, with the two values
          # that cannot carry over corrected for a cluster. This container had
          # NO environment: hatchet-lite then dies at boot on the missing
          # DATABASE_URL and takes every workflow and cron with it.
          env:
            # Declared before DATABASE_URL: $(VAR) only expands variables
            # defined earlier in the list.
            - name: HATCHET_DB_PW
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: HATCHET_DB_PASSWORD
            # The engine's own database and role, inside the same Postgres
            # (created by docker/postgresql/init/20-hatchet-database.sql;
            # pg-init sets the password).
            - name: DATABASE_URL
              value: "postgres://hatchet:$(HATCHET_DB_PW)@{{ .Release.Name }}-postgresql:5432/hatchet?sslmode=disable"
            # Postgres-backed message queue; RabbitMQ is not deployed.
            - name: SERVER_MSGQUEUE_KIND
              value: postgres
            - name: SERVER_DEFAULT_ENGINE_VERSION
              value: V1
            - name: SERVER_AUTH_COOKIE_DOMAIN
              value: {{ .Values.hatchet.engine.cookieDomain | quote }}
            - name: SERVER_AUTH_COOKIE_INSECURE
              value: {{ ternary "f" "t" (hasPrefix "https://" .Values.hatchet.engine.serverUrl) | quote }}
            - name: SERVER_AUTH_SET_EMAIL_VERIFIED
              value: "t"
            - name: SERVER_URL
              value: {{ .Values.hatchet.engine.serverUrl | quote }}
            # Plaintext gRPC, as compose and the AWS tasks run it; the clients
            # say HATCHET_CLIENT_TLS_STRATEGY=none to match. Cluster-internal.
            - name: SERVER_GRPC_BIND_ADDRESS
              value: "0.0.0.0"
            - name: SERVER_GRPC_PORT
              value: "7077"
            - name: SERVER_GRPC_INSECURE
              value: "t"
            # What workers are told to dial. Compose sets `localhost`, which in
            # a cluster would send every worker back to its own pod, so no
            # workflow would ever be picked up: it has to be the Service.
            - name: SERVER_GRPC_BROADCAST_ADDRESS
              value: "{{ .Release.Name }}-hatchet:{{ .Values.hatchet.engine.service.grpcPort }}"
            - name: SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS
              value: "{{ .Release.Name }}-hatchet:{{ .Values.hatchet.engine.service.grpcPort }}"
          resources: {{- toYaml .Values.hatchet.engine.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/ready
              port: api
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 8
          volumeMounts:
            # /config, not /hatchet/config: that is where the engine writes the
            # encryption keyset it generates on first boot, and where
            # `hatchet-admin --config /config token create` reads it back. A
            # volume anywhere else keeps nothing, and every restart generates a
            # new keyset — which invalidates every client token.
            - name: config
              mountPath: /config
  {{- if .Values.hatchet.engine.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        accessModes: [ReadWriteOnce]
        {{- $sc := include "georag.storageClass" (dict "svcStorageClass" "" "global" .Values.global) }}
        {{- if $sc }}
        storageClassName: {{ $sc }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.hatchet.engine.persistence.size }}
  {{- end }}
{{- if .Values.hatchet.worker.enabled }}
---
# One merged worker Deployment, matching docker-compose.yml's
# `hatchet-worker` service and the AWS ECS Terraform: no `--pool` flag,
# the registered workflow set is selected entirely by the WORKER_POOL
# env var (ingestion | ai | all — default all). This used to be two
# Deployments (hatchet-worker-ai / hatchet-worker-ingestion) gated by
# `--pool`; that was the pre-merge architecture and has been collapsed
# to match. `hatchet.worker.pool` stays chart-configurable for an
# on-prem operator who wants to split pools across nodes for resource
# reasons (e.g. GPU nodes for `ai`) — do that by installing this chart
# twice, once per pool, under distinct release names, not by
# reintroducing a second Deployment template here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-hatchet-worker
  namespace: {{ .Values.global.namespace }}
  labels: {{- include "georag.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.hatchet.worker.replicas }}
  selector:
    matchLabels: {{- include "georag.selectorLabels" (dict "component" "hatchet-worker" "root" .) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "georag.selectorLabels" (dict "component" "hatchet-worker" "root" .) | nindent 8 }}
    spec:
      {{- include "georag.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: worker
          image: {{ include "georag.image" (dict "repo" .Values.fastapi.image.repository "tag" .Values.fastapi.image.tag "global" .Values.global) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["python", "-m", "app.hatchet_workflows.worker"]
          # No envFrom. The worker used to take the whole release Secret — the
          # Postgres superuser password, the Martin and Reverb credentials —
          # and overrode only the one key it knew was dangerous. It reads
          # exactly the variables below.
          env:
            - name: WORKER_POOL
              value: {{ .Values.hatchet.worker.pool | quote }}
            # The SDK reads HATCHET_CLIENT_HOST_PORT (+ TLS strategy, token);
            # the HATCHET_CLIENT_HOST this used to set is ignored, so the
            # worker dialled localhost:7070.
            {{- include "georag.hatchetClientEnv" . | nindent 12 }}
            - name: POSTGRES_HOST
              value: {{ .Release.Name }}-pgbouncer
            - name: POSTGRES_PORT
              value: "6432"
            - name: POSTGRES_DIRECT_HOST
              value: {{ .Release.Name }}-postgresql
            - name: POSTGRES_DIRECT_PORT
              value: "5432"
            # SEC-1 (2026-09-29): georag_app, as on AWS. Without these the
            # DSN fell back to POSTGRES_USER=georag — the superuser, which
            # bypasses RLS.
            - name: POSTGRES_USER
              value: georag_app
            - name: POSTGRES_DB
              value: georag
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: PG_APP_PASSWORD
            - name: REDIS_HOST
              value: {{ .Release.Name }}-redis
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: REDIS_PASSWORD
            - name: QDRANT_HOST
              value: {{ .Release.Name }}-qdrant
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: QDRANT_API_KEY
            - name: FASTAPI_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: FASTAPI_SERVICE_KEY
            # Chat is not the worker's, but Cohere Parse OCR is. optional: true
            # for an air-gapped install with no such key (see fastapi.yaml).
            - name: COHERE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: COHERE_API_KEY
                  optional: true
            # Both default to compose hostnames (http://fastapi:8000,
            # http://laravel.test) that do not resolve here. The first is read
            # by nightly_ingestion_integrity, the second by every progress and
            # workspace-data-updated callback to Laravel.
            - name: FASTAPI_INTERNAL_URL
              value: http://{{ .Release.Name }}-fastapi:{{ .Values.fastapi.service.port }}
            - name: LARAVEL_INTERNAL_URL
              value: http://{{ .Release.Name }}-laravel-octane:{{ .Values.laravelOctane.service.port }}
            # The shared sidecars. Ingest still loads its own dense embedder
            # (passage_embedder ignores EMBEDDING_SERVICE_URL), from the same
            # model name and revision, so the vector spaces match.
            {{- with (include "georag.modelServiceEnv" . | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
            # Writable caches. The image's HF_HOME (/opt/hf_cache, which holds
            # the baked SPLADE++ weights) is read-only for www-data, so the
            # dense embedder's download needs somewhere else to go; without it
            # the embed workflow never executes. Only the SentenceTransformer
            # cache is moved, so the baked SPLADE++ weights are still found.
            - name: SENTENCE_TRANSFORMERS_HOME
              value: /tmp/hf_cache
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/xdg_cache
            - name: MPLCONFIGDIR
              value: /tmp/mpl_cache
            # ADR-0025 follow-up: set explicitly. The code default is now
            # "cohere", which an on-prem / air-gapped install cannot reach (no
            # COHERE_API_KEY here, and no egress), so an unset value would take
            # the hosted default instead of the self-hosted model. MUST be
            # identical on the fastapi (query) and hatchet-worker (ingest)
            # Deployments or one vector space is written and another queried.
            - name: EMBEDDING_BACKEND
              value: "local"
            # Cohere Parse is the default OCR engine (2026-10-04, same rule as
            # EMBEDDING_BACKEND: unset means the hosted engine). It needs
            # COHERE_API_KEY and egress to api.cohere.com; without the key the
            # worker logs one CRITICAL per process and runs Tesseract. An
            # air-gapped site sets `ocr.engine: tesseract` in values.
            - name: OCR_ENGINE
              value: {{ .Values.ocr.engine | quote }}
            # Terrain-model elevation for collars with none in the file.
            # "" turns it off (air-gapped: values-airgap.yaml).
            - name: COLLAR_DEM_URL_TEMPLATE
              value: {{ .Values.terrain.demUrlTemplate | quote }}
            {{- with .Values.hatchet.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources: {{- toYaml .Values.hatchet.worker.resources | nindent 12 }}
{{- end }}
{{- end }}
