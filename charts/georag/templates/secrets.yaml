{{/*
Shared secrets for the whole chart. In production the operator should
either pass `--set-file secrets.postgresPassword=path/to/file` or
create the Secret externally (e.g. via SealedSecrets / ExternalSecrets
operator) and set `global.createSecrets=false`.
*/}}
{{- /* `| default true` here made createSecrets=false a no-op: default treats false as empty. */}}
{{- if .Values.global.createSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Values.global.namespace }}
  labels: {{- include "georag.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | required "secrets.postgresPassword is required" | quote }}
  PG_APP_PASSWORD: {{ .Values.secrets.pgAppPassword | required "secrets.pgAppPassword is required" | quote }}
  MARTIN_DB_PASSWORD: {{ .Values.secrets.martinDbPassword | required "secrets.martinDbPassword is required (hex: `openssl rand -hex 32`)" | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | required "secrets.redisPassword is required" | quote }}
  QDRANT_API_KEY: {{ .Values.secrets.qdrantApiKey | quote }}
  FASTAPI_SERVICE_KEY: {{ .Values.secrets.fastapiServiceKey | required "secrets.fastapiServiceKey is required (32+ chars)" | quote }}
  LARAVEL_APP_KEY: {{ .Values.secrets.laravelAppKey | required "secrets.laravelAppKey is required (`php artisan key:generate --show`)" | quote }}
  HATCHET_CLIENT_TOKEN: {{ .Values.secrets.hatchetClientToken | quote }}
  HATCHET_DB_PASSWORD: {{ .Values.secrets.hatchetDbPassword | default (printf "hatchet-db:%s" .Values.secrets.postgresPassword | sha256sum) | quote }}
{{- if .Values.secrets.cohereApiKey }}
  COHERE_API_KEY: {{ .Values.secrets.cohereApiKey | quote }}
{{- end }}
{{- if .Values.laravelReverb.enabled }}
  REVERB_APP_ID: {{ .Values.secrets.reverbAppId | required "secrets.reverbAppId must not be empty" | quote }}
  REVERB_APP_KEY: {{ .Values.secrets.reverbAppKey | required "secrets.reverbAppKey is required while laravelReverb.enabled (it must equal the VITE_REVERB_APP_KEY baked into the laravel image)" | quote }}
  REVERB_APP_SECRET: {{ .Values.secrets.reverbAppSecret | required "secrets.reverbAppSecret is required while laravelReverb.enabled (`openssl rand -base64 32`)" | quote }}
{{- end }}
{{- end }}
