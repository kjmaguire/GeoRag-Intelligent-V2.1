# ──────────────────────────────────────────────────────────────────
# Air-gapped install — assumes images live in a private registry
# (Harbor / distribution / `ctr image import` into K3s containerd).
# The build_airgap_bundle.sh script generates a tarball containing
# every referenced image; install.sh loads them.
# ──────────────────────────────────────────────────────────────────
global:
  # Point at your customer's private registry. The chart prepends
  # this to every image reference (see templates/_helpers.tpl).
  imageRegistry: "registry.internal.local/georag"
  imagePullPolicy: IfNotPresent
  storageClass: local-path
  ingressClass: traefik

ingress:
  enabled: true
  className: traefik
  host: georag.local
  tls:
    enabled: false  # internal-only by default; layer TLS externally if needed

# values.yaml pins the Hatchet engine by digest (tag@sha256:...). An image that
# has been through `docker save` / `ctr image import` does not keep its registry
# manifest digest, so a pod asking for the digest cannot find the loaded image
# and kubelet tries to pull it. It is named by tag here instead;
# scripts/build_airgap_bundle.sh pulls the digest-pinned reference (the pin is
# verified when the bundle is built) and ships it under this name, and fails the
# build if this tag and the one in values.yaml have drifted apart.
hatchet:
  engine:
    image:
      tag: "v0.91.2"

# No egress, so no Cohere Parse: OCR runs Tesseract in-container.
ocr:
  engine: tesseract

# No egress, so the embedding and reranker sidecars cannot fetch their Qwen3
# weights on first start. Offline makes a cold cache fail at once and say so;
# seed the cache PVCs first (airgap/README.md, "Model weights").
modelSidecars:
  offline: true

# No egress: the collar terrain lookup is off (collars with no elevation in
# the file stay at z = 0). Point it at a local Copernicus mirror to enable.
terrain:
  demUrlTemplate: ""
