apiVersion: v2
name: georag
description: |
  GeoRAG — geological intelligence platform. Single-chart deploy for the
  whole stack (PostgreSQL+PostGIS, Qdrant, Redis, SeaweedFS/MinIO,
  FastAPI, Laravel Octane, Hatchet, Martin). K3s-tuned by default;
  works on vanilla Kubernetes via values-vanilla.yaml.

  LLM inference is not deployed by this chart. Set the Azure AI Foundry
  variables on the FastAPI deployment, or point LLM_BACKEND=vllm at an
  OpenAI-compatible endpoint you run yourself.

type: application
version: 0.1.0
appVersion: "v1.0.0"
kubeVersion: ">=1.27.0"

home: https://georag.local
sources:
  - https://github.com/anthropics/georag

keywords:
  - geology
  - mining
  - rag
  - llm
  - postgis
  - qdrant

maintainers:
  - name: GeoRAG Platform Team

annotations:
  category: AI
  licenses: Apache-2.0
