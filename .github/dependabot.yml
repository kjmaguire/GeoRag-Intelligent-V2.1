# GeoRAG — Dependabot configuration.
#
# Without this file Dependabot only surfaces security advisories; with it
# we also get scheduled version updates (and the advisories get
# auto-resolved when a fix lands upstream).
#
# Strategy:
#   - Weekly cadence to keep PR noise tractable.
#   - Group patch updates per ecosystem so we cut one PR for housekeeping.
#   - Security PRs always fire immediately (Dependabot honours this even
#     when schedule.interval is weekly).
#   - Composer and npm + uv (Python) all opted in.
#   - Reviewers/assignees left unset — repo CODEOWNERS handles routing.
#
# Corrections, 2026-08-22 — two ecosystems were watching the wrong thing:
#
#   pip -> uv     The `pip` updater maintains the constraints in
#                 pyproject.toml but does NOT maintain uv.lock, and since
#                 the 2026-08-21 image fix the production FastAPI image
#                 installs FROM uv.lock (docker/fastapi.Dockerfile). So
#                 the artefact that decides what ships was the one nothing
#                 updated. The `uv` ecosystem maintains both.
#
#   docker "/"    Every Dockerfile lives under /docker, so the updater
#                 found none of them and the digest-pinned base images
#                 (python:3.13-slim, php:8.5-cli) got no PRs at all.
#                 Digest pinning is the right call for reproducibility,
#                 but pinning without an updater is just freezing the CVE
#                 state at the moment someone pinned it.
version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      patch-updates:
        applies-to: version-updates
        update-types: ["patch"]
      laravel:
        patterns: ["laravel/*", "inertiajs/*"]
    commit-message:
      prefix: "chore(composer)"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      patch-updates:
        applies-to: version-updates
        update-types: ["patch"]
      types:
        patterns: ["@types/*"]
      react:
        patterns: ["react", "react-*", "@inertiajs/react"]
    commit-message:
      prefix: "chore(npm)"
      include: "scope"

  # The application service. `uv`, not `pip`: uv.lock is what the
  # production image installs, and the pip updater does not touch it.
  - package-ecosystem: "uv"
    directory: "/src/fastapi"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      patch-updates:
        applies-to: version-updates
        update-types: ["patch"]
      langchain:
        patterns: ["langchain*", "langgraph*", "langsmith*"]
    commit-message:
      prefix: "chore(uv)"
      include: "scope"

  # The two first-party packages the FastAPI image installs alongside the
  # service (see docker/fastapi.Dockerfile). Neither carries a uv.lock —
  # they are libraries, so Dependabot maintains their pyproject
  # constraints, which is what the image resolves against.
  - package-ecosystem: "uv"
    directories:
      - "/src/georag_geoparsers"
      - "/src/georag_object_storage"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      patch-updates:
        applies-to: version-updates
        update-types: ["patch"]
    commit-message:
      prefix: "chore(uv)"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
      include: "scope"

  # Every Dockerfile is under /docker, including the four in their own
  # subdirectories (backup-agent, neo4j-exporter, postgresql). The glob
  # covers both levels; "/" covered neither.
  - package-ecosystem: "docker"
    directories:
      - "/docker"
      - "/docker/**"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
