# Nightly eval-harness gate.
#
# Plan §5b's golden-query benchmark (scripts/run_golden_benchmark.py +
# scripts/compare_benchmarks.py) is the operator entry point for measuring
# RAG quality lift/regression around a deploy. The Hatchet cron that used to
# run the underlying evaluator nightly (`eval_real_rag_nightly`) was removed
# in the runtime-eval trim (09d1d35, 2026-07-27); the evaluator modules under
# src/fastapi/app/services/eval/ were RESTORED 2026-08-14 specifically to
# keep this CLI runnable (see run_golden_benchmark.py's own docstring) — but
# nothing since then has actually run it on a schedule to prove the
# restoration holds up. This workflow closes that gap.
#
# ─── What this workflow DOES gate (BLOCKING) ──────────────────────────────
# That the eval harness itself stays importable and runnable end-to-end:
# real Postgres schema (migrations + eval.golden_questions seeded from the
# committed tests/golden_questions/seed_template.yaml via
# GoldenQuestionsSeeder — the actual SME question corpus, not synthetic
# rows), real Qdrant, real app.services.eval.real_rag_evaluator code path
# (AgentDeps construction, retrieval, response assembly). A crash here
# (import error, schema drift, evaluator exception) means the harness has
# silently bit-rotted again — exactly the failure mode that motivated the
# 2026-08-14 restoration.
#
# ─── What this workflow does NOT (yet) gate — real quality regression ─────
# scripts/compare_benchmarks.py's pass-rate diff against
# bench_results_to_commit_baseline.json is genuinely meaningful ONLY when
# both sides ran against a real LLM + real embeddings. This job's LLM and
# embedding calls are STUBBED (tests/e2e_smoke/stub_backend.py — the same
# stub the "E2E money-path smoke" job in ci.yml uses; see that file's
# docstring for exactly what's real vs faked) because no Cohere / Bedrock
# credentials are available to a GitHub-hosted runner: the only AWS
# identities this repository holds are OIDC roles (AWS_DEPLOY_ROLE_ARN and
# the two Terraform roles), none of which may read COHERE_API_KEY or invoke
# a model, and there is no reachable database or secrets.STAGING_URL either
# (the same gap release-rehearsal.yml's golden/hallucination steps already
# document as continue-on-error for the identical reason). Running
# compare_benchmarks.py here is still worthwhile: it proves the CLI's own
# parsing/diff logic doesn't crash and produces a human-readable diff
# artifact — but its pass/fail verdict is NOT trusted as a quality gate, so
# the step is continue-on-error and its exit code is informational only.
#
# ─── PROMOTION CRITERIA (to a real quality gate) ──────────────────────────
# 1. Give this job a real backend: a COHERE_API_KEY repository secret (chat
#    and embeddings both use it) and credentials for Rerank 3.5 on Bedrock,
#    or a reachable staging FastAPI URL (secrets.STAGING_URL, mirroring
#    release-rehearsal.yml's pattern). Wiring live credentials deserves its
#    own reviewed change.
# 2. Point the "Run golden benchmark" step at that real backend instead of
#    the stub (drop the EMBEDDING_BACKEND/LLM_BACKEND/VLLM_URL overrides
#    below, stop starting stub_backend.py).
# 3. Flip the compare step's continue-on-error to false and decide what a
#    real regression should do (fail the run — this workflow doesn't gate
#    PRs, so "fail" just means a red nightly + notification, not a blocked
#    merge; consider opening an issue automatically on regression).
#
# 2026-08-15 CI-promotion audit: checked, NOT promoted — `gh run list
# --workflow=eval-gate.yml` returns zero runs. It's schedule-triggered
# (05:17 UTC nightly) and was only added 2026-08-14/15, so it hasn't fired
# yet; there is no run history to evaluate. Also note this workflow was
# never a PR-merge gate to begin with (nightly cron, not `pull_request`),
# so "promoting" it is really about item 3 above (trusting the compare
# step's verdict), not branch protection. Re-check after its first
# scheduled run.

name: Eval Gate (nightly)

on:
  schedule:
    # 05:17 UTC — offset from the hour to avoid the GitHub Actions
    # top-of-hour cron thundering herd.
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      per_set:
        description: "Golden questions to run FROM EACH question_set (keep small — LLM/embeddings are stubbed, see workflow header)"
        required: false
        default: "2"

permissions:
  contents: read

env:
  PHP_VERSION: "8.5"
  PYTHON_VERSION: "3.13"

jobs:
  eval-harness-selfcheck:
    name: Eval harness self-check (stubbed LLM — see workflow header)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
        env:
          POSTGRES_USER: georag
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: georag_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U georag"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      qdrant:
        image: qdrant/qdrant:v1.19.1@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
        ports: ["6333:6333"]
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    env:
      POSTGRES_USER: georag
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: georag_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DIRECT_HOST: localhost
      POSTGRES_DIRECT_PORT: "5432"
      POSTGRES_SSLMODE: disable
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      QDRANT_HOST: localhost
      QDRANT_PORT: "6333"
      EMBEDDING_DIMENSION: "1024"
      FASTAPI_SERVICE_KEY: test-service-key-must-be-at-least-32-bytes-long
      HATCHET_CLIENT_TOKEN: eyJhbGciOiAibm9uZSIsICJ0eXAiOiAiSldUIn0.eyJzdWIiOiAiMDAwMDAwMDAtMDAwMC0wMDAwLTAwMDAtMDAwMDAwMDAwMDAwIiwgInNlcnZlcl91cmwiOiAibG9jYWxob3N0OjcwNzAiLCAiZ3JwY19icm9hZGNhc3RfYWRkcmVzcyI6ICJsb2NhbGhvc3Q6NzA3MCJ9.
      # STUBBED — see workflow header. Same stub used by ci.yml's E2E smoke job.
      #
      # 2026-09-16: this block still said EMBEDDING_BACKEND=foundry and set
      # four AZURE_FOUNDRY_* variables. ci.yml's E2E smoke job was moved off
      # that shape on 2026-09-08 (ADR-0022) and this one was missed, so the
      # two had drifted despite the comment above claiming they matched.
      #
      # It was not merely stale, it was broken: `foundry` is a startup ERROR
      # rather than an ignored value, and Settings._reject_retired_azure_config
      # fails startup on ANY AZURE_FOUNDRY_* being set, naming the replacement.
      # This job could not have reached its first assertion.
      #
      # Same fix ci.yml took, for the same reason: Bedrock is reached with
      # boto3/SigV4 and has no configurable base URL, so there is nothing to
      # point at a stub. The stub serves the embedding SIDECAR contract and
      # the job selects that branch, which keeps the runner free of AWS
      # credentials. `local` rather than unset, because the code default is
      # `bedrock` and that short-circuits before EMBEDDING_SERVICE_URL is read.
      EMBEDDING_BACKEND: local
      EMBEDDING_SERVICE_URL: http://localhost:8899
      LLM_BACKEND: vllm
      VLLM_URL: http://localhost:8899/v1
      # The reranker is the stub too (its /rerank route), through the
      # sidecar-proxy branch, and the timeout budgets are ci.yml's E2E smoke
      # job's, for the reasons its env block records. This block carried the
      # embedding and LLM overrides and nothing else, so RERANKER_BACKEND
      # fell to its code default, `bedrock`, which a runner with no AWS
      # credentials cannot call. A reranker outage fails a document query
      # closed (RETRIEVAL_UNAVAILABLE), so every golden question was refused
      # at the reranker. Keep these in step with ci.yml's E2E smoke job.
      RERANKER_BACKEND: cross_encoder
      RERANKER_SERVICE_URL: http://localhost:8899
      RERANKER_TORCH_THREADS: "4"
      TIMEOUT_GATHER_S: "25"
      TIMEOUT_RERANKER_S: "22"
      TIMEOUT_QDRANT_S: "20"

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, swoole
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env 2>/dev/null || true
          php artisan key:generate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: georag_test
          DB_USERNAME: georag
          DB_PASSWORD: test_password

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: georag_test
          DB_USERNAME: georag
          DB_PASSWORD: test_password

      # GoldenQuestionsSeeder::SEEDER_AUTHOR_USER_ID = 971 (kyle@georag.local)
      # is a hardcoded FK into public.users. A fresh CI database has no such
      # row, so the seed would fail on the FK constraint (see migration
      # 2026_05_13_140000_create_eval_schema.php) without this placeholder.
      - name: Seed placeholder author user (FK target for golden questions)
        run: |
          PGPASSWORD=test_password psql -h localhost -U georag -d georag_test -c "
            INSERT INTO users (id, name, email, email_verified_at, password, created_at, updated_at)
            VALUES (971, 'CI Eval Seeder', 'kyle@georag.local', NOW(), 'unused', NOW(), NOW())
            ON CONFLICT (id) DO NOTHING;
            SELECT setval(pg_get_serial_sequence('users','id'), GREATEST((SELECT MAX(id) FROM users), 1));
          "

      # 2026-08-18: this step used to omit the env: block that every other
      # Laravel step here carries. Without it Laravel falls back to the .env
      # copied from .env.example in "Prepare environment", which points at the
      # docker-compose hostname (pgbouncer:6432) — unresolvable on a GitHub
      # runner. The seeder therefore died with "could not translate host name
      # \"pgbouncer\"" before a single golden question was written, and every
      # downstream step (benchmark, baseline diff) never got real input, so the
      # nightly gate had stopped measuring anything at all.
      - name: Seed golden questions (real SME corpus)
        run: php artisan db:seed --class=GoldenQuestionsSeeder --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: georag_test
          DB_USERNAME: georag
          DB_PASSWORD: test_password

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install FastAPI dependencies
        working-directory: src/fastapi
        run: uv sync --extra dev

      - name: Bootstrap Qdrant collections
        working-directory: src/fastapi
        run: uv run python scripts/init_qdrant.py

      - name: Start stub Foundry backend (embeddings + LLM)
        working-directory: src/fastapi
        run: |
          uv run python tests/e2e_smoke/stub_backend.py --port 8899 &
          echo $! > /tmp/stub_backend.pid
          for i in $(seq 1 20); do
            curl -sf http://localhost:8899/health > /dev/null && exit 0
            sleep 1
          done
          echo "::error::stub backend did not become healthy"
          exit 1

      # Gives the corpus SOME real content so retrieval isn't a guaranteed
      # 100% refusal on every question — reuses the exact ingest leg the
      # E2E smoke job in ci.yml exercises. Most golden questions reference
      # projects/entities this single fixture doesn't have, so most will
      # still fail/refuse — expected and fine; this step is about proving
      # the harness runs, not about a real pass rate (see workflow header).
      - name: Ingest fixture PDF (some real retrieval content)
        working-directory: src/fastapi
        continue-on-error: true
        run: uv run python scripts/ci/e2e_smoke_ingest.py

      # BLOCKING: a crash here (import error, schema drift, evaluator
      # exception) means the eval harness has bit-rotted again. Pass rate
      # itself is NOT gated (--strict is intentionally omitted — the LLM is
      # stubbed, see workflow header) and the harness is best-effort
      # per-question by design (run_golden_benchmark.py docstring).
      #
      # --per-set, NOT --max-questions. The cap used to be a head slice of a
      # list ordered by (question_set, question_id), so `--max-questions 10`
      # against the 34-question corpus ran 3 core_chat + 7 numeric_grounding
      # and never once reached refusal_correctness or
      # public_private_boundary — the two sets whose validators are
      # non-vacuous, and the second of which thresholds.py declares a §2.9
      # regulatory anchor with a zero-regression cap. The only scheduled
      # eval in the system could not observe a regression in the one thing
      # it is required to observe.
      - name: Run golden benchmark (harness self-check)
        working-directory: src/fastapi
        run: |
          uv run python scripts/run_golden_benchmark.py \
            --per-set "${{ github.event.inputs.per_set || '2' }}" \
            --label ci-nightly-harness-selfcheck \
            --output bench_results/ci_nightly.json

      # The step above is "blocking" only against a crash of the CLI itself.
      # run_golden_benchmark.py is best-effort per question by design: an
      # evaluator exception is caught, written to the report as
      # `failure_layer: "evaluator_crashed"`, and the process exits 0 unless
      # --strict is passed. So an evaluator that crashed on every question
      # left this job green — the bit-rot the header says this job exists to
      # catch. --strict is still omitted (it also fails on any wrong answer,
      # and the LLM is stubbed); this reads the report for the crash marker
      # alone, and for a run that evaluated nothing.
      - name: Fail on evaluator crashes (harness self-check)
        working-directory: src/fastapi
        run: |
          report=bench_results/ci_nightly.json
          total=$(jq '.results | length' "$report")
          crashed=$(jq '[.results[] | select(.failure_layer == "evaluator_crashed")] | length' "$report")
          echo "evaluated $total question(s); $crashed crashed the evaluator"
          if [ "$total" -eq 0 ]; then
            echo "::error::the benchmark evaluated no questions - the harness ran and measured nothing"
            exit 1
          fi
          if [ "$crashed" -gt 0 ]; then
            jq -r '.results[] | select(.failure_layer == "evaluator_crashed") | "  \(.question_id): \(.failure_detail_first_200)"' "$report"
            echo "::error::$crashed of $total golden question(s) crashed the evaluator (failure_layer evaluator_crashed)"
            exit 1
          fi

      # DISABLED 2026-08-21 — the comparison was worse than no comparison.
      #
      # bench_results_to_commit_baseline.json is dated 2026-05-28, carries
      # git_sha "unknown", covers 20 questions at a 20% pass rate, and
      # predates the Qwen3 embedding/reranker swap (2026-06-03), the Layer-1
      # threshold recalibration, the Cohere/Foundry migration and the
      # ADR-0010 collection cutover. The candidate side is generated against
      # a STUBBED LLM and stubbed embeddings. compare_benchmarks only diffs
      # question IDs present in both reports, and only 2 of the baseline's
      # 20 IDs are reproducible from the committed corpus — so the delta it
      # printed was computed over a 2-question overlap between two
      # incomparable stacks. Being `continue-on-error`, it always reported
      # green, and a green diff reads as evidence of stability.
      #
      # Re-enable only with a baseline regenerated against the current stack
      # and committed with a real git_sha. `meta.model_stack` now records
      # the fingerprint (llm/embedding/reranker deployment + collection), so
      # a future baseline can be checked for comparability before it is
      # trusted; compare_benchmarks refuses mismatched stacks.
      - name: Diff against committed baseline (informational)
        if: ${{ hashFiles('bench_results_current_baseline.json') != '' }}
        working-directory: src/fastapi
        continue-on-error: true
        run: |
          uv run python scripts/compare_benchmarks.py \
            ../../bench_results_current_baseline.json \
            bench_results/ci_nightly.json --json \
            | tee bench_results/ci_nightly_diff.json

      - name: Upload benchmark + diff artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eval-gate-${{ github.run_number }}
          path: |
            src/fastapi/bench_results/ci_nightly.json
            src/fastapi/bench_results/ci_nightly_diff.json
          retention-days: 30

      - name: Stop stub backend
        if: always()
        run: |
          [ -f /tmp/stub_backend.pid ] && kill "$(cat /tmp/stub_backend.pid)" 2>/dev/null || true
