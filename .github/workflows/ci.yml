name: GeoRAG CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.5"
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.13"

# Least-privilege default for every job in this file. CodeQL's
# actions/missing-workflow-permissions flags a workflow with no explicit
# block because it then inherits the repository default, which can be
# read-write for the whole repo. Jobs that genuinely need more (SARIF
# upload, OIDC, package push) keep their own `permissions:` block, which
# overrides this one rather than adding to it.
permissions:
  contents: read

jobs:
  # ==========================================================================
  # Production-privilege migration gate
  #
  # Every other job here runs migrations as a SUPERUSER against a database
  # built only by the migration chain. Azure is neither of those things, and
  # the gap cost two red deploys on 2026-08-19:
  #
  #   #132  GRANT ... ON ALL TABLES IN SCHEMA audit
  #         -> permission denied for table integration_credentials_audit
  #   #136  ALTER TABLE workspace.workspace_roles ENABLE ROW LEVEL SECURITY
  #         -> must be owner of table workspace_roles
  #
  # Both are the same shape: DDL that requires OWNERSHIP, against a table that
  # database/raw/ created out of band under a different role. Neither is
  # reproducible in the jobs above, for two independent reasons — the local
  # role is a superuser (superusers bypass ownership checks entirely), and CI
  # never applies database/raw/ at all, so those tables are migration-created
  # and therefore owned by the migrating role.
  #
  # This job reproduces production's privilege model instead:
  #   - `bootstrap` applies database/raw/, so it OWNS those objects
  #   - `georag_ci` runs the migrations, is NOT a superuser, and is NOT a
  #     member of `bootstrap`
  #
  # Advisory to start with. Promote to blocking once it has been green for a
  # few runs — it is a new gate over a chain that has never been exercised
  # this way, so an initial red is likelier to be a gap in this job than a
  # real regression.
  # ==========================================================================
  # PROMOTED TO BLOCKING 2026-08-21. This job was advisory and red on
  # every run since it was added, which is the worst of both states: it
  # generated noise, blocked nothing, and — because it was ALWAYS red — a
  # genuinely new regression of the class it was built for would have been
  # indistinguishable from the standing failure.
  #
  # It was red on TWO blockers, not one. The second was invisible until the
  # first was fixed, because a chain that dies at migration N never reveals
  # what migration N+40 would have done:
  #
  #   1. 2026_06_28_120000 `CREATE EVENT TRIGGER audit_partition_rls_enforce`
  #      — event triggers require superuser, which neither Azure Flexible
  #      Server nor this job's roles have. Now guarded WHEN
  #      insufficient_privilege (and see that migration: the trigger does
  #      not exist in production either, which is its own problem).
  #   2. 2026_08_19_050000 `ALTER DEFAULT PRIVILEGES FOR ROLE georag` — a
  #      hardcoded production role name. Here the migration role is
  #      `georag_ci`, so it died with
  #        SQLSTATE[42704] ERROR: role "georag" does not exist
  #      Now CURRENT_USER, which is what grantPerObject() in the same file
  #      already resolved via pg_has_role(current_user, ...).
  #
  # Verified before promoting, not assumed: the full chain was run locally
  # against postgis/postgis:18-3.6 under this exact role split (no
  # superusers, no membership between bootstrap and georag_ci,
  # MIGRATE_DB_CONNECTION unset just as `cp .env.example .env` leaves it),
  # reaching `migrate exit=0`. Both ownership shapes were tested — bootstrap
  # owning 0 relations and bootstrap owning 5 — because of the fidelity note
  # below. If this job goes red, it is reporting a real ownership or
  # privilege regression; re-adding continue-on-error is not the fix.
  #
  # FIDELITY CAVEAT worth knowing: the phase0 apply below iterates
  # `database/raw/phase0/*.sql`, and glob order is lexical, so `100-` runs
  # before `20-`. Most files therefore fail on a schema an earlier-numbered
  # file has not created yet, and a single pass leaves `bootstrap` owning
  # ZERO relations — i.e. the ownership split this gate exists to reproduce
  # is largely not set up. Applying the directory three times gets bootstrap
  # to 5 tables (interpretation.* and backups.snapshot_runs). Sorting the
  # files properly, or applying twice, would make the gate meaningfully
  # stricter than it is today.
  migrations-production-privileges:
    name: Migrations under production privileges
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgis/postgis:18-3.6@sha256:f81dd52da147ac849428d777f30efa8d51ff6aea879fc020edde76b20d53f7b2
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_root_password
          POSTGRES_DB: georag_privtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, swoole
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Create production-shaped roles
        env:
          PGPASSWORD: ci_root_password
        run: |
          psql -h localhost -U postgres -d georag_privtest -v ON_ERROR_STOP=1 <<'SQL'
          -- Mirrors Azure: no superusers anywhere, and the role that applies
          -- the raw bootstrap is distinct from the one running migrations.
          CREATE ROLE bootstrap  NOSUPERUSER LOGIN PASSWORD 'bootstrap_pw';
          -- CREATEROLE because the chain provisions its own roles --
          -- 2026_04_09_173750 issues `CREATE ROLE georag_app NOLOGIN` and
          -- three siblings. Production's migration role can plainly do this
          -- (those roles exist on Azure), so withholding it here would make
          -- the gate fail on something production allows, which is the
          -- opposite of the fidelity this job is for.
          --
          -- Still NOSUPERUSER: superuser is what would defeat the whole gate,
          -- because superusers bypass the ownership checks it exists to
          -- reproduce.
          CREATE ROLE georag_ci  NOSUPERUSER LOGIN PASSWORD 'georag_ci_pw' CREATEDB CREATEROLE;
          CREATE ROLE georag_app NOSUPERUSER LOGIN PASSWORD 'georag_app_pw';
          -- Deliberately NO membership between bootstrap and georag_ci: that
          -- absence is the whole point of this job.
          GRANT ALL ON DATABASE georag_privtest TO bootstrap, georag_ci;
          -- PostgreSQL 15 revoked the implicit CREATE that every role used
          -- to hold on schema `public`. Without this the job died on its
          -- FIRST statement --
          --   create table "migrations" ... -> permission denied for schema public
          -- so the gate has never once run a migration since it was added.
          -- It is advisory, so it failed quietly and looked like coverage
          -- while providing none: exactly the failure mode it exists to
          -- catch elsewhere.
          --
          -- GRANT ON SCHEMA, deliberately not ALTER DEFAULT PRIVILEGES or a
          -- role membership: the point of this job is that georag_ci can
          -- create its own objects but does NOT inherit rights over the ones
          -- `bootstrap` already owns. Widening it further would dissolve the
          -- ownership split the gate is built to reproduce.
          GRANT ALL ON SCHEMA public TO bootstrap, georag_ci;
          SQL

      - name: Apply database/raw as the bootstrap role
        env:
          PGPASSWORD: bootstrap_pw
        run: |
          # Best-effort: some raw files assume objects the migration chain
          # creates later, so a clean apply is not expected and not required.
          # What matters is that the objects which DO land are owned by
          # `bootstrap`, reproducing Azure's split ownership.
          shopt -s nullglob
          for f in database/raw/phase0/*.sql; do
            psql -h localhost -U bootstrap -d georag_privtest -f "$f" >/dev/null 2>&1 || true
          done
          psql -h localhost -U bootstrap -d georag_privtest -At -c             "SELECT 'bootstrap owns ' || count(*) || ' relation(s)'
             FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
             WHERE c.relkind IN ('r','p')
               AND pg_get_userbyid(c.relowner) = 'bootstrap';"

      - name: Prepare environment
        run: |
          cp .env.example .env 2>/dev/null || true
          php artisan key:generate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: georag_privtest
          DB_USERNAME: georag_ci
          DB_PASSWORD: georag_ci_pw

      - name: Run migrations as a non-superuser, non-owner
        # The actual gate. A migration issuing ownership-requiring DDL against
        # a bootstrap-owned table fails HERE instead of in a deploy.
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: georag_privtest
          DB_USERNAME: georag_ci
          DB_PASSWORD: georag_ci_pw

      - name: Report ownership split
        if: always()
        env:
          PGPASSWORD: georag_ci_pw
        run: |
          psql -h localhost -U georag_ci -d georag_privtest -c             "SELECT pg_get_userbyid(c.relowner) AS owner, count(*) AS relations
             FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
             WHERE c.relkind IN ('r','p')
               AND n.nspname NOT IN ('pg_catalog','information_schema')
             GROUP BY 1 ORDER BY 2 DESC;" || true

  # ─── Laravel lint + test ──────────────────────────────────────────────
  laravel:
    name: Laravel (Pint + PHPUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        # H-A4-03 fix (Chunk 10.1): bumped from postgis/postgis:17-3.5 to
        # postgis/postgis:18-3.6 to match the production PostgreSQL major version.
        # Production uses the alpine variant (docker-compose.yml); CI uses the
        # Debian variant because GitHub Actions runners use apt-get, not apk.
        # Both variants carry PostgreSQL 18 + PostGIS 3.6 — the major version
        # match is what closes H-A4-03.
        # Digest pinned (Chunk 10.2): sha256 captured 2026-04-26 from
        # docker pull postgis/postgis:18-3.6 on the Debian (non-alpine) variant.
        # Re-pin when upgrading PostGIS minor version.
        image: postgis/postgis:18-3.6@sha256:f81dd52da147ac849428d777f30efa8d51ff6aea879fc020edde76b20d53f7b2
        env:
          POSTGRES_USER: georag
          # 2026-08-17 CI-gap audit: matches phpunit.pgsql.xml's hardcoded
          # DB_PASSWORD (kept in sync with the dev docker-compose
          # `postgresql` service's real password — see that file's own
          # header) rather than the arbitrary `test_password` this job used
          # to use, so the new "Run PHPUnit (Postgres-gated suite)" step
          # below can authenticate without editing phpunit.pgsql.xml
          # itself (which would break the documented local-dev workflow).
          # Every other step in THIS job that connects directly (Prepare
          # environment / Run migrations / SQLite fast suite) was updated
          # to match; the pgtap / schema-and-qdrant-drift / e2e-smoke jobs
          # below have their own independent postgres service and are
          # unaffected.
          POSTGRES_PASSWORD: georag_dev_password
          POSTGRES_DB: georag_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U georag"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      # 2026-08-20: added because IngestionProgressBroadcastControllerTest
      # exists to verify the Redis-backed side effects of a terminal
      # ingestion — the data_version bump (SETNX-guarded) and the
      # MV-refresh debounce stamp. With no Redis service those tests were
      # asserting against a connection error, not against behaviour.
      #
      # They were previously invisible: the whole Postgres suite was failing
      # on an unrelated 27-byte APP_KEY, so nobody read the results. With
      # that fixed, the controller was hardened to degrade rather than 500
      # when Redis is gone — and this service is what lets the HAPPY path be
      # tested too, instead of only the degraded one.
      redis:
        # Digest captured 2026-08-20 from `docker pull redis:8-alpine`,
        # matching how the postgres service above is pinned.
        image: redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, swoole
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # FoundryRoutesSmokeTest (and any other Inertia::render() assertion)
      # needs a real Vite manifest to resolve asset paths — without it,
      # every such test fails with "Vite manifest not found at
      # public/build/manifest.json". This job never built the frontend
      # before, so that failure was masked behind the migration/role/
      # paratest gaps that used to fail earlier in the run.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Vite build
        run: npm run build

      - name: Run Laravel Pint (lint)
        run: vendor/bin/pint --test

      - name: Prepare environment
        run: |
          cp .env.example .env 2>/dev/null || true
          php artisan key:generate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: georag_test
          DB_USERNAME: georag
          DB_PASSWORD: georag_dev_password

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: georag_test
          DB_USERNAME: georag
          DB_PASSWORD: georag_dev_password

      # 2026-08-17 CI-gap audit: this step's own env: block sets
      # DB_CONNECTION=pgsql, but `php artisan test` loads phpunit.xml by
      # default, and phpunit.xml declares
      # `<env name="DB_CONNECTION" value="sqlite" force="true"/>` —
      # `force="true"` overwrites the process environment regardless of
      # how it was set (see phpunit.pgsql.xml's own header / docs/
      # RUNBOOK.md "Test environment gotchas"), so this step has always
      # run the entire suite under SQLite. That's correct FOR THIS STEP —
      # it's the fast/mockable suite — but it means every
      # `Tests\Concerns\RequiresPostgres` / `skipIfSqlite()`-gated test
      # (real Postgres/PostGIS/RLS/tenancy regression coverage) has been
      # silently self-skipping here forever, with no PR-time gate ever
      # actually exercising them. The step below closes that gap.
      - name: Run PHPUnit (SQLite fast suite)
        run: php artisan test --parallel
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: georag_test
          DB_USERNAME: georag
          DB_PASSWORD: georag_dev_password

      # phpunit.pgsql.xml hardcodes DB_HOST=postgresql to match the dev
      # docker-compose service name it's normally run against (see its
      # own header and docs/RUNBOOK.md) — that hostname doesn't exist on
      # a bare `ubuntu-latest` runner, whose service container is only
      # reachable at `localhost`. Alias it via /etc/hosts rather than
      # editing phpunit.pgsql.xml's forced env (which would break the
      # documented local-dev workflow). The service's password was
      # updated above to match phpunit.pgsql.xml's hardcoded value.
      #
      # Not run with --parallel: phpunit.pgsql.xml's testsuite ordering
      # is hand-authored so RefreshDatabase suites populate the schema
      # before the read-only/catalog suite inspects it (see its header) —
      # ParaTest's default per-file worker split doesn't preserve that,
      # and the config targets one literal database name rather than
      # Laravel's parallel-testing per-process DB suffixing. The suite is
      # ~30 files; serial execution here is a non-issue on time.
      - name: Alias postgres service as `postgresql` for phpunit.pgsql.xml
        run: echo "127.0.0.1 postgresql" | sudo tee -a /etc/hosts

      # Same trick for Redis. .env.example sets REDIS_HOST=redis (the
      # docker-compose service name) and phpunit.pgsql.xml does not override
      # it, so the suite resolves `redis` — which on a runner is nothing.
      # Aliasing is preferable to overriding REDIS_HOST in phpunit.pgsql.xml,
      # which would break the documented local-dev workflow the same way
      # editing DB_HOST would.
      - name: Alias redis service as `redis`
        run: echo "127.0.0.1 redis" | sudo tee -a /etc/hosts

      - name: Run PHPUnit (Postgres-gated suite)
        run: php artisan test -c phpunit.pgsql.xml

  # ─── Python lint ──────────────────────────────────────────────────────
  python-lint:
    name: Python (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install ruff

      - name: Lint FastAPI
        run: ruff check src/fastapi/

      - name: Lint Dagster
        run: ruff check src/dagster/

      # Storage-abstraction plan PR1 — new shared package, own lint target.
      - name: Lint georag_object_storage
        run: ruff check src/georag_object_storage/

      # Geology format parsers — shared by the Hatchet ingestion workflows.
      # Own lint target for the same reason as georag_object_storage: it is a
      # sibling package, so `ruff check src/fastapi/` never reaches it.
      - name: Lint georag_geoparsers
        run: ruff check src/georag_geoparsers/

      # ruff's S110/BLE001 would flag all 262 existing sites at once, and
      # the only ways to land that are one unreviewable diff or `# noqa`
      # everywhere -- which turns a real signal into decoration. This
      # ratchets per file instead: existing debt is visible and attributed,
      # new silent handlers fail.
      - name: Handler discrimination (the ratchet must reject, not just pass)
        run: bash scripts/tests/silent_exception_handlers_test.sh

      - name: No new exception handlers that tell nobody
        run: python scripts/check_silent_exception_handlers.py

      # Report only — never fails the job. A 2026-08-22 audit found ~3,400
      # lines across ten modules with no importer, on top of ~1,700 lines of
      # hallucination layers and ~630 lines of prompt modules deleted the
      # same week. Dead code is cheap on its own; what it costs is belief —
      # services/dispatchers/pagerduty.py has a full passing test file, so
      # CI reads as "PagerDuty alerting verified" while nothing dispatches
      # to it.
      #
      # Deleting them has a blast radius (several have tests, and CLAUDE.md
      # puts test removal behind approval). Measuring them does not, and a
      # number that either shrinks or visibly does not is what turns this
      # from a one-off audit finding into something someone acts on.
      - name: Dead-module report (report only)
        if: always()
        run: python3 scripts/report_dead_modules.py >> "$GITHUB_STEP_SUMMARY" || true

      # Doc-phase 125 — incident-driven gate. Catches the doc-phase 122
      # failure mode (app/main.py imports `sentry_sdk` but pyproject's
      # `dependencies` had been edited to remove `sentry-sdk[fastapi]`).
      # Pure-stdlib script; runs in <1 second.
      - name: Pyproject covers app imports (FastAPI)
        run: python3 scripts/check_pyproject_covers_imports.py

      # Doc-phase 126 — same gate, Dagster side. Both targets share the
      # one script + allow-list.
      - name: Pyproject covers app imports (Dagster)
        run: python3 scripts/check_pyproject_covers_imports.py src/dagster/pyproject.toml src/dagster/georag_dagster

      # The gate above proves pyproject DECLARES what the app imports.
      # This one proves the production image INSTALLS what CI tested.
      # docker/fastapi.Dockerfile used to run `uv pip install -r
      # pyproject.toml` — uv's pip interface, which re-resolves the
      # version ranges at build time and never reads uv.lock. CI installs
      # with `uv sync`, which does. Two independent resolutions, minutes
      # apart, nothing comparing them: anything published inside a range
      # between them shipped untested. The image now installs the
      # committed export, and this step is what stops that export drifting
      # away from the lock it came from.
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
      - name: Locked dependency export matches uv.lock
        run: python3 scripts/check_fastapi_lock_export.py

      # A Settings field nothing reads is not dead code — it is a control
      # that looks like it works. 21 of 143 were in that state: an
      # operator raising AZURE_FOUNDRY_MAX_TOKENS to widen the output
      # ceiling got no change, because the Foundry path reads
      # LLM_MAX_OUTPUT_TOKENS. Four were set in docker-compose.yml.
      #
      # Deleting one is a TWO-part change and CI cannot see the second
      # half: Settings sets extra="forbid", and a key left behind in a
      # .env FILE raises at startup (an unmatched OS environment variable
      # is merely ignored — measured, the two paths differ). The checker
      # names the config files each dead field still appears in.
      - name: Every Settings field has a reader
        run: python3 scripts/check_settings_have_readers.py

      # Phase 0 #16 — orchestration-boundary gate. Fails the build if
      # LangGraph code starts doing work owned by Hatchet (durable
      # workflow + retry, or outbound webhooks via the outbox dispatcher —
      # Kestra, the previous owner of that concern, was retired 2026-07-28
      # having never actually been deployed). See master plan v2.4.2 §1
      # and scripts/ci/langgraph_boundary_check.sh.
      - name: LangGraph boundary check (§1 stack discipline)
        run: bash scripts/ci/langgraph_boundary_check.sh

      # 2026-08-21 — sixty hand-rolled Postgres DSN builders had accumulated,
      # one per Hatchet workflow, already drifted four ways (two of them
      # hardcoded :5432 and ignored POSTGRES_DIRECT_PORT). They are now one
      # import from app/db/dsn.py; this keeps them from growing back.
      - name: DSN single-source check
        run: bash scripts/ci/dsn_single_source_check.sh

  # ─── Qwen / Ollama config-drift guard ────────────────────────────────
  # Cheap stdlib-only check that the four cross-file Qwen settings stay
  # consistent across .env.example, docker-compose.yml, and config.py.
  # Cost-justified after the 2026-04-27 review found three live drifts
  # (LLM_PRIMARY_MODEL, OLLAMA_NUM_CTX, MAX_CONTEXT_TOKENS).
  qwen-config-drift:
    name: Qwen config drift guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run drift guard
        run: python scripts/check_qwen_config_drift.py

  # ─── Nightly scheduler jobs ─────────────────────────────────────────
  # shutdown-scheduler-cc and startup-scheduler-cc carry their bash as an
  # inline `args` string on the Azure job resource, so the deployed body
  # is a copy of a copy and neither this CI nor cd.yml applies it. Two
  # things are therefore worth gating even though the apply is manual:
  # that the reviewed .sh and the YAML copy have not diverged, and that
  # the cron's UTC hours still resolve to the guard's target local hour.
  #
  # The second one is not theoretical. When the maintenance window moved
  # from US-Eastern to US-Pacific on 2026-08-21, changing the guard
  # without the cron would have left both jobs permanently skipping --
  # and a skip exits 0 and looks exactly like a correct off-hour skip, so
  # nothing downstream would have noticed the shutdown had stopped
  # running. The tests below also pin the behaviour that makes a failed
  # sweep visible at all (see the scripts' headers).
  scheduler-jobs:
    name: Nightly scheduler jobs
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Sweep script behaviour
        run: bash deploy/azure/containerapps/scripts/tests/run.sh
      - name: Inline-args parity and cron/guard agreement
        run: python scripts/check_scheduler_job_parity.py

  # ─── ACR orphan sweep guard ─────────────────────────────────────────
  # scripts/ci/acr_orphan_sweep.py deletes manifests, irreversibly, from
  # the registry production pulls from. The 2026-08-24 audit found five
  # ways it could delete the wrong thing; these stdlib-only tests pin the
  # fixes: deletion is opt-in via --delete (a scheduled run that passes no
  # flag can never delete), an index declaring zero children aborts the
  # sweep, unknown media types are never deleted or unprotected, a null
  # createdTime cannot crash mid-loop, and a manifest retagged between
  # listing and delete (the buildcache race) is kept.
  acr-orphan-sweep:
    name: ACR orphan sweep guard
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Sweeper safety behaviour
        run: python scripts/ci/tests/test_acr_orphan_sweep.py

  # ─── Deployment manifest invariants ───────────────────────────────────
  # Redis is deployed five different ways (Container Apps, Helm, and three
  # kubernetes/manifests variants) and every one of them was wrong in a
  # way that looked fine in isolation:
  #
  #   * the Azure lift copied `--appendonly yes` from docker-compose.yml
  #     and did not copy `volumes: redis_data:/data`, so the queue
  #     durability that flag exists to provide has never existed there --
  #     while the nightly scheduler restarts the app twice a day. It also
  #     dropped `--save ""`, silently leaving RDB snapshots running too.
  #   * the live app had drifted to `--maxmemory 512mb` inside a 0.5Gi
  #     container. Those are the same number of bytes, so Redis's own
  #     guard was unreachable: the platform OOM-kills the container before
  #     any eviction policy can run.
  #   * all four k8s/Helm targets set no --maxmemory at all under a 2Gi
  #     limit, which is the same failure with no guard configured.
  #
  # Neither rule is style. Both are "this config does not do what its own
  # comment says it does", which review does not catch and a checker does.
  deployment-manifests:
    name: Deployment manifest invariants
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Checker rejects the shapes that shipped
        run: bash scripts/tests/redis_manifests_test.sh
      - name: Redis persistence and memory-headroom invariants
        run: python scripts/check_redis_manifests.py
      # coverage.yml runs weekly, so its merger would otherwise only be
      # exercised once a week -- and a wrong merge prints a plausible
      # percentage rather than failing.
      - name: Clover merge is a union, not a last-write-wins
        run: bash scripts/tests/merge_clover_test.sh

  # ─── Schema/Qdrant drift smoke gate ───────────────────────────────────
  # 2026-08-04 incident: two schema-drift bugs shipped straight through
  # this CI to a live deployment because neither Postgres nor Qdrant ever
  # actually gets built and checked here on a PR. The `laravel` job's
  # Postgres service only proves migrations *apply*; nothing asserted that
  # FastAPI's Python code and the migrated schema actually agree
  # (page_first/page_last existed in the DB but no migration created them
  # until fixed live). Likewise nothing ever provisioned a real Qdrant and
  # confirmed georag_chunks/georag_reports exist — that gap was hit live
  # too. python-test's Bucket 1 (see comment above, C-A4-01) deliberately
  # excludes integration/golden/hallucination/live to keep the fast PR
  # suite cheap, and Bucket 3 (release-rehearsal.yml) only runs on
  # workflow_dispatch/tag push — so this exact class of bug had no PR-time
  # gate at all. This job is deliberately narrow (not a substitute for
  # release-rehearsal.yml's full integration pass): it just proves the two
  # concrete things that broke.
  raw-migration-parity:
    name: Raw SQL / migration parity gate
    runs-on: ubuntu-latest
    timeout-minutes: 3

    # GeoRAG has two DDL layers. database/migrations/ is run by CD and is in
    # sync with Azure; database/raw/ is applied by hand locally and by the
    # migrations-production-privileges job below against a throwaway Postgres.
    # cd.yml has no equivalent step, so on Azure the raw layer has never run --
    # 22 objects exist only there, and live code queries several of them.
    #
    # Nothing compared the two layers, which is why that went unnoticed for
    # months. This job compares them. The existing gap is baselined in
    # scripts/raw-parity-baseline.txt so the gate could land immediately;
    # anything NEW fails, and so does a baselined entry that has been closed
    # but left in the file. The list can only shrink.
    #
    # No database needed -- it reads both trees off disk.
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Compare database/raw against the migration chain
        run: php scripts/check-raw-migration-parity.php

      # Separate concern, same job because both are cheap disk reads with no
      # services. On 2026-08-21 a live dev-cluster Postgres password was found
      # in 25 tracked files of this PUBLIC repo, put there deliberately to
      # keep the test config "in sync" with a running container — and running
      # this check for the first time immediately turned up two more, an S3
      # secret key and a Redis password, that the audit had missed.
      #
      # GitHub secret scanning did not catch any of them: push protection is
      # enabled but `secret_scanning_non_provider_patterns` is disabled, so a
      # generic password matches no pattern and nothing looks at it.
      - name: Check for committed credentials
        run: php scripts/check-no-committed-secrets.php

  schema-and-qdrant-drift:
    name: Schema/Qdrant drift smoke gate
    runs-on: ubuntu-latest
    timeout-minutes: 8

    services:
      postgres:
        image: postgis/postgis:18-3.6@sha256:f81dd52da147ac849428d777f30efa8d51ff6aea879fc020edde76b20d53f7b2
        env:
          POSTGRES_USER: georag
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: georag_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U georag"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      qdrant:
        image: qdrant/qdrant:v1.17.1@sha256:94728574965d17c6485dd361aa3c0818b325b9016dac5ea6afec7b4b2700865f
        ports: ["6333:6333"]

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, swoole
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env 2>/dev/null || true
          php artisan key:generate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: georag_test
          DB_USERNAME: georag
          DB_PASSWORD: test_password

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: georag_test
          DB_USERNAME: georag
          DB_PASSWORD: test_password

      # The concrete check for the first live incident: assert every
      # column app/hatchet_workflows/ingest_pdf.py's INSERT_PASSAGE_SQL
      # writes actually exists after a from-scratch migration run.
      # Queried through PDO rather than psql. This step used to run
      # `sudo apt-get update && apt-get install postgresql-client` first,
      # which hung often enough to cancel the whole job on its 8-minute
      # timeout roughly 5 runs in 11. A gate that fails half the time
      # teaches people to ignore it, which is worse than not having it.
      # Nothing needed installing: this job already sets up PHP with
      # pdo_pgsql above and has just run `php artisan migrate` against
      # this very database.
      #
      # The column names go in as bound parameters rather than inline
      # literals, which keeps the SQL free of any quote character that
      # would have to survive PHP string parsing inside a single-quoted
      # `php -r` inside a YAML block scalar. Verified against a real
      # database in both directions before landing: exit 0 with the
      # "present" line when the columns exist, exit 1 naming the column
      # when one does not.
      - name: Assert silver.document_passages has page_first/page_last
        run: |
          php -r '
            $dsn = "pgsql:host=localhost;port=5432;dbname=georag_test";
            $pdo = new PDO($dsn, "georag", "test_password", [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
            $stmt = $pdo->prepare(
              "SELECT string_agg(col, ?::text)
                 FROM unnest(ARRAY[?::text, ?::text]) AS col
                WHERE col NOT IN (
                  SELECT column_name FROM information_schema.columns
                   WHERE table_schema = ?::text AND table_name = ?::text
                )"
            );
            $stmt->execute([", ", "page_first", "page_last", "silver", "document_passages"]);
            $missing = $stmt->fetchColumn();
            if (is_string($missing) && $missing !== "") {
              fwrite(STDERR, "::error::silver.document_passages is missing column(s): " . $missing . " - a migration was reverted or never written. This is the exact live incident from 2026-08-04." . PHP_EOL);
              exit(1);
            }
            echo "silver.document_passages.page_first/page_last present." . PHP_EOL;
          '

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install FastAPI dependencies
        working-directory: src/fastapi
        run: uv sync --extra dev

      # The concrete check for the second live incident: init_qdrant.py IS
      # the bootstrap script, but nothing in this deployment's runtime path
      # ever calls it automatically — provisioning has always been a manual
      # step. Running it here against a fresh service Qdrant proves it still
      # actually creates georag_chunks/georag_reports at the right
      # dimension; its own internal verification exits non-zero on failure.
      - name: Bootstrap and verify Qdrant collections
        working-directory: src/fastapi
        run: uv run python scripts/init_qdrant.py
        env:
          QDRANT_HOST: localhost
          QDRANT_PORT: "6333"
          EMBEDDING_DIMENSION: "1024"

  # ─── E2E money-path smoke (BLOCKING since 2026-08-21) ─────────────────
  # 2026-08-15 testing audit: the money path (upload -> parse -> OCR/native
  # -> chunk -> embed -> index -> query -> cited answer) has never executed
  # in CI. `python-test`'s Bucket 1 explicitly excludes integration/golden/
  # live tests; `release-rehearsal.yml`'s Bucket 3 covers it in principle
  # but only runs on tag push/dispatch and its LLM-dependent steps are
  # continue-on-error; `e2e.yml` no longer runs on PRs at all (2026-08-21 —
  # it used to report a green 'E2E — Playwright' check without executing a
  # single spec). This job closes that PR-time gap with a minimal,
  # narrowly-scoped smoke test — NOT a substitute for the golden/
  # hallucination suites (see eval-gate.yml).
  #
  # What's REAL vs STUBBED:
  #   REAL: Postgres (silver.reports/document_passages writes via the
  #     actual ingest_pdf.py persist() function — see e2e_smoke_ingest.py's
  #     docstring for why persist() is called directly rather than
  #     reimplemented), Qdrant (real upsert + real search against
  #     georag_chunks), the FastAPI app booted via plain uvicorn, the SPLADE++
  #     sparse encoder (local model), the cross-encoder reranker (local
  #     bge-reranker-base, downloaded from HuggingFace at job time), JWT
  #     auth, the SSE query endpoint, citation assembly.
  #   STUBBED (tests/e2e_smoke/stub_backend.py): Azure AI Foundry's dense
  #     embedding endpoint (deterministic marker-phrase encoder, NOT a real
  #     semantic model — see that file's docstring) and the LLM chat-
  #     completions endpoint (canned prose). Bronze/S3 object storage is
  #     bypassed entirely (fixture PDF is read from the checkout, not S3).
  #     No live Hatchet engine — the fire-and-forget embed-workflow dispatch
  #     inside persist() fails open (logs a warning) and the embed step
  #     runs explicitly afterwards as a plain function call instead.
  #
  # PROMOTED 2026-08-21. The criterion this job carried was "drop
  # continue-on-error once it has passed on >= 2 consecutive main runs
  # with no flakiness". It has: the last three CI runs are green here,
  # two of them consecutive main pushes.
  #
  # The slug NOT NULL violation recorded in the old note
  # (asyncpg.exceptions.NotNullViolationError on silver.projects.slug,
  # runs 31873785695 / 31876922565 / 31880497530) was fixed —
  # scripts/ci/e2e_smoke_ingest.py:74-97 now derives the slug exactly the
  # way Project::booted() does. The note outlived the bug by weeks and was
  # the only thing still keeping the product's core loop advisory, which
  # is the failure mode worth remembering: a stale comment is a gate.
  #
  # If this job goes red, read it as a real break in the money path before
  # assuming flakiness. The two known flake sources are the reranker model
  # download from HuggingFace and the marker-phrase retrieval threshold in
  # stub_backend.py; both are documented there. Re-adding
  # continue-on-error is not the fix for either.
  e2e-smoke:
    name: E2E money-path smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:18-3.6@sha256:f81dd52da147ac849428d777f30efa8d51ff6aea879fc020edde76b20d53f7b2
        env:
          POSTGRES_USER: georag
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: georag_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U georag"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      qdrant:
        image: qdrant/qdrant:v1.17.1@sha256:94728574965d17c6485dd361aa3c0818b325b9016dac5ea6afec7b4b2700865f
        ports: ["6333:6333"]
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    env:
      POSTGRES_USER: georag
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: georag_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DIRECT_HOST: localhost
      POSTGRES_DIRECT_PORT: "5432"
      POSTGRES_SSLMODE: disable
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      QDRANT_HOST: localhost
      QDRANT_PORT: "6333"
      EMBEDDING_DIMENSION: "1024"
      FASTAPI_SERVICE_KEY: test-service-key-must-be-at-least-32-bytes-long
      # hatchet_sdk's ClientConfig() is a module-level singleton instantiated
      # at import time (same gotcha documented on the python-test job above)
      # — this job never dials a real Hatchet engine, but importing
      # app.hatchet_workflows.ingest_pdf still requires a JWT-*shaped* token.
      HATCHET_CLIENT_TOKEN: eyJhbGciOiAibm9uZSIsICJ0eXAiOiAiSldUIn0.eyJzdWIiOiAiMDAwMDAwMDAtMDAwMC0wMDAwLTAwMDAtMDAwMDAwMDAwMDAwIiwgInNlcnZlcl91cmwiOiAibG9jYWxob3N0OjcwNzAiLCAiZ3JwY19icm9hZGNhc3RfYWRkcmVzcyI6ICJsb2NhbGhvc3Q6NzA3MCJ9.
      # Route both ingest-time and query-time dense embeddings, plus the
      # LLM synthesis call, at the stub backend started below.
      EMBEDDING_BACKEND: foundry
      AZURE_FOUNDRY_ENDPOINT: http://localhost:8899
      AZURE_FOUNDRY_API_KEY: stub-key
      AZURE_FOUNDRY_EMBED_DEPLOYMENT: stub-embed
      AZURE_FOUNDRY_EMBED_DIMENSION: "1024"
      LLM_BACKEND: vllm
      VLLM_URL: http://localhost:8899/v1
      # 2026-08-15: the query leg was hitting TIMEOUT_GATHER_S (default 8.0s,
      # app/config.py) before the reranker call finished. Two compounding CI-
      # only causes, neither present in prod's tuning assumptions:
      #   1. RERANKER_TORCH_THREADS defaults to 10 (app/services/reranker.py),
      #      sized for a many-core host. ubuntu-latest has 4 vCPUs (confirmed
      #      via torch's own interop=4 log line) — forcing 10 intra-op threads
      #      there oversubscribes and adds scheduling/cache-thrash overhead
      #      instead of speeding things up.
      #   2. TIMEOUT_GATHER_S/TIMEOUT_RERANKER_S (8.0s each) were sized for
      #      bge-reranker-base (~450ms/pair); the actual default self-hosted
      #      reranker is now Qwen/Qwen3-Reranker-0.6B, a heavier CPU cross-
      #      encoder, cold-loaded with no GPU on this runner.
      # Override both here rather than touching the production defaults.
      RERANKER_TORCH_THREADS: "4"
      TIMEOUT_GATHER_S: "25"
      TIMEOUT_RERANKER_S: "22"

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, swoole
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env 2>/dev/null || true
          php artisan key:generate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: georag_test
          DB_USERNAME: georag
          DB_PASSWORD: test_password

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: georag_test
          DB_USERNAME: georag
          DB_PASSWORD: test_password

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install FastAPI dependencies
        working-directory: src/fastapi
        run: uv sync --extra dev

      - name: Bootstrap Qdrant collections
        working-directory: src/fastapi
        run: uv run python scripts/init_qdrant.py

      - name: Start stub Foundry backend (embeddings + LLM)
        working-directory: src/fastapi
        run: |
          uv run python tests/e2e_smoke/stub_backend.py --port 8899 &
          echo $! > /tmp/stub_backend.pid
          for i in $(seq 1 20); do
            curl -sf http://localhost:8899/health > /dev/null && exit 0
            sleep 1
          done
          echo "::error::stub backend did not become healthy"
          exit 1

      - name: Run ingest leg (parse -> persist -> embed)
        id: ingest
        working-directory: src/fastapi
        run: uv run python scripts/ci/e2e_smoke_ingest.py

      - name: Start FastAPI (plain uvicorn, no Docker Compose)
        working-directory: src/fastapi
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 \
            > /tmp/fastapi_smoke.log 2>&1 &
          echo $! > /tmp/fastapi.pid
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/health > /dev/null && exit 0
            sleep 3
          done
          echo "::error::FastAPI did not become healthy within 180s"
          tail -n 200 /tmp/fastapi_smoke.log
          exit 1

      - name: Run query leg (POST /internal/queries, assert cited answer)
        working-directory: src/fastapi
        run: |
          uv run python scripts/ci/e2e_smoke_query.py \
            --project-id "${{ steps.ingest.outputs.project_id }}" \
            --workspace-id "${{ steps.ingest.outputs.workspace_id }}"

      - name: Dump FastAPI log on failure
        if: failure()
        run: tail -n 300 /tmp/fastapi_smoke.log || true

      - name: Stop background servers
        if: always()
        run: |
          [ -f /tmp/fastapi.pid ] && kill "$(cat /tmp/fastapi.pid)" 2>/dev/null || true
          [ -f /tmp/stub_backend.pid ] && kill "$(cat /tmp/stub_backend.pid)" 2>/dev/null || true

  # ─── Python tests ────────────────────────────────────────────────────
  python-test:
    name: Python (pytest)
    runs-on: ubuntu-latest
    needs: python-lint
    timeout-minutes: 10
    # This job runs the fast/mockable suite only (no live Postgres — see the
    # "Run FastAPI tests" comment below), but app.config.Settings() and
    # hatchet_sdk's ClientConfig() are both module-level singletons
    # instantiated at import time, so every test file that transitively
    # imports app.config or app.hatchet_workflows needs these fields present
    # in the environment even though nothing here ever dials the DB, mints a
    # real token, or talks to a real Hatchet engine. Dummy values only —
    # never real secrets. HATCHET_CLIENT_TOKEN must merely be JWT-*shaped*
    # (ClientConfig decodes the claims to fill in server_url/tenant_id even
    # though nothing here connects anywhere) — it does not need to be a real
    # signed token.
    # POSTGRES_USER is DELIBERATELY unset (2026-08-14 audit): 7 test
    # modules (test_ingest_progress_state_machine, test_orphan_sweep,
    # test_mv_refresh, test_nightly_ingestion_integrity,
    # test_reliability_metrics, test_stale_run_detector,
    # test_embed_pending_completion_sweep) module-skip on it because they
    # are live-asyncpg tests against the migrated silver schema — this job
    # has no Postgres service and never runs the Laravel migrations, so
    # setting POSTGRES_USER here would make them dial a socket that isn't
    # there and go red. They now all carry the `integration` marker, which
    # routes them to release-rehearsal.yml's Bucket 3 (full stack) instead
    # of silently running nowhere.
    env:
      FASTAPI_SERVICE_KEY: test-service-key-must-be-at-least-32-bytes-long
      POSTGRES_PASSWORD: test_password
      HATCHET_CLIENT_TOKEN: eyJhbGciOiAibm9uZSIsICJ0eXAiOiAiSldUIn0.eyJzdWIiOiAiMDAwMDAwMDAtMDAwMC0wMDAwLTAwMDAtMDAwMDAwMDAwMDAwIiwgInNlcnZlcl91cmwiOiAibG9jYWxob3N0OjcwNzAiLCAiZ3JwY19icm9hZGNhc3RfYWRkcmVzcyI6ICJsb2NhbGhvc3Q6NzA3MCJ9.

    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install FastAPI dependencies
        working-directory: src/fastapi
        run: uv sync --extra dev

      - name: Run FastAPI tests
        # C-A4-01 fix (Chunk 10.1): old command excluded golden+hallucination but kept
        # them silently deselected — the quality gates never ran in CI.
        # New strategy: the fast/mockable suite runs here (Bucket 1). Tests marked
        # integration, golden, hallucination, or live require the full stack and are
        # routed to release-rehearsal.yml (Bucket 3, dispatch/tag-push triggered).
        # See .github/workflows/release-rehearsal.yml for the live-stack gate.
        working-directory: src/fastapi
        # Module 10 Chunk 10.7 — `chaos` excluded from the fast PR suite;
        # the weekly `chaos.yml` workflow runs that subset on a cron.
        run: uv run pytest tests/ -v --tb=short -m "not integration and not golden and not hallucination and not live and not chaos"

      # Dagster test steps removed 2026-08-11: the src/dagster tree is
      # DORMANT (services retired in trim B2, 2026-07-28) and its tests
      # import georag_dagster.parsers.pdf_report / .observability, which
      # were RELOCATED into src/fastapi/app/services/ingest in trim A1 —
      # 30 collection errors, red since. Restore these steps (with fixed
      # imports) if Dagster is ever revived.

      # Storage-abstraction plan PR1 — new shared package, own test target.
      # Installed independently of fastapi/dagster's uv sync above: those
      # pull it in as a non-editable path dependency (see its
      # [tool.uv.sources] comment), which builds a wheel rather than
      # exercising this source tree directly.
      - name: Install georag_object_storage dependencies
        working-directory: src/georag_object_storage
        run: uv sync --extra dev

      - name: Run georag_object_storage tests
        working-directory: src/georag_object_storage
        run: uv run pytest tests/ -v --tb=short

      # ci.yml gained a ruff target for src/georag_geoparsers/ and no pytest
      # target, so the package's tests — covering the CSV / XLSX / shapefile
      # / QGIS parsers that landed days ago in #142/#143/#145 — were linted
      # and never run. Those are the parsers whose behaviour lost 13 of 15
      # files in the RedStar import.
      #
      # 2026-08-21: the package had exactly ONE test file. Eight more were
      # ported here from src/dagster/tests/, whose own CI steps were removed
      # on 2026-08-11 — so the parsers' reputation for being well tested
      # rested on 57 test files that had not run in ten days, against a
      # FROZEN COPY of the code. The ported suite runs against the copy the
      # Hatchet workflows import. 132 tests, 8 of which skip without the
      # geospatial stack (geopandas / shapely / ezdxf), which this job has.
      - name: Install georag_geoparsers dependencies
        working-directory: src/georag_geoparsers
        run: uv sync --extra dev

      - name: Run georag_geoparsers tests
        working-directory: src/georag_geoparsers
        run: uv run pytest tests/ -v --tb=short

  # ─── Integration tests against a real Postgres ────────────────────────
  # 2026-08-21. `integration` is deselected from python-test's Bucket 1 and
  # routed to release-rehearsal.yml — a workflow with ZERO runs, whose only
  # live trigger is manual dispatch (the repo's single tag does not match
  # `v*.*.*`). So 413 tests, 12% of the Python suite, executed nowhere at
  # all, including every live-Postgres sweep over ingestion completion and
  # data integrity.
  #
  # SCOPED, DELIBERATELY. This runs the file list in
  # src/fastapi/tests/integration_ci_manifest.txt, not `-m integration`
  # wholesale. Measured against this exact service + migrate on 2026-08-21,
  # the full marker gives 192 passed / 125 failed / 91 errors — the
  # failures being tests that need a real LLM, Qdrant, Neo4j, or the
  # database/raw SQL layer that `artisan migrate` does not apply. The
  # manifest is the subset verified green (142 passed / 4 skipped / 0
  # failed), which is why this job can be BLOCKING on day one instead of
  # becoming another advisory job nobody reads. See the manifest header for
  # the burn-down.
  integration-postgres:
    name: Integration (live Postgres)
    runs-on: ubuntu-latest
    needs: python-lint
    timeout-minutes: 20

    services:
      postgres:
        image: postgis/postgis:18-3.6@sha256:f81dd52da147ac849428d777f30efa8d51ff6aea879fc020edde76b20d53f7b2
        env:
          POSTGRES_USER: georag
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: georag_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U georag"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # POSTGRES_USER is set here ON PURPOSE. python-test deliberately
      # leaves it UNSET so these modules module-skip there (that job has no
      # Postgres service). This job is the place they are meant to run.
      POSTGRES_USER: georag
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: georag_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      # The DIRECT pair is not redundant. app/db/dsn.py builds the direct
      # DSN from POSTGRES_DIRECT_HOST/PORT (PgBouncer cannot carry the
      # session-scoped work these sweeps do), and leaving them unset points
      # every asyncpg.connect at the container default and fails with a
      # bare ConnectionRefusedError.
      POSTGRES_DIRECT_HOST: localhost
      POSTGRES_DIRECT_PORT: "5432"
      POSTGRES_SSLMODE: disable
      FASTAPI_SERVICE_KEY: test-service-key-must-be-at-least-32-bytes-long
      # Same module-level ClientConfig() singleton as python-test — needs a
      # JWT-*shaped* token at import even though nothing dials Hatchet.
      HATCHET_CLIENT_TOKEN: eyJhbGciOiAibm9uZSIsICJ0eXAiOiAiSldUIn0.eyJzdWIiOiAiMDAwMDAwMDAtMDAwMC0wMDAwLTAwMDAtMDAwMDAwMDAwMDAwIiwgInNlcnZlcl91cmwiOiAibG9jYWxob3N0OjcwNzAiLCAiZ3JwY19icm9hZGNhc3RfYWRkcmVzcyI6ICJsb2NhbGhvc3Q6NzA3MCJ9.

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # The Python tests read a schema Laravel owns, so the migration chain
      # is the fixture. Nothing here writes application code paths through
      # Laravel — it exists purely to create silver/gold/audit/workflow.
      - name: Migrate the schema
        run: |
          cp .env.example .env 2>/dev/null || true
          php artisan key:generate --force
          php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: georag_test
          DB_USERNAME: georag
          DB_PASSWORD: test_password

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install FastAPI dependencies
        working-directory: src/fastapi
        run: uv sync --extra dev

      - name: Run the manifest
        working-directory: src/fastapi
        run: |
          FILES=$(grep -vE '^[[:space:]]*#|^[[:space:]]*$' \
            tests/integration_ci_manifest.txt | tr '\n' ' ')
          if [ -z "$FILES" ]; then
            echo "::error::integration_ci_manifest.txt selected no files"
            exit 1
          fi
          echo "manifest files: $(echo $FILES | wc -w)"
          # -p no:randomly: several of these modules share a bootstrapped
          # workspace/project that the state-machine module provisions, so
          # order is load-bearing.
          uv run pytest -v --tb=short -m integration -p no:randomly $FILES

  # ─── Frontend lint + build ────────────────────────────────────────────
  frontend:
    # Renamed 2026-08-21. The title said ESLint; the steps are tsc, vitest
    # and vite build. There is no eslint config, no eslint dependency and no
    # lint script in package.json, so a reviewer trusting the check name
    # assumed lint coverage over 27+ React source files that have none.
    # Adding ESLint is worth doing and is a separate change with its own
    # findings to burn down — what could not stay is the name claiming it.
    name: Frontend (types + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      # Instrumentation, not a gate. `noImplicitAny` is false in
      # tsconfig.json, which cancels most of `strict: true`: untyped
      # parameters across the whole TS/TSX tree are implicitly `any`, and
      # a typo in a callback over an API response compiles clean and
      # fails at runtime as a blank panel.
      #
      # Nobody has flipped it because nobody knows what it costs, and the
      # step above is blocking, so finding out the hard way stops the
      # branch. This measures it on every run instead: a number that
      # either shrinks or does not, and a list of where to start.
      #
      # `|| true` on purpose -- this step must never fail the job. The
      # gate is the step above it.
      - name: noImplicitAny burn-down (report only)
        if: always()
        run: |
          npx tsc --noEmit --noImplicitAny > /tmp/implicit-any.txt 2>&1 || true
          COUNT=$(grep -c "error TS7[0-9]*" /tmp/implicit-any.txt || echo 0)
          {
            echo "### noImplicitAny burn-down"
            echo
            echo "\`tsconfig.json\` sets \`noImplicitAny: false\`, which cancels most of \`strict: true\`."
            echo
            echo "**Implicit-any errors if flipped today: \`$COUNT\`**"
            echo
            if [ "$COUNT" -gt 0 ]; then
              echo "Worst files:"
              echo
              echo '```'
              grep -o "^[^(]*" /tmp/implicit-any.txt | sort | uniq -c | sort -rn | head -15
              echo '```'
            else
              echo "Zero. Flip \`noImplicitAny\` to \`true\` and delete this step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Vitest
        run: npm run test --if-present

      - name: Vite build
        run: npm run build

  # ─── Static analysis (ADVISORY — promote when green) ──────────────────
  # 2026-08-14 audit: phpstan.neon (larastan level 6 + a 973-line baseline)
  # and [tool.mypy] strict (src/fastapi/pyproject.toml) both exist but CI
  # ran neither — the configs were dead weight. Added here as NON-BLOCKING
  # jobs (continue-on-error: true) because neither could be verified green
  # in this environment before landing.
  #
  # PROMOTION CRITERIA — drop the continue-on-error line from a job once:
  #   1. its step has passed on ≥2 consecutive main runs, and
  #   2. any findings have either been fixed or captured in the baseline
  #      (composer run stan:baseline / a mypy baseline or per-module
  #      ignores) with a TODO to burn them down.
  # Until then, red here is signal, not a gate.
  #
  # 2026-08-22: phpstan PROMOTED, mypy still advisory. See each job.
  phpstan:
    name: phpstan (larastan level 6)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # BLOCKING as of 2026-08-22. Promoted under criterion 2 above: the
    # baseline was regenerated so `phpstan analyse` now reports "No
    # errors" locally, which means from here on a red phpstan is a NEW
    # error someone just introduced, not the 288 pre-existing ones.
    #
    # What the regeneration actually did, measured before and after:
    #   * the old baseline held 159 entries and the run still reported 135
    #     errors on top of them;
    #   * 12 of those 135 were `ignore.unmatched` / `ignore.count` — stale
    #     baseline entries whose code had since been fixed, i.e. the
    #     baseline was itself generating a chunk of the noise;
    #   * the new baseline holds 288 errors across 236 entries.
    #
    # THE BURN-DOWN, by rule, largest first. These are debt, not absolution:
    #   43  property.notFound         — models lack @property annotations,
    #                                   so Eloquent attributes are unchecked
    #   12  larastan.noEnvCallsOutsideOfConfig — env() outside config/
    #                                   returns null once `config:cache` is
    #                                   run. Nothing runs it today (not in
    #                                   docker/laravel.Dockerfile, not in the
    #                                   live container command), so these are
    #                                   a landmine rather than a live break —
    #                                   and the day someone adds that
    #                                   standard optimisation, those call
    #                                   sites start reading null.
    #                                   2026-08-22: was 26. The 14 that read
    #                                   FASTAPI_SERVICE_KEY / FASTAPI_INTERNAL_URL
    #                                   are gone — a config key for both
    #                                   already existed and was used at a
    #                                   dozen OTHER sites, so half the
    #                                   FastAPI callers would have kept
    #                                   authenticating while the other half
    #                                   read null. Several had already been
    #                                   half-converted into
    #                                   `config('x') ?? config('x')`.
    #                                   What is left needs real config
    #                                   entries, not a swap.
    #   13  nullsafe.neverNull        — DO NOT "FIX" THESE. All 13 are
    #                                   `$this->command?->` in seeders.
    #                                   Illuminate\Database\Seeder declares
    #                                   `protected $command;` untyped and
    #                                   uninitialised, and the framework
    #                                   guards it with isset() in its own
    #                                   code. larastan believes the
    #                                   optimistic `@var \Illuminate\Console\
    #                                   Command` docblock. Replacing ?-> with
    #                                   -> turns a defensive null-check into
    #                                   a fatal on any seeder not invoked
    #                                   through artisan.
    #    9  missingType.iterableValue —  broadcastWith() array shapes
    #    6  class.notFound            — MicrosoftAzure\Storage\Blob\
    #                                   BlobRestProxy; the package is not
    #                                   installed. Same root cause as the 5
    #                                   AzureBlobDiskTest errors.
    #    5  missingType.parameter, 4 return.type, 4 argument.templateType,
    #    and a 25-error tail across 9 more rules.

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, swoole
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # composer.json's "stan" script = phpstan analyse with memory_limit=2G,
      # using phpstan.neon (larastan level 6) + phpstan-baseline.neon.
      - name: Run PHPStan
        run: composer run stan

  mypy:
    name: mypy (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 2026-08-21: the config this runs was dropped from `strict = true` to
    # a reachable baseline. Measured over the same tree on the same day:
    #
    #              strict = true        current config
    #   errors            850                    286
    #   modules           197                     91
    #
    # Two thirds of the strict output was strictness noise — missing
    # generic parameters, un-annotated defs, and libraries that ship no
    # stubs. What survives is mostly real, and it found a live-shaped bug
    # immediately (`"None" has no attribute "labels"` in qdrant_fallback,
    # a metrics helper that could only ever raise). The full reasoning and
    # the ratchet plan are in [tool.mypy] in src/fastapi/pyproject.toml.
    #
    # A CORRECTION TO WHAT THIS COMMENT USED TO SAY. It claimed a local run
    # "produces a SHORTER module list" because "most of the 824 collapse
    # into import errors". That is not what happens: a local strict run
    # gives 850/197 against CI's 824/198 — indistinguishable. The old
    # reasoning was wrong.
    #
    # PROMOTED TO BLOCKING 2026-08-21. `mypy app --platform linux` over
    # src/fastapi reports "Success: no issues found in 352 source files"
    # with the reachable baseline plus the two-tier burn-down list in
    # [[tool.mypy.overrides]]. 235 of 353 modules are checked; the other
    # 118 are named, dated and explained there.
    #
    # The residual risk is one module outside all 118 erroring here but not
    # locally, because `ignore_missing_imports = true` makes a package this
    # checkout lacks into Any. Tier 2 of the override list is that margin.
    # If it is not wide enough, the step below prints the exact list to
    # paste — a mechanical fix, and a far better failure than the one this
    # replaces, where a genuine type regression merged silently inside a
    # wall of 824 advisory errors nobody read.
    #
    # Do not re-add continue-on-error to make a red run go away. Either fix
    # the module or add it to Tier 2 with a dated reason.

    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install FastAPI dependencies
        working-directory: src/fastapi
        run: uv sync --extra dev

      # [tool.mypy] in src/fastapi/pyproject.toml carries the settings;
      # mypy ships in the dev extra (mypy>=1.15). Scoped to the app package.
      - name: Run mypy
        working-directory: src/fastapi
        run: uv run mypy app

      # The one output that turns this job from advisory into promotable.
      # Everything else about promotion is written down; this is the datum
      # that cannot be produced anywhere but here.
      - name: Emit the per-module list a promotion would need
        if: always()
        working-directory: src/fastapi
        run: |
          echo '### Modules mypy reports errors in' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Empty on a green run. If this job failed, these are the modules to' >> "$GITHUB_STEP_SUMMARY"
          echo 'fix — or, as a last resort, to add to Tier 2 of the burn-down list.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Paste into [[tool.mypy.overrides]] with ignore_errors = true,' >> "$GITHUB_STEP_SUMMARY"
          echo 'then drop continue-on-error from this job.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```toml' >> "$GITHUB_STEP_SUMMARY"
          echo '[[tool.mypy.overrides]]' >> "$GITHUB_STEP_SUMMARY"
          echo 'ignore_errors = true' >> "$GITHUB_STEP_SUMMARY"
          echo 'module = [' >> "$GITHUB_STEP_SUMMARY"
          uv run mypy app --no-error-summary 2>/dev/null \
            | cut -d: -f1 \
            | sed 's#/#.#g; s#\.py$##' \
            | sort -u \
            | sed 's/^/    "/; s/$/",/' >> "$GITHUB_STEP_SUMMARY" || true
          echo ']' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ─── pgTAP MVT function tests ────────────────────────────────────────
  pgtap:
    name: pgTAP (MVT function assertions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs after Laravel job so that migrations are proven to apply cleanly
    # before we assert on their resulting SQL functions.
    needs: laravel
    # BLOCKING again as of 2026-08-14. This job was continue-on-error from
    # 2026-08-05 because 03_rls_baseline.sql asserted 6 stale hardcoded
    # policy names ("collars_project_scope", "drill_traces_tenant_scope",
    # …). The fixture was fixed in 4260d12 (+ sibling sweeps in 1546589 /
    # 6a6ec08) to assert the post-normalization families: the
    # <table>_workspace_isolation family (2026_05_25_180924 canonical +
    # 2026_05_25_182857 missed-tables migrations) and drill_traces'
    # tenant_isolation (2026_05_30_010000). Verified table-by-table
    # against those migrations 2026-08-14, and empirically: the "Run
    # pgTAP assertions" step passed on the last green main run
    # (run 31567237441, commit f33e21e). Nothing masks failures anymore —
    # a stale fixture now correctly blocks the merge.

    services:
      postgres:
        # H-A4-03 fix (Chunk 10.1): bumped from postgis/postgis:17-3.5 to
        # postgis/postgis:18-3.6 to match the production PostgreSQL major version.
        # Production (docker-compose.yml) uses the alpine variant; CI uses the
        # Debian variant because GitHub Actions runners use apt-get for the
        # pgTAP source build (make + postgresql-server-dev-18).
        # Both variants carry PostgreSQL 18 + PostGIS 3.6 — the major version
        # match is what closes H-A4-03.
        # Digest pinned (Chunk 10.2): sha256 captured 2026-04-26.
        image: postgis/postgis:18-3.6@sha256:f81dd52da147ac849428d777f30efa8d51ff6aea879fc020edde76b20d53f7b2
        env:
          POSTGRES_USER: georag
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: georag_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U georag"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env 2>/dev/null || true
          php artisan key:generate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: georag_test
          DB_USERNAME: georag
          DB_PASSWORD: test_password

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: georag_test
          DB_USERNAME: georag
          DB_PASSWORD: test_password

      - name: Install pgTAP from source
        # H-A4-03 fix (Chunk 10.1): updated for PG 18.
        # 2026-08-05: the previous version of this step ran `make install` on
        # the RUNNER — but `services:` containers are a separate, isolated
        # filesystem, so the compiled extension files never reached the
        # Postgres server that `psql` actually talks to over TCP. The build
        # itself could succeed and CREATE EXTENSION would still fail with
        # "extension pgtap is not available", every single run. Fixed by
        # building and installing INSIDE the running postgres service
        # container via `docker exec`, which is where pg_config /
        # $sharedir / $libdir actually need the files to land.
        run: |
          CID="${{ job.services.postgres.id }}"
          docker exec -u root "$CID" bash -c '
            set -euo pipefail
            apt-get update -qq
            apt-get install -y -qq build-essential libpq-dev perl curl ca-certificates postgresql-server-dev-18
            cd /tmp
            curl -fsSL https://github.com/theory/pgtap/archive/refs/tags/v1.3.4.tar.gz | tar xz
            cd pgtap-1.3.4
            make
            make install
          '

      - name: Install pgTAP extension
        run: |
          psql -U georag -h localhost -d georag_test \
            -c "CREATE EXTENSION IF NOT EXISTS pgtap; SELECT extname, extversion FROM pg_extension WHERE extname='pgtap';"
        env:
          PGPASSWORD: test_password

      - name: Load golden snapshot seed fixture
        # seed_golden_fixture.sql is idempotent (ON CONFLICT DO NOTHING).
        # Must run before 10_golden_mvt_snapshots.sql or Block 1 seed-guard assertions fail.
        run: |
          psql -U georag -h localhost -d georag_test \
            -f database/tests/pgtap/seed_golden_fixture.sql
        env:
          PGPASSWORD: test_password

      - name: Run pgTAP assertions
        run: |
          # Run each numbered pgTAP file (NN_*.sql) directly via psql.
          # seed_golden_fixture.sql is excluded — it has no pgTAP plan() call.
          # Exit non-zero if any file reports failures.
          FAILED=0
          for f in database/tests/pgtap/[0-9][0-9]_*.sql; do
            echo "==> $f"
            OUTPUT=$(psql -t -U georag -h localhost -d georag_test -f "$f" 2>&1)
            echo "$OUTPUT" | grep -E '^ (ok|not ok) [0-9]' || true
            FINISH=$(echo "$OUTPUT" | grep 'Looks like you failed\|planned.*but ran' || true)
            if [[ -n "$FINISH" ]]; then
              echo "FAIL: $f — $FINISH"
              FAILED=1
            elif echo "$OUTPUT" | grep -q 'ERROR:'; then
              echo "FAIL: $f — SQL error in transaction"
              echo "$OUTPUT" | grep 'ERROR:' | head -5
              FAILED=1
            else
              PLAN=$(echo "$OUTPUT" | grep -m1 '^ 1\.\.' | sed 's/^ 1\.\.//' | tr -d ' ')
              echo "PASS: $f — ${PLAN} assertions"
            fi
          done
          exit $FAILED
        env:
          PGPASSWORD: test_password

  # ─── Hadolint — Dockerfile lint (warn-only, runs on PRs and pushes) ─────
  # Closes: L-A4-09 (hadolint step). 2026-06-29: failure-threshold is `error`
  # so the current findings (all DL3008/DL3013/DL4006 *warnings* — unpinned
  # apt/pip versions) surface as annotations WITHOUT blocking, matching the
  # warn-only intent. (`warning` threshold actually FAILS on warnings — the
  # prior setting contradicted the comment.) Pin versions, then drop the
  # threshold to `warning`/`info` to enforce.
  hadolint:
    name: Hadolint (Dockerfile lint)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Lint docker/fastapi.Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: docker/fastapi.Dockerfile
          failure-threshold: error

      - name: Lint docker/laravel.Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: docker/laravel.Dockerfile
          failure-threshold: error

      - name: Lint docker/dagster.Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: docker/dagster.Dockerfile
          failure-threshold: error

  # ─── Docker build + Trivy + SBOM: MOVED (2026-08-14) ────────────────────
  # The ~24-minute docker-build/Trivy/SBOM/Cosign job now lives in its own
  # workflow, .github/workflows/docker-build.yml (identical triggers and job
  # content). Rationale: cd.yml's workflow_run trigger waits for this WHOLE
  # workflow to conclude, and this workflow's blocking jobs finish in ~6
  # minutes — keeping the non-blocking 24-minute image build inside "GeoRAG
  # CI" delayed every production deploy by ~18 minutes for no gate value.
  # Side benefit: the Trivy CRITICAL scan is a real (blocking) check over
  # there now that it no longer sits in CD's gate path.
