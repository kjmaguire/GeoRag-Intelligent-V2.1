name: Tenant Isolation Auditor (§11.5)

# Asserts the platform's core security property on every PR that could
# break it: a row belonging to one workspace must never be visible to
# another.
#
# History worth keeping. From doc-phase 104 until 2026-08-21 this workflow
# was a skeleton whose only step echoed a description of what it would one
# day do and then `exit 0`. It reported a green check named "Tenant
# Isolation Auditor" on every PR touching migrations, app/ or the FastAPI
# tree — a check that could never fail, under the name of the property the
# product is sold on. It is the most expensive kind of CI to have: it does
# not merely fail to catch regressions, it actively signals that someone
# looked.
#
# Meanwhile tests/Feature/Tenancy/ had accumulated 23 real tests doing
# exactly the work the skeleton described — WorkspaceRlsCoverageTest walks
# every table carrying a workspace_id and asserts RLS is enabled with a
# policy; GuardSchemaRlsTest and BrokenChrZeroRlsPoliciesRoleTest cover the
# policy shapes; NoLegacyGucSetConfigInPhpTest keeps the legacy GUC from
# creeping back. They ran under the general Laravel job, where a tenancy
# regression looked like any other test failure. This workflow now runs
# that suite under its own name, so the check that says "tenant isolation"
# is the check that tests tenant isolation.
#
# RLS is a Postgres feature, so this needs a real Postgres — the tenancy
# tests skip themselves on SQLite, which is another way this could have
# gone quietly green.

on:
  pull_request:
    branches: [main]
    paths:
      - 'database/migrations/**'
      - 'database/raw/**'
      - 'src/fastapi/app/**'
      - 'app/**'
      - 'tests/Feature/Tenancy/**'
      - '.github/workflows/tenant-isolation-auditor.yml'
  workflow_dispatch: {}

concurrency:
  group: tenant-isolation-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.5"

jobs:
  tenant-isolation:
    name: Tenant Isolation Auditor
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:18-3.6@sha256:f81dd52da147ac849428d777f30efa8d51ff6aea879fc020edde76b20d53f7b2
        env:
          POSTGRES_USER: georag
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: georag_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U georag"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    env:
      DB_CONNECTION: pgsql
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: georag_test
      DB_USERNAME: georag
      DB_PASSWORD: test_password

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, swoole
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env 2>/dev/null || true
          php artisan key:generate --force

      - name: Run migrations
        run: php artisan migrate --force

      # --testdox so a failure names the invariant that broke rather than
      # a test-method identifier.
      - name: Tenancy suite
        run: php vendor/bin/phpunit --no-coverage --testdox tests/Feature/Tenancy

      # A suite that skips itself is the skeleton again in a better costume.
      # WorkspaceRlsCoverageTest is the load-bearing one -- it walks every
      # table carrying a workspace_id and asserts RLS is enabled with a
      # policy -- and it declares `Skipped on SQLite`, because RLS is a
      # Postgres feature. Run it locally against the default SQLite config
      # and 19 of the 29 tenancy tests skip while the suite still reports
      # OK. So: assert this one ran.
      - name: Assert the RLS coverage test actually ran
        run: |
          TEST=tests/Feature/Tenancy/WorkspaceRlsCoverageTest.php
          php vendor/bin/phpunit --no-coverage "$TEST" > /tmp/rls.txt 2>&1 || { cat /tmp/rls.txt; exit 1; }
          cat /tmp/rls.txt
          if grep -qE "Skipped:|Incomplete:|No tests executed|OK \(0 tests" /tmp/rls.txt; then
            echo "::error::WorkspaceRlsCoverageTest did not execute. It skips itself when the connection is not Postgres, which means this job proved nothing about tenant isolation."
            exit 1
          fi
