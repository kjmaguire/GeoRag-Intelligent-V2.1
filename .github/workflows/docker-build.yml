name: Docker Build (GHCR + Trivy + SBOM)

# =============================================================================
# Moved out of ci.yml 2026-08-14 (CD lead-time fix).
#
# cd.yml's workflow_run trigger fires only when the WHOLE "GeoRAG CI"
# workflow concludes. CI's blocking jobs finish in ~6 minutes, but this
# ~24-minute non-blocking build/Trivy/SBOM/Cosign job used to live inside
# that workflow — so every production deploy waited ~18 extra minutes for a
# job that was continue-on-error and gated nothing. Same triggers as ci.yml
# (push main/develop, PR to main), identical job content, but its own
# workflow so "GeoRAG CI" concludes fast and CD starts sooner.
#
# BLOCKING CHANGE (2026-08-14): the old job-level continue-on-error is gone.
# Now that this workflow is no longer in CD's gate path, a Trivy CRITICAL
# finding (exit-code: "1" below) fails THIS workflow for real instead of
# being swallowed — that was the whole point of running the scan. Evidence
# this is safe to enforce: both matrix legs (build, Trivy, SBOM, Cosign)
# passed end-to-end on the last green main run (run 31567237441, commit
# f33e21e, 2026-08-12). The GHCR push behavior is unchanged.
# =============================================================================

on:
  push:
    branches: [main, develop]
    paths:
      # Everything runs the workflow except documentation that nothing in CI
      # reads. A push touching ONLY that cannot fail any job here, so paying
      # for 28 billable minutes to prove it is waste — and it was real waste:
      # three of eight pushes on 2026-09-15 were documentation only and ran
      # all 24 checks.
      #
      # FOUR DOCS ARE DELIBERATELY NOT IGNORED, because CI parses them as DATA:
      #   deploy/aws/README.md    scripts/check-ecs-secret-keys.py reads its
      #                           key table, and aws-preflight.sh derives the
      #                           go-live key list from it. Editing that table
      #                           really can break the build.
      #   georag-architecture.html  tests/Unit/ArchitectureDocSchemaParityTest
      #                           fails when it names a schema.table no
      #                           migration creates.
      #   docs/architecture/manual/07-orchestration.md
      #                           src/fastapi/tests/test_cron_doc_parity.py
      #                           fails when its cron tables drift from the
      #                           workflows' on_crons.
      #   docs/adr/0014-workspace-lookup-and-pivot.md
      #                           src/fastapi/tests/test_lookup_and_rescope.py
      #                           fails when the ADR loses a required section.
      # The first two are never matched by the ignores below (`*.md` is
      # root-level only, and the architecture doc is .html). The last two
      # sit under docs/**, which `paths-ignore` cannot carve out of — it has
      # no negation — so this is a `paths` filter: `!` ignores, and a later
      # positive pattern puts a file back. scripts/check-ci-path-filters.py
      # fails the build if any of the four is ever skipped.
      - '**'
      - '!docs/**'
      - '!ops/runbooks/**'
      - '!*.md'
      - '!LICENSE'
      - 'docs/architecture/manual/07-orchestration.md'
      - 'docs/adr/0014-workspace-lookup-and-pivot.md'
  pull_request:
    branches: [main]
    paths:
      # Everything runs the workflow except documentation that nothing in CI
      # reads. A push touching ONLY that cannot fail any job here, so paying
      # for 28 billable minutes to prove it is waste — and it was real waste:
      # three of eight pushes on 2026-09-15 were documentation only and ran
      # all 24 checks.
      #
      # FOUR DOCS ARE DELIBERATELY NOT IGNORED, because CI parses them as DATA:
      #   deploy/aws/README.md    scripts/check-ecs-secret-keys.py reads its
      #                           key table, and aws-preflight.sh derives the
      #                           go-live key list from it. Editing that table
      #                           really can break the build.
      #   georag-architecture.html  tests/Unit/ArchitectureDocSchemaParityTest
      #                           fails when it names a schema.table no
      #                           migration creates.
      #   docs/architecture/manual/07-orchestration.md
      #                           src/fastapi/tests/test_cron_doc_parity.py
      #                           fails when its cron tables drift from the
      #                           workflows' on_crons.
      #   docs/adr/0014-workspace-lookup-and-pivot.md
      #                           src/fastapi/tests/test_lookup_and_rescope.py
      #                           fails when the ADR loses a required section.
      # The first two are never matched by the ignores below (`*.md` is
      # root-level only, and the architecture doc is .html). The last two
      # sit under docs/**, which `paths-ignore` cannot carve out of — it has
      # no negation — so this is a `paths` filter: `!` ignores, and a later
      # positive pattern puts a file back. scripts/check-ci-path-filters.py
      # fails the build if any of the four is ever skipped.
      - '**'
      - '!docs/**'
      - '!ops/runbooks/**'
      - '!*.md'
      - '!LICENSE'
      - 'docs/architecture/manual/07-orchestration.md'
      - 'docs/adr/0014-workspace-lookup-and-pivot.md'

concurrency:
  # Deliberately NOT ci-${{ github.ref }} — concurrency groups are
  # repo-global, so reusing CI's group string would cancel CI runs.
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for every job in this file. CodeQL's
# actions/missing-workflow-permissions flags a workflow with no explicit
# block because it then inherits the repository default, which can be
# read-write for the whole repo. Jobs that genuinely need more (SARIF
# upload, OIDC, package push) keep their own `permissions:` block, which
# overrides this one rather than adding to it.
permissions:
  contents: read

jobs:
  # ─── Docker build + push (GHCR on main) + Trivy + SBOM ──────────────────
  # Strategy:
  #   PRs:   build only (no push) — fast cycle, no registry writes.
  #   main:  build + push with SHA tag + rolling "main" tag.
  #
  # Images pushed to:
  #   ghcr.io/<owner>/georag-fastapi:<short-sha>
  #   ghcr.io/<owner>/georag-fastapi:main         (rolling latest on main)
  #   (same pattern for laravel)
  #   NOT consumed by cd.yml — that builds straight to ACR (georagacrcc)
  #   and deploys from there (2026-08-05 rewrite). This job's own value is
  #   the Trivy scan + SBOM below; the GHCR push is just a side effect of
  #   how docker/build-push-action works, kept in case a non-Azure
  #   consumer ever needs these images.
  #
  # Platforms: linux/amd64 only (2026-08-06 — see below).
  # Cache: GitHub Actions cache (type=gha) scoped per image name.
  #
  # 2026-08-06: dropped the linux/arm64 leg. This job had been timing out
  # at its 30-minute cap on every single run for over a month; the
  # near-certain cause is that `main` pushes built BOTH amd64 and
  # QEMU-emulated arm64 in the same step, and emulated compilation of the
  # torch/GDAL-heavy dependencies in these images is a well-known
  # multi-minute-to-multi-hour multiplier over native — CD's own ACR
  # builds of the identical Dockerfiles (single-platform, native) already
  # take ~20 minutes for fastapi alone. Nothing in the real deploy path
  # (Azure Container Apps, x86_64-only) has ever consumed an arm64 image;
  # the original rationale below was for self-hosted on-prem ARM hosts
  # from before the Azure-only decision.
  #
  # Original note on arm64 prod deployments (now historical, kept for
  # context): the three georag/* images this job builds are Python/PHP
  # and are arm64-clean. The compose stack also includes vLLM (prod LLM
  # tier), which is x86_64-only — arm64 hosts could run dev (Ollama) but
  # never the prod LLM tier directly. See
  # ops/runbooks/_archived/llm-model-swap.md for the (now moot) arm64 caveat.
  #
  # Closes: H-A4-02 (images now pushed on main), L-A4-08 (SBOM), L-A4-09 (Trivy).
  docker-build:
    name: Docker Build${{ github.ref == 'refs/heads/main' && ' + Push (GHCR)' || ' (PR smoke test)' }}
    runs-on: ubuntu-latest
    # Native single-platform builds of these Dockerfiles take ~20 minutes
    # for fastapi alone via ACR (see cd.yml); 30 min was already tight
    # even before accounting for the Trivy scan + SBOM steps that run
    # after the build within the same budget. 45 gives real headroom.
    timeout-minutes: 45
    # Matrix over the three images CD builds, so each gets its own cache
    # scope and SBOM.
    # Failures in one image do not cancel the other. The dagster leg was
    # dropped 2026-08-05 — Dagster services were retired in Phase B2 and
    # nothing deploys this image anymore.
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: fastapi
            dockerfile: docker/fastapi.Dockerfile
            # Storage-abstraction plan PR1 — widened from src/fastapi to src
            # so the Dockerfile can COPY the sibling georag_object_storage
            # path dependency. Must match docker-compose.yml's fastapi
            # build.context.
            context: src
          - service: laravel
            dockerfile: docker/laravel.Dockerfile
            context: .
          # Added 2026-09-16. cd.yml has always built three images and this
          # workflow built two, so martin reached production unbuilt: its
          # `COPY martin/martin.yaml` could not resolve against cd.yml's
          # repository-root context, and the first deploy would have been the
          # first time anything tried. ci.yml lints it with hadolint, which
          # checks syntax and never whether a COPY source exists.
          #
          # The rule this restores is simply that CI builds every image CD
          # builds. It costs almost nothing here — martin is a FROM and a COPY
          # over a pinned upstream digest, seconds rather than the fastapi
          # leg's minutes.
          - service: martin
            dockerfile: docker/martin.Dockerfile
            context: .

    # GITHUB_TOKEN must have packages:write to push to GHCR.
    #
    # NO id-token:write here. This job runs six third-party actions (the
    # docker/* three, Trivy, Syft, the Cosign installer); a job holding
    # id-token:write lets every one of them mint an OIDC token for any
    # audience, and the AWS deploy role's trust policy keys on the repository
    # and the main ref, not on a workflow. That is a path from a hijacked
    # action tag to deploy credentials. The only thing here that needs the
    # token is Cosign keyless signing (anchore/sbom-action does not — the old
    # comment on this line said it did), so signing is the `sign` job below,
    # which holds the permission and the one action it cannot do without.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # The fastapi leg ran the runner out of disk on 2026-09-15 —
      # "write /usr/lib/x86_64-linux-gnu/libicudata.so.76.1: no space left on
      # device" — while the laravel leg built fine on the same runner type
      # minutes earlier. Nothing in that push touched a Dockerfile.
      #
      # It is the PR path that is tight, and `load: true` below is why: it
      # exports the finished image into the local Docker daemon so Trivy can
      # scan it, so at peak the fastapi layers exist TWICE — once in the
      # buildkit cache, once in the daemon. That image carries torch,
      # transformers, GDAL/rasterio and a from-source Tesseract, against a
      # hosted runner that starts with roughly 14 GB free on /. The margin
      # was always thin; it has now been crossed, and it will be crossed
      # again as the image grows.
      #
      # Everything removed is a preinstalled toolchain for a language this
      # repository never builds on the host — both images are built inside
      # Docker, so the host needs docker and nothing else. Android alone is
      # most of the ~25 GB this frees. CodeQL's toolcache goes too: it was
      # only ever used by codeql.yml, which was deleted on 2026-09-15 (see
      # Ch 07), and the runner image ships it regardless.
      #
      # Inline rather than a third-party "free disk space" action, on
      # purpose. The Trivy step below was moved off a floating `@master` ref
      # in the 2026-06-24 re-audit; taking a new supply-chain dependency to
      # solve a disk problem would hand that back for no reason.
      #
      # Applied to both matrix legs rather than just fastapi. It costs the
      # laravel leg a few seconds, and laravel's own margin shrinks with
      # every base-image update — a guard that only covers the image that
      # has already failed is a guard that gets added twice.
      #
      # `df -h` either side so the next failure is diagnosable from the log
      # rather than guessed at. `|| true` so a path that disappears from a
      # future runner image cannot fail the build.
      - name: Free runner disk space
        run: |
          echo "--- disk before cleanup ---"
          df -h /
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          echo "--- disk after cleanup ---"
          df -h /

      # Every third-party action in this file is pinned to the commit its tag
      # resolved to, with the tag in a trailing comment (Dependabot's
      # github-actions updater keeps both in step). A tag is a mutable pointer
      # — the Trivy one was hijacked in March 2026, see the Trivy step — and
      # these actions run with packages:write on a job that builds what ships.
      # The first-party actions/* stay on major tags.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1 (v4)

      # Login to GHCR only on main branch pushes (PRs build without pushing).
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 (v4)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Short SHA tag — immutable identifier used by cd.yml deploy jobs.
      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Build and optionally push.
      # On PRs: push=false, load=true (image available to Trivy via local daemon).
      # On main: push=true, load=false (image in GHCR, Trivy pulls from there).
      - name: Build${{ github.ref == 'refs/heads/main' && ' and push' || '' }} ${{ matrix.service }} image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0 (v7)
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # `load: true` (PR builds) puts the image in the local Docker
          # daemon so Trivy can scan it. Single platform on both branches
          # now — see the arm64 note above the job definition (2026-08-06).
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          load: ${{ github.ref != 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/georag-${{ matrix.service }}:${{ steps.sha.outputs.short }}
            ghcr.io/${{ github.repository_owner }}/georag-${{ matrix.service }}:main
          cache-from: type=gha,scope=georag-${{ matrix.service }}
          cache-to: type=gha,scope=georag-${{ matrix.service }},mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # Trivy vulnerability scan.
      # CRITICAL severity fails the build (exit-code: "1") — and since
      # 2026-08-14 this workflow has no continue-on-error wrapper, so a
      # CRITICAL finding actually fails the workflow (it no longer sits in
      # CD's gate path, see the file header).
      # HIGH is reported but does not block — tighten to CRITICAL,HIGH once
      # base images are updated to non-EOL OS versions.
      # ignore-unfixed: true skips CVEs with no upstream fix (noise reduction).
      - name: Trivy scan — ${{ matrix.service }}
        # 2026-06-24 re-audit: was @master — a floating branch ref on a
        # repo that suffered a tag-hijack supply-chain incident in March
        # 2026 (GHSA-69fq-xp46-6x23). Pinned to a release tag, and since
        # 2026-10-10 to that tag's commit: a tag can be moved, which is the
        # incident. v0.36.0 is an annotated tag, so the SHA below is the
        # commit it peels to (`git ls-remote … refs/tags/v0.36.0^{}`), not the
        # tag object `git ls-remote` prints first.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "ghcr.io/${{ github.repository_owner }}/georag-${{ matrix.service }}:${{ steps.sha.outputs.short }}"
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          # Trivy's own default is 5m, and the fastapi image sits right on it.
          # It carries torch, the GDAL stack and the baked SPLADE++ weights
          # (docker/fastapi.Dockerfile), and layer analysis takes very nearly
          # the whole budget: on 2026-09-16 the scan ran 5m01s and died with
          #
          #   FATAL  run error: image scan error: ... failed to analyze layer
          #          (sha256:3008d977...): walk error
          #
          # on a commit whose diff touched only Terraform, CI config and two
          # scripts — nothing in the image at all. The same image had passed
          # minutes earlier on the parent commit. A ceiling that a scan finishes
          # just under is a coin flip, and losing it reads as a CRITICAL CVE gate
          # failing rather than as a clock running out.
          #
          # 20m is a ceiling, not a delay: the laravel and martin scans finish
          # in well under a minute and are unaffected. Raise it again rather
          # than re-running the job if fastapi ever grows into this one too.
          timeout: "20m"

      # SBOM generation via Syft (anchore/sbom-action). SPDX JSON format.
      # Artifact is uploaded and retained 90 days for supply-chain audits.
      # Closes L-A4-08.
      - name: Generate SBOM — ${{ matrix.service }}
        # `v0` was a floating major that resolves to v0.24.0's commit; later
        # patch releases exist (v0.24.1-3). Pinned to what the tag gave until
        # now, so this change moves nothing — bumping is a separate decision.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0 (v0)
        with:
          image: "ghcr.io/${{ github.repository_owner }}/georag-${{ matrix.service }}:${{ steps.sha.outputs.short }}"
          format: spdx-json
          artifact-name: sbom-${{ matrix.service }}-${{ steps.sha.outputs.short }}.spdx.json
          output-file: /tmp/sbom-${{ matrix.service }}.spdx.json

      - name: Upload SBOM artifact — ${{ matrix.service }}
        uses: actions/upload-artifact@v6
        with:
          name: sbom-${{ matrix.service }}-${{ steps.sha.outputs.short }}
          path: /tmp/sbom-${{ matrix.service }}.spdx.json
          retention-days: 90

      # ---------------------------------------------------------------------
      # Hand the pushed digest to the `sign` job (below).
      # Cosign keyless signing used to be the last two steps of this job. It
      # moved out on 2026-10-10 so this job, which runs six third-party
      # actions, holds no id-token:write — see its permissions block.
      #
      # After Trivy and the SBOM on purpose: a leg that fails its scan
      # records nothing, so the `sign` job has nothing to sign for it — the
      # same effect the old step order had. Only a main push pushes an image,
      # and so only a main push has a digest. Matrix legs cannot return job
      # outputs (the last leg to finish wins), hence a file per service.
      # ---------------------------------------------------------------------
      - name: Record pushed image digest — ${{ matrix.service }}
        if: github.ref == 'refs/heads/main' && steps.build.outputs.digest != ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$DIGEST" > /tmp/image-digest.txt

      - name: Upload image digest — ${{ matrix.service }}
        if: github.ref == 'refs/heads/main' && steps.build.outputs.digest != ''
        uses: actions/upload-artifact@v6
        with:
          name: image-digest-${{ matrix.service }}
          path: /tmp/image-digest.txt
          retention-days: 1

  # ─── Cosign keyless image signing (2026-06-23 sweep) ─────────────────────
  # Sigstore keyless signing via GitHub OIDC — no private key to manage. Each
  # pushed image gets a Rekor transparency-log entry binding the digest to the
  # workflow + commit SHA + branch ref. Verify downstream with:
  #   cosign verify \
  #     --certificate-identity-regexp "https://github\.com/${OWNER}/" \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
  #     ghcr.io/${OWNER}/georag-${SERVICE}@sha256:<digest>
  # PR and develop builds are not signed (no push happens, no digest to sign).
  #
  # Split out of `docker-build` 2026-10-10: this is the only job in the
  # workflow with id-token:write, and the only third-party action it runs is
  # the Cosign installer. The registry login below is a plain `docker login`
  # for the same reason — docker/login-action would be a second third-party
  # action holding the OIDC permission. The AWS deploy role trusts the
  # repository and the main ref, not a workflow, so a token minted here is
  # worth more than a signature.
  #
  # `!cancelled()` rather than the default success() so one leg's failed scan
  # does not stop the other images being signed — fail-fast is off for the
  # same reason. A leg that recorded no digest fails at the download, red.
  sign:
    name: Cosign sign — ${{ matrix.service }}
    needs: docker-build
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with docker-build's matrix.
        service: [fastapi, laravel, martin]
    permissions:
      contents: read
      # cosign pushes the signature to GHCR as an OCI artifact beside the image.
      packages: write
      id-token: write
    steps:
      - name: Fetch the digest the build pushed
        uses: actions/download-artifact@v4
        with:
          name: image-digest-${{ matrix.service }}
          path: /tmp/image-digest

      - name: Log in to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Install Cosign — ${{ matrix.service }}
        # 2026-06-24 re-audit: installer v3 cannot install Cosign v3.x;
        # bumped to v4 + cosign-release to the current v3.1.1.
        # 2026-06-29: pin to v4.1.2 — sigstore/cosign-installer does not
        # publish a floating `v4` major tag, so `@v4` failed to resolve.
        # Pinned to that tag's commit 2026-10-10, like every third-party
        # action in this file.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.1'

      - name: Cosign sign image — ${{ matrix.service }}
        env:
          COSIGN_EXPERIMENTAL: "true"
          IMAGE: ghcr.io/${{ github.repository_owner }}/georag-${{ matrix.service }}
        run: |
          digest="$(cat /tmp/image-digest/image-digest.txt)"
          # Written by this workflow's own build job, but it ends up in a
          # signing command: refuse anything that is not a bare sha256 digest.
          if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::recorded digest is not a sha256 digest: '$digest'"
            exit 1
          fi
          cosign sign --yes "${IMAGE}@${digest}"
