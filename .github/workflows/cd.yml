name: CD — Deploy

# =============================================================================
# GeoRAG Continuous Deployment — Amazon ECS
#
# Rewritten 2026-09-08 for ADR-0022 (Azure Container Apps -> AWS). The
# previous version targeted ACR + Container Apps; before that it assumed an
# SSH + docker-compose deploy to hosts that never existed and had been a
# guaranteed no-op since the day it was written.
#
# The deploy target is one ECS cluster (`georag`) fronted by ECR. Terraform
# in deploy/aws/terraform owns everything about the infrastructure; this
# workflow owns exactly three things: build the images, migrate the schema,
# and roll the services onto the new images.
#
# WHAT CHANGED, AND WHY EACH CHANGE IS AN IMPROVEMENT RATHER THAN A PORT
#
#   Build caching. `az acr build` exposes NO cache options at all — no
#   --cache-from, no --no-cache (check its --help). Every Azure deploy was
#   therefore a cold build. buildx with a GitHub Actions cache backend is a
#   straight win, not a translation.
#
#   Rollback. The Azure version hand-rolled it: read the currently-active
#   digest, remember it, and shell it back on failure. ECS deployment
#   circuit breakers do this in the service itself (see services.tf), so
#   the machinery below is gone and what remains is the part ECS cannot
#   know about — whether the MIGRATION ran.
#
#   The smoke gate does not need a PTY. `az containerapp exec` is ssh
#   underneath and calls tty.setcbreak() before running anything, so with a
#   non-terminal stdin — which is every CI runner — it died on connect with
#   `termios.error: Inappropriate ioctl for device`. On 2026-08-23, the
#   first time that step ever ran, the crash was read as "the smoke failed"
#   and rolled back a deployment that had already passed every health
#   check. Here the smoke is a one-off RunTask on the same image, in the
#   same VPC, with the same task role: no exec plugin, no PTY, and the
#   container's own exit code is the verdict.
#
#   `db:apply-raw` RUNS. This is the trap that must not repeat. Azure CD
#   ran `migrate` and nothing else, so everything created only in
#   database/raw/ has never existed in production — while live code queries
#   several of those objects (routers/interpretation.py reads all four
#   interpretation.* tables; the phase0 ops agents read
#   silver.corpus_health_findings and silver.store_reconciliation_findings;
#   app/agent/egress_gate.py reads silver.workspace_settings). See
#   scripts/raw-parity-baseline.txt and ops/runbooks/raw-sql-layer.md.
#
# Trigger:
#   - Automatically on CI success for main branch pushes (workflow_run).
#   - Manually via workflow_dispatch (hotfix / re-deploy of a specific SHA).
#
# Pre-requisite — an IAM role with a GitHub OIDC trust policy for this
# repository's `main` branch, holding ECR push, ECS deploy and iam:PassRole
# on the task roles. No stored credentials, same model as the Azure
# federated credential it replaces.

on:
  workflow_run:
    workflows: ["GeoRAG CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (empty = latest main)"
        required: false

concurrency:
  # One deploy at a time; a newer push should win over a stale one still
  # queued, so cancel-in-progress is on (unlike a rolling multi-env
  # pipeline, there's only one target here).
  group: deploy-georag
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: georag
  # The RDS instance behind the migration task and every service.
  # Deliberately stopped 23:00-06:00 US-Pacific nightly for cost (see
  # deploy/aws/terraform/scheduler.tf). The deploy job gates on its state
  # so an in-window merge fails with the real story instead of a generic
  # migration failure. Unlike the Azure gate, this needs no timezone
  # arithmetic at all: it asks RDS what state it is in.
  DB_INSTANCE: georag-pg

# Least-privilege default for every job in this file. CodeQL's
# actions/missing-workflow-permissions flags a workflow with no explicit
# block because it then inherits the repository default, which can be
# read-write for the whole repo. Jobs that genuinely need more (OIDC) keep
# their own `permissions:` block, which overrides this one rather than
# adding to it.
permissions:
  contents: read

jobs:
  # ==========================================================================
  # Guard: only proceed if CI passed (relevant for the workflow_run trigger).
  # ==========================================================================
  check-ci:
    name: Check CI outcome
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
    steps:
      - name: Resolve deploy SHA
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.sha }}" ]; then
            SHA="${{ github.event.inputs.sha }}"
          elif [ -n "${{ github.event.workflow_run.head_sha }}" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          SHORT="${SHA::7}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT}" >> "$GITHUB_OUTPUT"
          echo "Deploying SHA: ${SHA} (short: ${SHORT})"

  # ==========================================================================
  # Builds — three sibling jobs, deliberately.
  #
  # Steps within one GitHub Actions job always run sequentially, even when
  # independent; only separate jobs run in parallel. Before the 2026-08-15
  # split, fastapi's ~20 min build ran to completion and THEN laravel's
  # ~12-15 min build started, so wall-clock push-to-live was ~35-38 min.
  # Keep them separate.
  # ==========================================================================
  build:
    name: Build ${{ matrix.image }}
    needs: check-ci
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write # OIDC to assume the deploy role
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: fastapi
            dockerfile: docker/fastapi.Dockerfile
            context: ./src
          - image: laravel
            dockerfile: docker/laravel.Dockerfile
            context: .
          - image: martin
            dockerfile: docker/martin.Dockerfile
            context: .
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check-ci.outputs.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/georag/${{ matrix.image }}:${{ needs.check-ci.outputs.short_sha }}
          # The whole reason this is not `az acr build`. Layer cache turns
          # the fastapi image's ~20 min cold build into a few minutes when
          # only application code changed, which is most deploys.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false

  # ==========================================================================
  # Deploy
  # ==========================================================================
  deploy:
    name: Deploy to ECS
    needs: [check-ci, build]
    runs-on: ubuntu-latest
    # The migration poll alone budgets 900s, and the service rollouts wait
    # for stability after that.
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      SHORT_SHA: ${{ needs.check-ci.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check-ci.outputs.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── Pre-deploy gate: is the database awake? ──────────────────────
      # A merge landing inside the nightly maintenance window would
      # otherwise fail at the migration step with a connection error and no
      # explanation. The Azure version of this gate had to compute the
      # window from two cron expressions and a DST guard, and a UTC-
      # hardcoded version of that check missed the PST hour entirely (run
      # 32701044183). Asking RDS what state it is in has no such failure
      # mode.
      - name: Postgres gate
        run: |
          STATE=$(aws rds describe-db-instances \
            --db-instance-identifier "$DB_INSTANCE" \
            --query 'DBInstances[0].DBInstanceStatus' --output text)
          echo "database state: $STATE"
          if [ "$STATE" != "available" ]; then
            echo "::error::${DB_INSTANCE} is '${STATE}', not 'available'."
            echo "The platform is stopped nightly for cost (23:00-06:00 US-Pacific)."
            echo "Re-run this deploy after the morning startup sweep, or start the"
            echo "instance by hand if this is urgent."
            exit 1
          fi

      # ── Schema ────────────────────────────────────────────────────────
      # Migrations AND the raw SQL layer, in that order, as one task. The
      # Azure job ran migrations only, which is why database/raw/ objects
      # have never existed in production while live code queries them.
      - name: Migrate the schema
        id: migrate
        run: |
          # The first call in this job that changes anything. The rollback
          # step keys its "was anything deployed at all?" decision off this
          # marker: no marker means every failure above was a pre-deploy
          # gate and there is nothing to unwind.
          mkdir -p /tmp/rollback
          touch /tmp/rollback/mutation-started

          IMAGE="${{ steps.ecr.outputs.registry }}/georag/laravel:${SHORT_SHA}"

          # A fresh revision pinned to this SHA's image, so the task that
          # runs the migration is unambiguously the code being deployed.
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition georag-migrate --query taskDefinition)
          NEW_DEF=$(echo "$TASK_DEF" | jq --arg IMAGE "$IMAGE" '
            .containerDefinitions[0].image = $IMAGE
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)')
          REVISION=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_DEF" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "registered $REVISION"

          # "pending" is written BEFORE the run call. If the API accepts the
          # task but the CLI dies before rendering its ARN (runner blip,
          # throttled query), a migration exists that this run cannot name —
          # and the rollback guard must treat that as "a migration may be
          # running", not as "no migration".
          echo "pending" > /tmp/rollback/migrate-task-arn

          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$REVISION" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.AWS_PRIVATE_SUBNET_IDS }}],securityGroups=[${{ secrets.AWS_TASK_SECURITY_GROUP_ID }}],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)

          # A zero exit with EMPTY output must not overwrite "pending" with
          # "": a task likely exists that we cannot name.
          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "::error::run-task returned no task ARN — a migration may be running that this run cannot identify"
            exit 1
          fi
          echo "$TASK_ARN" > /tmp/rollback/migrate-task-arn
          echo "migration task: $TASK_ARN"

          # `wait tasks-stopped` polls for up to 100 x 6s = 600s. The Azure
          # version hardcoded a 300s poll against a job configured with a
          # 600s replicaTimeout — two timeouts set independently with the
          # OUTER one shorter — so a six-minute migration (an index build on
          # silver.document_passages, a partition conversion) made the step
          # exit 1 while the job was still running. The rollback then
          # reverted every app image, the migration completed 90 seconds
          # later, and production ran OLD code against a NEWLY migrated
          # schema: exactly the half-deployed state the rollback exists to
          # prevent. Do not shorten this below the migration's own ceiling.
          if ! aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"; then
            echo "::error::migration task did not stop within the waiter's budget"
            exit 1
          fi

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          REASON=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)
          echo "migration exit code: ${EXIT_CODE} (${REASON})"

          # A task that was killed before its container ran reports a null
          # exit code. That is not success.
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::migration failed (exit ${EXIT_CODE}: ${REASON})"
            exit 1
          fi

      # ── Roll the services ─────────────────────────────────────────────
      # No hand-rolled rollback: services.tf enables the ECS deployment
      # circuit breaker with rollback, so a service that cannot reach a
      # steady state reverts to its previous task definition by itself.
      - name: Deploy services
        run: |
          set -euo pipefail
          REGISTRY="${{ steps.ecr.outputs.registry }}"

          declare -A IMAGE=(
            [laravel-octane]=laravel
            [laravel-horizon]=laravel
            [laravel-reverb]=laravel
            [fastapi]=fastapi
            [hatchet-worker]=fastapi
            [sparse]=fastapi
            [martin]=martin
          )

          for svc in "${!IMAGE[@]}"; do
            image="${REGISTRY}/georag/${IMAGE[$svc]}:${SHORT_SHA}"
            def=$(aws ecs describe-task-definition --task-definition "georag-${svc}" \
                    --query taskDefinition)
            new=$(echo "$def" | jq --arg IMAGE "$image" '
              .containerDefinitions[0].image = $IMAGE
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                    .compatibilities, .registeredAt, .registeredBy)')
            rev=$(aws ecs register-task-definition --cli-input-json "$new" \
                    --query 'taskDefinition.taskDefinitionArn' --output text)
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$svc" \
              --task-definition "$rev" --output text --query 'service.serviceName'
            echo "$svc -> $rev"
          done

      - name: Wait for services to stabilise
        run: |
          # One waiter call per batch: `services-stable` takes up to 10
          # services and polls for 40 x 15s = 600s.
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" \
            --services laravel-octane laravel-horizon laravel-reverb \
                       fastapi hatchet-worker sparse martin

      # ── Does the product actually work? ───────────────────────────────
      # Everything above verifies that containers STARTED. None of it
      # verifies that the system does its job. On 2026-08-18
      # LARAVEL_INTERNAL_URL was unset in production, so every FastAPI ->
      # Laravel callback resolved to the Herd-local default
      # http://laravel.test and died on DNS — ingestion progress,
      # workspace-data-updated, the admin surfaces and the user inbox were
      # all silently dead. Every container was healthy and /up returned 200
      # the whole time. This gate exists for that class of failure.
      #
      # (That specific instance cannot recur: the internal URLs are set in
      # deploy/aws/terraform/config.tf now, rather than being hand-set
      # state re-asserted by each deploy. The class can.)
      #
      # A one-off RunTask rather than ECS Exec: same image, same VPC, same
      # task role, no session-manager plugin and no PTY. See this file's
      # header for what the PTY requirement cost on Azure.
      - name: Post-deploy smoke (FastAPI, Laravel bridge, Postgres, Qdrant)
        id: smoke
        run: |
          mkdir -p /tmp/rollback
          IMAGE="${{ steps.ecr.outputs.registry }}/georag/fastapi:${SHORT_SHA}"

          def=$(aws ecs describe-task-definition --task-definition georag-fastapi \
                  --query taskDefinition)
          new=$(echo "$def" | jq --arg IMAGE "$IMAGE" '
            .family = "georag-smoke"
            | .containerDefinitions[0].image = $IMAGE
            | .containerDefinitions[0].command = ["python3","/app/scripts/ops/post_deploy_smoke.py"]
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)')
          rev=$(aws ecs register-task-definition --cli-input-json "$new" \
                  --query 'taskDefinition.taskDefinitionArn' --output text)

          TASK_ARN=$(aws ecs run-task --cluster "$ECS_CLUSTER" --task-definition "$rev" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.AWS_PRIVATE_SUBNET_IDS }}],securityGroups=[${{ secrets.AWS_TASK_SECURITY_GROUP_ID }}],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text) || TASK_ARN=""

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            # The harness broke, not the deployment. That distinction is
            # the whole lesson of the 2026-08-23 rollback: "the check
            # failed" and "the check could not run" are different facts,
            # and only one of them is about the application. Fail loudly so
            # a human looks; do not unwind a deployment that passed every
            # other gate.
            echo "::error::smoke task could not be started — the gate did not run"
            touch /tmp/rollback/smoke-inconclusive
            exit 1
          fi

          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" || true
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)

          echo "smoke exit code: ${EXIT_CODE}"
          if [ "$EXIT_CODE" = "0" ]; then
            echo "post-deploy smoke passed"
            exit 0
          fi
          if [ "$EXIT_CODE" = "None" ] || [ -z "$EXIT_CODE" ]; then
            echo "::error::smoke task produced no exit code — the gate did not run"
            touch /tmp/rollback/smoke-inconclusive
            exit 1
          fi
          echo "::error::post-deploy smoke FAILED (exit ${EXIT_CODE})"
          exit 1

      # ── If anything above failed ──────────────────────────────────────
      # Deliberately thin. ECS reverts the services itself; what it cannot
      # know is whether the migration ran, which is the one thing that
      # makes a rollback dangerous rather than free.
      - name: Report deployment state on failure
        if: failure() || cancelled()
        run: |
          echo "## Deployment failed" >> "$GITHUB_STEP_SUMMARY"

          if [ ! -f /tmp/rollback/mutation-started ]; then
            echo "Nothing was deployed — this failed on a pre-deploy gate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -f /tmp/rollback/smoke-inconclusive ]; then
            echo "The smoke gate could not run. That is NOT evidence the deployment is bad." >> "$GITHUB_STEP_SUMMARY"
            echo "The services were left alone deliberately. Check them by hand before acting." >> "$GITHUB_STEP_SUMMARY"
          fi

          MIGRATE=$(cat /tmp/rollback/migrate-task-arn 2>/dev/null || echo "none")
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Migration task: \`${MIGRATE}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$MIGRATE" = "pending" ]; then
            echo "**A migration may be running that this run could not identify.**" >> "$GITHUB_STEP_SUMMARY"
            echo "Do not redeploy until you have established what it did:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "aws ecs list-tasks --cluster ${ECS_CLUSTER} --family georag-migrate --desired-status STOPPED" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$MIGRATE" != "none" ]; then
            echo "The schema may already be migrated. ECS reverts the SERVICES on its own" >> "$GITHUB_STEP_SUMMARY"
            echo "(deployment circuit breaker), which leaves old code against a new schema —" >> "$GITHUB_STEP_SUMMARY"
            echo "check whether that combination is safe before assuming the rollback was clean." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Service state:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          aws ecs describe-services --cluster "$ECS_CLUSTER" \
            --services laravel-octane fastapi hatchet-worker \
            --query 'services[].{name:serviceName,running:runningCount,desired:desiredCount,rollout:deployments[0].rolloutState}' \
            --output text >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
