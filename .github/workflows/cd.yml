name: CD — Deploy

# =============================================================================
# GeoRAG Continuous Deployment — Azure Container Apps
#
# Rewritten 2026-08-05: the previous version of this file assumed an SSH +
# docker-compose deploy target (dev/staging/production hosts) from before the
# Azure migration. No such hosts exist, no SSH secrets were ever configured,
# and every real step was wrapped in continue-on-error — it had been a
# guaranteed no-op since the day it was written. The actual deploy target is
# a single Azure Container Apps environment (`georag-env-cc`, resource group
# `georag`, canadacentral) fronted by ACR `georagacrcc.azurecr.io`. This
# version targets that directly: build the two images that change
# (fastapi, laravel — Dagster's images are retired, see Phase B2), migrate,
# then roll each Container App / Job over to the new image, with a
# best-effort rollback to the previously-active digest on health-check
# failure.
#
# Trigger:
#   - Automatically on CI success for main branch pushes (workflow_run).
#   - Manually via workflow_dispatch (hotfix / re-deploy of a specific SHA).
#
# Pre-requisite — an Azure AD app registration with a federated credential
# (OIDC, no stored secret) trusting this repo's `main` branch, holding at
# least AcrPush on `georagacrcc` and Contributor on the `georag` resource
# group. Creating an app registration requires Entra ID directory
# permissions this session's Azure login does not have — provision it once
# from an account that does have them:
#
#   az ad app create --display-name georag-github-cd \
#     --query appId -o tsv                                   # -> APP_ID
#   az ad sp create --id <APP_ID>
#   az ad app federated-credential create --id <APP_ID> --parameters '{
#     "name": "github-main",
#     "issuer": "https://token.actions.githubusercontent.com",
#     "subject": "repo:kjmaguire/GeoRag-Intelligent-V2.1:ref:refs/heads/main",
#     "audiences": ["api://AzureADTokenExchange"]
#   }'
#   az role assignment create --assignee <APP_ID> --role AcrPush \
#     --scope /subscriptions/d314ab40-b5b7-4e3e-8308-86023fb7638a/resourceGroups/georag/providers/Microsoft.ContainerRegistry/registries/georagacrcc
#   az role assignment create --assignee <APP_ID> --role Contributor \
#     --scope /subscriptions/d314ab40-b5b7-4e3e-8308-86023fb7638a/resourceGroups/georag
#
# Then set these three (non-secret, but stored as secrets for convenience):
#   gh secret set AZURE_CLIENT_ID       --body <APP_ID>
#   gh secret set AZURE_TENANT_ID       --body 5da21fe4-bdac-4796-bad2-fbe0989f3824
#   gh secret set AZURE_SUBSCRIPTION_ID --body d314ab40-b5b7-4e3e-8308-86023fb7638a
#
# Until AZURE_CLIENT_ID exists, the `azure/login` step below fails fast with
# a clear error rather than silently no-op'ing like the old pipeline did.
# =============================================================================

on:
  workflow_run:
    workflows: ["GeoRAG CI"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (empty = latest main)"
        required: false

concurrency:
  # One deploy at a time; a newer push should win over a stale one still
  # queued, so cancel-in-progress is on (unlike a rolling multi-env pipeline,
  # there's only one target here).
  group: deploy-georag
  cancel-in-progress: true

env:
  AZURE_RG: georag
  ACR_NAME: georagacrcc
  ACR_LOGIN_SERVER: georagacrcc.azurecr.io

# Least-privilege default for every job in this file. CodeQL's
# actions/missing-workflow-permissions flags a workflow with no explicit
# block because it then inherits the repository default, which can be
# read-write for the whole repo. Jobs that genuinely need more (SARIF
# upload, OIDC, package push) keep their own `permissions:` block, which
# overrides this one rather than adding to it.
permissions:
  contents: read

jobs:
  # ==========================================================================
  # Guard: only proceed if CI passed (relevant for the workflow_run trigger).
  # ==========================================================================
  check-ci:
    name: Check CI outcome
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
    steps:
      - name: Resolve deploy SHA
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.sha }}" ]; then
            SHA="${{ github.event.inputs.sha }}"
          elif [ -n "${{ github.event.workflow_run.head_sha }}" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          SHORT="${SHA::7}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT}" >> "$GITHUB_OUTPUT"
          echo "Deploying SHA: ${SHA} (short: ${SHORT})"

  # ==========================================================================
  # Build fastapi — split into its own job (2026-08-15 audit) so it runs
  # concurrently with build-laravel instead of sequentially in the same job.
  # Steps within a single GitHub Actions job always run sequentially, even
  # if they're independent — only separate jobs run in parallel. Before this
  # split, fastapi's ~20 min ACR build ran to completion, THEN laravel's
  # ~12-15 min build started, so wall-clock push-to-live time was ~35-38 min
  # even after the GHCR/Trivy/SBOM split (2026-08-14) cut CD's trigger delay.
  # That earlier split only fixed how soon CD *started*; it never touched
  # the fact that CD's own deploy job serialized its two builds. Splitting
  # them into sibling jobs collapses that ~32-35 min build phase to
  # max(~20, ~12-15) ≈ 20 min.
  #
  # azure/login is duplicated here rather than shared: OIDC login is a fast,
  # stateless token exchange (no state to carry between jobs), and GitHub
  # Actions has no supported way to share an authenticated CLI session
  # across jobs (each job gets a fresh runner/VM). id-token: write must be
  # granted on every job that calls azure/login, not just one.
  # ==========================================================================
  build-fastapi:
    name: Build fastapi image
    needs: check-ci
    if: needs.check-ci.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      id-token: write
      contents: read
    env:
      SHORT_SHA: ${{ needs.check-ci.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check-ci.outputs.sha }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # `az acr build` exposes NO cache options at all — no --cache-from, no
      # --no-cache (check `az acr build --help`). Every deploy therefore
      # rebuilt this image from scratch: recompiling Tesseract 5.5.2 from
      # source, reinstalling ~2 GB of Python deps, and re-downloading and
      # baking the SPLADE++ weights, none of which change between deploys.
      # Measured 15-29 min per run, against a 2 min actual deploy.
      #
      # buildx on the runner is the only way to get cross-run layer caching
      # here. Cache lives in ACR itself under a `buildcache` tag, so it
      # survives runner recycling and is shared across branches. That tag
      # deliberately does not match the purge task's `^[0-9a-f]{7}$` filter
      # (see reference-acr-purge-task), so hygiene automation will not delete
      # the cache out from under us.
      - name: Free runner disk
        # ubuntu-latest ships ~14 GB free; this image's builder stage (Python
        # deps + a full C toolchain for Tesseract) can exceed that once buildx
        # also holds a layer cache. Reclaims ~20 GB of preinstalled SDKs we
        # never use. Cheap insurance against a no-space-left failure that
        # would look like a flaky build.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h / | tail -1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: ACR login
        run: az acr login --name "$ACR_NAME"

      - name: Build + push fastapi image
        uses: docker/build-push-action@v6
        with:
          context: src
          file: docker/fastapi.Dockerfile
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/georag/fastapi:${{ env.SHORT_SHA }}
            ${{ env.ACR_NAME }}.azurecr.io/georag/fastapi:latest
          cache-from: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/georag/fastapi:buildcache
          # mode=max caches intermediate stages too — without it the
          # tesseract-builder and builder stages, which are the whole cost
          # here, would not be cached at all.
          cache-to: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/georag/fastapi:buildcache,mode=max

  # ==========================================================================
  # Build laravel — sibling of build-fastapi, see that job's comment for why
  # this is a separate job rather than a second step in `deploy`.
  # ==========================================================================
  build-laravel:
    name: Build laravel image
    needs: check-ci
    if: needs.check-ci.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      id-token: write
      contents: read
    env:
      SHORT_SHA: ${{ needs.check-ci.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check-ci.outputs.sha }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: ACR login
        run: az acr login --name "$ACR_NAME"

      - name: Build + push laravel image
        # VITE_REVERB_* are baked into the Vite bundle at build time. On Azure,
        # Reverb runs on its own Container App hostname, so the browser cannot
        # derive the WS endpoint from window.location — omitting these args
        # ships a bundle whose websocket dials the octane host and every chat
        # stream / progress event is silently lost (live failure 2026-08-07).
        # The app key is public by design (it is embedded in the JS bundle).
        #
        # Cached the same way as the fastapi image — see that job for why
        # `az acr build` had to go. This one is 11 min and runs in parallel, so
        # it was never the critical path, but composer + npm install are just
        # as re-runnable and there is no reason to pay for them twice.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/laravel.Dockerfile
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/georag/laravel:${{ env.SHORT_SHA }}
            ${{ env.ACR_NAME }}.azurecr.io/georag/laravel:latest
          build-args: |
            VITE_REVERB_APP_KEY=gxk7h5w2ato1zq9pm4b8rucy0fedlvj3
            VITE_REVERB_HOST=laravel-reverb-cc.lemonmushroom-67c93108.canadacentral.azurecontainerapps.io
            VITE_REVERB_PORT=443
            VITE_REVERB_SCHEME=https
          cache-from: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/georag/laravel:buildcache
          cache-to: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/georag/laravel:buildcache,mode=max

  # ==========================================================================
  # Deploy — migrate, roll over each Container App, health-check, roll back
  # on failure. Single stage: there is one live environment, not a
  # dev/staging/production chain (see the file header for why). Runs after
  # BOTH build jobs so the migrate step (which runs on the new laravel
  # image) and the fastapi rollout always have an image to pull.
  # ==========================================================================
  deploy:
    name: Deploy to Azure Container Apps
    needs: [check-ci, build-fastapi, build-laravel]
    if: needs.check-ci.result == 'success' && needs.build-fastapi.result == 'success' && needs.build-laravel.result == 'success'
    runs-on: ubuntu-latest
    # 2026-08-15: the two ACR builds (fastapi ~20 min, laravel ~12-15 min)
    # moved out to their own parallel jobs (build-fastapi, build-laravel)
    # above — this job's timeout no longer needs to absorb both builds
    # sequentially, just the migrate/rollout/health-check/rollback chain
    # that follows them. Trimmed from 80 accordingly, but kept generous:
    # the migrate-job poll alone budgets 300s, and az containerapp update /
    # revision-health polling across 5 targets can legitimately run long on
    # a slow ACR/ACA control-plane day (the migrate poll now derives its
    # deadline from the job's own replicaTimeout — 660s at replicaTimeout
    # 600 — rather than the hardcoded 300s this comment used to cite).
    # (See the 2026-08-11 note this
    # replaced, which was sized for the pre-split single job.)
    timeout-minutes: 40
    environment:
      name: production
      url: https://laravel-octane-cc.lemonmushroom-67c93108.canadacentral.azurecontainerapps.io
    permissions:
      id-token: write
      contents: read
    env:
      SHORT_SHA: ${{ needs.check-ci.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check-ci.outputs.sha }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── Scan the images that are actually about to ship ────────────────
      # docker-build.yml already runs a blocking Trivy CRITICAL scan and
      # Cosign-signs the result — but it scans GHCR images built by a
      # separate buildx run, and this workflow builds and deploys its own
      # ACR images. Nothing in that chain gates this one: cd.yml triggers
      # on `workflow_run: workflows: ["GeoRAG CI"]`, and docker-build.yml
      # is a different workflow, so a CRITICAL CVE could turn docker-build
      # red while CI stayed green and this job shipped the same Dockerfile
      # to production regardless.
      #
      # These two steps scan the exact ACR tags the rollout below pulls,
      # before the migrate step touches the database — the earliest point
      # at which failing costs nothing to undo.
      #
      # Trivy pulls the image itself, so it needs registry credentials.
      # The build jobs ran `az acr login` in their own runners; this job
      # never did, because `az containerapp update --image` only passes a
      # reference and never touches the registry.
      - name: ACR login (for the scans below)
        run: az acr login --name "$ACR_NAME"

      # Settings deliberately identical to docker-build.yml's scan (same
      # action version, severity, ignore-unfixed) so the two cannot drift
      # into disagreeing about what "clean" means — the whole problem here
      # was two scan paths with different scopes.
      #
      # ignore-unfixed: a CRITICAL with no available patch is not
      # actionable at deploy time and would only teach people to bypass
      # this gate.
      - name: Trivy scan — fastapi image (blocking on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.ACR_LOGIN_SERVER }}/georag/fastapi:${{ env.SHORT_SHA }}"
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL

      - name: Trivy scan — laravel image (blocking on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.ACR_LOGIN_SERVER }}/georag/laravel:${{ env.SHORT_SHA }}"
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL

      # Capture the currently-active image digest for every app/job this
      # deploy touches, before changing anything, so a failed health check
      # has something exact to roll back to.
      - name: Snapshot current images (for rollback)
        run: |
          mkdir -p /tmp/rollback
          for target in fastapi-cc hatchet-worker-cc laravel-octane-cc laravel-horizon-cc laravel-reverb-cc; do
            az containerapp show -g "$AZURE_RG" -n "$target" \
              --query "properties.template.containers[0].image" -o tsv \
              > "/tmp/rollback/${target}.image"
          done
          az containerapp job show -g "$AZURE_RG" -n laravel-migrate-job \
            --query "properties.template.containers[0].image" -o tsv \
            > /tmp/rollback/laravel-migrate-job.image
          echo "Snapshotted:"; cat /tmp/rollback/*.image

      # Migrate first, on the new image, before anything else starts serving
      # it — the project_user boot guard (AppServiceProvider) refuses to
      # serve traffic on a schema that isn't there yet.
      - name: Run migrations (laravel-migrate-job)
        run: |
          az containerapp job update -g "$AZURE_RG" -n laravel-migrate-job \
            --image "${ACR_LOGIN_SERVER}/georag/laravel:${SHORT_SHA}"
          EXEC_ID=$(az containerapp job start -g "$AZURE_RG" -n laravel-migrate-job \
            --query "name" -o tsv)
          # The rollback step runs in a separate shell and needs to know
          # whether this execution is still moving before it touches images.
          mkdir -p /tmp/rollback
          echo "$EXEC_ID" > /tmp/rollback/migrate-exec-id

          # Read the deadline off the job instead of hardcoding one. The poll
          # used to run 30 x 10s = 300s while the job itself is configured with
          # replicaTimeout 600 — two timeouts set independently, with the OUTER
          # one shorter. A migration that takes six minutes (an index build on
          # silver.document_passages, a partition conversion) made this step
          # exit 1 while the job was still running: the rollback then reverted
          # every app image, the migration completed 90 seconds later, and
          # production ended up running OLD code against a NEWLY migrated
          # schema — precisely the half-deployed state the rollback exists to
          # prevent.
          #
          # +60s of grace so the poll outlives the job it is watching, and a
          # genuine timeout is reported by the job rather than guessed at here.
          REPLICA_TIMEOUT=$(az containerapp job show -g "$AZURE_RG" -n laravel-migrate-job \
            --query "properties.configuration.replicaTimeout" -o tsv 2>/dev/null || echo 600)
          DEADLINE=$(( REPLICA_TIMEOUT + 60 ))
          ATTEMPTS=$(( DEADLINE / 10 ))
          echo "polling for up to ${DEADLINE}s (job replicaTimeout=${REPLICA_TIMEOUT}s)"

          for i in $(seq 1 "$ATTEMPTS"); do
            STATUS=$(az containerapp job execution show -g "$AZURE_RG" -n laravel-migrate-job \
              --job-execution-name "$EXEC_ID" --query "properties.status" -o tsv 2>/dev/null || echo "")
            echo "migrate job: $STATUS ($i/$ATTEMPTS)"
            case "$STATUS" in
              Succeeded) exit 0 ;;
              Failed|Stopped) echo "::error::migration job ended in $STATUS"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::migration job did not finish within ${DEADLINE}s (job replicaTimeout=${REPLICA_TIMEOUT}s)"
          exit 1

      # LARAVEL_INTERNAL_URL is re-asserted on every deploy rather than left
      # as one-time hand-set state. It was never set at all until 2026-08-18,
      # so laravel_bridge fell back to its Herd-local default
      # (http://laravel.test) and every FastAPI->Laravel callback died on DNS
      # - ingestion progress, workspace-data-updated, admin surfaces and the
      # user inbox were all silently dead in production. --set-env-vars
      # merges (it does not replace the rest of the container env), so
      # folding it into the same update keeps this to one new revision.
      #
      # http://laravel-octane-cc is Container Apps in-environment name for
      # the Octane app; verified from inside hatchet-worker-cc on 2026-08-18
      # (resolves to 100.100.235.221, /up -> 200). Deliberately NOT the
      # public FQDN, which would hairpin every callback out to the internet.
      - name: Deploy fastapi image (fastapi-cc, hatchet-worker-cc)
        run: |
          for target in fastapi-cc hatchet-worker-cc; do
            az containerapp update -g "$AZURE_RG" -n "$target" \
              --image "${ACR_LOGIN_SERVER}/georag/fastapi:${SHORT_SHA}" \
              --set-env-vars "LARAVEL_INTERNAL_URL=http://laravel-octane-cc"
          done

      # Order matters: queue CONSUMERS before the producer. These three are
      # updated sequentially with no barrier (~30s end to end, measured on
      # the 71ed325 run: octane 22:55:02, horizon 22:55:16, reverb 22:55:31),
      # so there is always a window where one app runs new code and another
      # still runs old. Rolling Horizon first makes that window safe: the
      # worker is never BEHIND the web tier, so a deploy that changes a
      # queued job payload can never hand a new-shape job to an old worker.
      # Horizon already has to tolerate old-shape jobs regardless — anything
      # queued before the deploy is still sitting in Redis.
      - name: Deploy laravel image (horizon, reverb, octane)
        run: |
          for target in laravel-horizon-cc laravel-reverb-cc laravel-octane-cc; do
            az containerapp update -g "$AZURE_RG" -n "$target" \
              --image "${ACR_LOGIN_SERVER}/georag/laravel:${SHORT_SHA}"
          done

      # Poll revision health rather than assuming traffic wakes a
      # scaled-to-zero app instantly — mirrors the same wait_healthy pattern
      # the startup-scheduler-cc job already uses.
      - name: Wait for revisions to report healthy
        run: |
          wait_healthy() {
            app="$1"; timeout="${2:-120}"; waited=0
            while [ "$waited" -lt "$timeout" ]; do
              health=$(az containerapp revision list -g "$AZURE_RG" -n "$app" \
                --query "[?properties.active]|[0].properties.healthState" -o tsv 2>/dev/null || echo "")
              if [ "$health" = "Healthy" ]; then
                echo "$app: healthy (${waited}s)"; return 0
              fi
              sleep 10; waited=$((waited + 10))
            done
            echo "::error::$app did not report Healthy within ${timeout}s (last=$health)"
            return 1
          }
          fail=0
          for app in fastapi-cc hatchet-worker-cc laravel-octane-cc laravel-horizon-cc laravel-reverb-cc; do
            wait_healthy "$app" 120 || fail=1
          done
          [ "$fail" -eq 0 ]

      - name: Health check — laravel /up
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
              "https://laravel-octane-cc.lemonmushroom-67c93108.canadacentral.azurecontainerapps.io/up" || echo 000)
            echo "attempt $i/12: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::laravel-octane-cc /up never returned 200"
          exit 1

      # ── Does the product actually work? ───────────────────────────
      # Everything above this point verifies that containers STARTED. None
      # of it verifies that the system does its job. On 2026-08-18
      # LARAVEL_INTERNAL_URL was unset in production, so every FastAPI ->
      # Laravel callback resolved to the Herd-local default
      # http://laravel.test and died on DNS — ingestion progress,
      # workspace-data-updated, the admin surfaces and the user inbox were
      # all silently dead. Every container was Healthy and /up returned 200
      # the whole time. This gate exists for that class.
      #
      # It runs INSIDE fastapi-cc because fastapi-cc's ingress is internal
      # (`external: false`) — a GitHub runner cannot reach it at all, so
      # curling it from here is not an option. One exec call, invoking a
      # script baked into the image: the exec command is capped near 2048
      # characters and repeated calls are rate-limited (429, retry-after
      # 600s), both measured 2026-08-21. See the script's docstring.
      #
      # Placed BEFORE the rollback step so a failure trips the existing
      # `if: failure() || cancelled()` rollback with no new machinery.
      - name: Post-deploy smoke (FastAPI, Laravel bridge, Postgres, Qdrant)
        run: |
          set -o pipefail
          mkdir -p /tmp/rollback

          # `script -qec` allocates a PTY, and that is load-bearing.
          # `az containerapp exec` is the SSH command underneath, and on
          # POSIX it calls tty.setcbreak(sys.stdin.fileno()) before it
          # runs anything. With `< /dev/null` -- or any non-terminal
          # stdin, which is every GitHub runner -- that raises
          #     termios.error: (25, 'Inappropriate ioctl for device')
          # and the CLI dies on connect. On 2026-08-23, the first time
          # this step ever ran, that crash was read as "the smoke failed"
          # and rolled back a deployment that had already passed revision
          # health and the /up check. Do not remove the wrapper; a local
          # test on Windows proves nothing, because tty.setcbreak is
          # POSIX-only and the CLI takes a different branch there.
          OUT=$(script -qec "az containerapp exec -g $AZURE_RG -n fastapi-cc --command 'python3 /app/scripts/ops/post_deploy_smoke.py'" /dev/null 2>&1 | tr -d '\r') || true
          echo "$OUT"

          # `az containerapp exec` exits 0 for a successful CONNECTION no
          # matter what the command did, so the exit code proves nothing.
          # The script's contract is three-way and both sentinels are on
          # its last line: SMOKE_OK, or SMOKE_FAILED: <checks>.
          if echo "$OUT" | grep -q "SMOKE_OK"; then
            echo "post-deploy smoke passed"
            exit 0
          fi

          # NEITHER sentinel means the script never got far enough to
          # print one -- the harness broke, the connection failed, the
          # image lacks the script. That is not evidence the deployment
          # is bad, and reverting five apps on the strength of a broken
          # gate is a self-inflicted outage. Fail the job loudly so a
          # human looks, and leave the images alone; the rollback step
          # below reads this marker and refuses.
          #
          # The distinction is the whole lesson from the 2026-08-23
          # rollback: "the check failed" and "the check could not run"
          # are different facts, and only one of them is about the app.
          if ! echo "$OUT" | grep -q "SMOKE_FAILED"; then
            touch /tmp/rollback/smoke-inconclusive
            echo "::error::post-deploy smoke could not RUN -- no SMOKE_OK and no SMOKE_FAILED in its output."
            echo "::error::The deploy passed revision health and /up, so the images are being LEFT AS DEPLOYED."
            echo "::error::Fix the harness, then re-run. Check for a termios/PTY error above."
            exit 1
          fi

          echo "::error::post-deploy smoke FAILED — the deployment is up but not working. Rolling back."
          exit 1

      - name: Rollback on failure or cancellation
        # cancelled() matters here (2026-08-14 audit): this workflow's
        # concurrency group has cancel-in-progress: true, so a newer push
        # can cancel a deploy AFTER migrations ran / apps were partially
        # rolled over — with a bare failure() condition, that cancelled run
        # never rolled back and left the environment half-deployed. The
        # step is bounded so a hung `az` call can't keep a cancelled job
        # pinned to the runner past GitHub's grace period.
        if: failure() || cancelled()
        timeout-minutes: 10
        run: |
          echo "::warning::deploy failed or was cancelled mid-flight — rolling back to the pre-deploy image on each app"

          # ── An inconclusive gate is not a failed deployment ────────────
          # Set by the smoke step when it produced neither of the script's
          # sentinels, i.e. the check never ran. Rolling back on that
          # reverts five healthy apps because a harness broke -- which is
          # exactly what happened on 2026-08-23, when az containerapp exec
          # died on a missing TTY and took a good deploy with it.
          #
          # Same reasoning as the live-migration guard below: doing
          # nothing is the safe state, and it is the intervention that
          # would break it. The job still fails, so nothing ships
          # silently and a human decides.
          if [ -f /tmp/rollback/smoke-inconclusive ]; then
            echo "::error::post-deploy smoke was INCONCLUSIVE (it could not run) — refusing to roll back"
            echo "The apps are running the NEWLY deployed images and passed revision"
            echo "health and /up. Verify by hand, then either re-run the smoke or roll"
            echo "back deliberately:"
            echo "  bash deploy/azure/containerapps/rollback.sh   # if one exists"
            echo "  az containerapp update -g $AZURE_RG -n <app> --image <previous>"
            exit 1
          fi

          # ── Never roll back underneath a live migration ────────────────
          # The migrate poll gives up at replicaTimeout+60s, but giving up
          # watching is not the same as the job stopping. If the execution
          # is still Running, reverting the app images now puts OLD code in
          # front of a schema that is still being migrated forward — the
          # precise half-deployed state this step exists to prevent, and
          # the deterministic outcome rather than a worst case.
          #
          # Refusing is the right call, not stopping the job: killing a
          # migration mid-batch leaves an arbitrary prefix applied with no
          # record of where it stopped. Apps are still on their OLD images
          # at this point anyway (migrations run BEFORE any rollout), so
          # doing nothing is the safe state — it is the intervention that
          # would break it.
          if [ -f /tmp/rollback/migrate-exec-id ]; then
            EXEC_ID=$(cat /tmp/rollback/migrate-exec-id)
            MSTATUS=$(az containerapp job execution show -g "$AZURE_RG" \
              -n laravel-migrate-job --job-execution-name "$EXEC_ID" \
              --query "properties.status" -o tsv 2>/dev/null || echo "")
            if [ "$MSTATUS" = "Running" ]; then
              echo "::error::migration execution $EXEC_ID is STILL RUNNING — refusing to roll back images underneath it"
              echo "The apps are still on their pre-deploy images (migrations run first),"
              echo "so the environment is currently consistent. Wait for the execution to"
              echo "reach a terminal state, then decide by hand:"
              echo "  az containerapp job execution show -g $AZURE_RG -n laravel-migrate-job --job-execution-name $EXEC_ID"
              exit 1
            fi
          fi

          # ── Roll back, loudly ─────────────────────────────────────────
          # Every az call here used to end in `|| true` with no aggregate
          # check, so a throttled or control-plane-faulted rollback exited
          # 0 and the step reported success. `|| true` is kept per-call so
          # one failed app does not abandon the other four — but each
          # failure is now recorded and re-raised at the end.
          rc=0
          for target in fastapi-cc hatchet-worker-cc laravel-octane-cc laravel-horizon-cc laravel-reverb-cc; do
            if [ -f "/tmp/rollback/${target}.image" ]; then
              PREV=$(cat "/tmp/rollback/${target}.image")
              echo "Rolling back $target -> $PREV"
              if ! az containerapp update -g "$AZURE_RG" -n "$target" --image "$PREV"; then
                echo "::error::rollback FAILED for $target — it may still be running the bad image"
                rc=1
              fi
            else
              echo "::error::no pre-deploy snapshot for $target — cannot roll it back"
              rc=1
            fi
          done
          if [ -f /tmp/rollback/laravel-migrate-job.image ]; then
            PREV=$(cat /tmp/rollback/laravel-migrate-job.image)
            if ! az containerapp job update -g "$AZURE_RG" -n laravel-migrate-job --image "$PREV"; then
              echo "::error::rollback FAILED for laravel-migrate-job"
              rc=1
            fi
          fi

          if [ "$rc" -ne 0 ]; then
            echo "::error::rollback did not fully succeed — production may be in a mixed state. Check each app's active image before retrying the deploy."
            exit 1
          fi
          echo "rollback complete — all five apps and the migrate job reverted"
