# Run a whitelisted database seeder against the production ECS deployment.
#
# One-off operator action: runs the `georag-migrate` task definition with its
# command overridden to `php artisan db:seed --class=<seeder> --force`, on the
# image that task definition already carries (i.e. whatever CD last deployed).
# The task's environment and secrets are preserved, so the seeder runs with
# the same DB credentials — and on the same `pgsql_migrations` connection, as
# the owner role rather than the runtime one — that migrations use.
#
# Ported from Azure Container Apps to ECS on 2026-09-16 (ADR-0022). It was
# the last workflow still calling `azure/login@v2`, and it had been dead since
# the cutover: it started `laravel-migrate-job`, a Container Apps Job that no
# longer exists, and gated on `georag-pg-cc`, a Flexible Server that no longer
# exists. A dispatch would have failed at the login step.
#
# Uses the same OIDC role as cd.yml (AWS_DEPLOY_ROLE_ARN), so this workflow
# can only be dispatched from main.
#
# The seeder class is a `choice` input — arbitrary commands cannot be injected
# through the dispatch UI. Add new seeders to the options list deliberately.

name: Run seeder

on:
  workflow_dispatch:
    inputs:
      seeder:
        description: "Seeder class to run"
        required: true
        default: "TeamUserSeeder"
        type: choice
        options:
          - TeamUserSeeder
          - DemoUserSeeder

concurrency:
  group: seed-georag
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: georag
  DB_IDENTIFIER: georag-pg
  TASK_FAMILY: georag-migrate

permissions:
  contents: read

jobs:
  seed:
    name: Run ${{ inputs.seeder }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Same reasoning as cd.yml's Postgres gate: the instance is stopped
      # nightly for cost, and under `power=off` it does not exist at all.
      # Fail with the real story instead of a generic connection error from
      # inside the seeder, and distinguish the two cases — "wait for the
      # morning sweep" and "the stack is powered off" need different actions.
      - name: Postgres gate (nightly stop window / power flag)
        run: |
          set -uo pipefail
          STATE=$(aws rds describe-db-instances \
            --db-instance-identifier "$DB_IDENTIFIER" \
            --query 'DBInstances[0].DBInstanceStatus' --output text 2>/dev/null || echo "absent")
          echo "postgres state: $STATE"
          if [ "$STATE" = "absent" ]; then
            echo "::error::$DB_IDENTIFIER does not exist. The stack is powered off — run 'terraform apply -var power=on' first (see deploy/aws/terraform/power.tf)."
            exit 1
          fi
          if [ "$STATE" != "available" ]; then
            echo "::error::$DB_IDENTIFIER is '$STATE'. The nightly sweep stops it at 23:00 and starts it at 06:00 America/Los_Angeles. Re-run when it is 'available'."
            exit 1
          fi

      - name: Run seeder as a one-off ECS task
        run: |
          set -euo pipefail

          # Only the command is overridden. The task definition's entryPoint
          # is ["/bin/sh", "-c"], so the override is a single shell string,
          # and everything that makes the migrate task able to reach the
          # database — image, environment, secrets, task role — is inherited
          # rather than restated here, where it could drift.
          SEEDER='${{ inputs.seeder }}'
          OVERRIDES=$(jq -nc --arg seeder "$SEEDER" '{
            containerOverrides: [{
              name: "migrate",
              command: ["php artisan db:seed --class=\($seeder) --force"]
            }]
          }')

          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$TASK_FAMILY" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.AWS_PRIVATE_SUBNET_IDS }}],securityGroups=[${{ secrets.AWS_TASK_SECURITY_GROUP_ID }}],assignPublicIp=DISABLED}" \
            --overrides "$OVERRIDES" \
            --query 'tasks[0].taskArn' --output text)

          # A zero exit with empty output means a task may be running that
          # this run cannot name. That is not success — the same trap cd.yml
          # documents on its migration call.
          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "::error::run-task returned no task ARN — a seeder may be running that this run cannot identify"
            exit 1
          fi
          echo "seeder task: $TASK_ARN"

          if ! aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"; then
            echo "::error::seeder task did not stop within the waiter's budget (100 x 6s)"
            exit 1
          fi

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          REASON=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)
          echo "seeder exit code: ${EXIT_CODE} (${REASON})"

          # A task killed before its container ran reports a null exit code.
          # That is not success either.
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::seeder failed (exit ${EXIT_CODE}: ${REASON}). Container output is in the CloudWatch log group for ${TASK_FAMILY}."
            exit 1
          fi
