name: GeoRAG Release Rehearsal

# ─── THIS WORKFLOW HAS NEVER RUN ─────────────────────────────────────────────
# Corrected 2026-08-21. `gh run list --workflow=release-rehearsal.yml`
# returns ZERO runs, and the header used to explain that away with three
# claims that were false or stale:
#
#   1. "Triggered by cd.yml after a successful staging deploy
#      (workflow_run)" — FALSE. The `on:` block below has only
#      workflow_dispatch and `push: tags: v*.*.*`, and cd.yml contains no
#      dispatch of this workflow. Nothing has ever triggered it.
#   2. The Ollama/DeepSeek feasibility note — STALE. Ollama was retired;
#      the stack is vLLM + Azure AI Foundry. The 18 GB VRAM argument that
#      justified continue-on-error no longer describes anything.
#   3. "configure a staging host" / secrets.STAGING_URL — will never
#      happen. This is a single-environment deployment; there is no
#      staging and none is planned.
#
# The repo has exactly one tag (`pre-storage-abstraction-20260725`), which
# does not match `v*.*.*`. So the only live trigger is manual dispatch.
#
# ─── What that costs ─────────────────────────────────────────────────────────
# ci.yml:831 deselects `integration`, `golden`, `hallucination`, `live` and
# `chaos` from the PR suite and routes them here. `chaos` has its own weekly
# workflow; the rest execute in NO workflow at all. That is 377 tests,
# ~12% of the Python suite — and the largest slice is `integration`, not the
# 8 golden/hallucination quality tests. Seven of those modules are
# live-Postgres sweeps over exactly the ingestion-completion and
# data-integrity paths this codebase has repeatedly broken in production:
#   test_ingest_progress_state_machine, test_orphan_sweep, test_mv_refresh,
#   test_nightly_ingestion_integrity, test_reliability_metrics,
#   test_stale_run_detector, test_embed_pending_completion_sweep
#
# The golden/hallucination half IS partly covered elsewhere:
# eval-gate.yml runs nightly against real Postgres + real Qdrant with a
# stubbed LLM, so import rot, schema drift and evaluator crashes are gated.
# What nothing gates is answer QUALITY, because those calls are stubbed.
#
# ─── The fix, in priority order ──────────────────────────────────────────────
#   1. Move the Postgres-backed `integration` modules into a blocking ci.yml
#      job. The postgis service definition four other ci.yml jobs already
#      use can be copied verbatim; setting POSTGRES_USER and running
#      `pytest -m integration` lights up all seven modules on every PR.
#      This needs no secrets, no staging, and no GPU.
#   2. For golden/hallucination, point them at real Foundry credentials
#      retrieved through the existing CD OIDC identity — not at a staging
#      URL that will never exist.
#
# Until (1) lands, treat this workflow as documentation of an intent, not
# as a gate. It gates nothing today.
#
# ─── continue-on-error on the golden/hallucination steps ─────────────────────
# Still `true` below, and still wrong — but flipping it on a workflow that
# never runs would change nothing. Flip it as part of fix (2).

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual dispatch (for audit log)"
        required: false
        default: "manual QA run"
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-rehearsal-${{ github.ref }}
  cancel-in-progress: false  # never cancel a release gate run mid-flight

env:
  PHP_VERSION: "8.5"
  PYTHON_VERSION: "3.13"
  COMPOSE_PROJECT_NAME: georag

# Least-privilege default for every job in this file. CodeQL's
# actions/missing-workflow-permissions flags a workflow with no explicit
# block because it then inherits the repository default, which can be
# read-write for the whole repo. Jobs that genuinely need more (SARIF
# upload, OIDC, package push) keep their own `permissions:` block, which
# overrides this one rather than adding to it.
permissions:
  contents: read

jobs:
  release-gate:
    name: Release Gate (golden + hallucination + integration)
    # TODO (Chunk 10.2): replace with self-hosted GPU runner label once registered.
    # ubuntu-latest cannot run Ollama with DeepSeek models — see note above.
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Log dispatch reason
        run: |
          echo "Release rehearsal triggered."
          echo "Ref: ${{ github.ref }}"
          echo "Reason: ${{ github.event.inputs.reason || 'tag push' }}"

      # ── Stack startup ──────────────────────────────────────────────────────
      # 2026-08-15 — docker-compose.yml requires POSTGRES_PASSWORD with no
      # default (`${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in
      # .env}`), and this workflow never created a .env file before this fix
      # (unlike ci.yml/eval-gate.yml, which both do `cp .env.example .env`
      # first). Without it, `docker compose up` failed var-interpolation
      # immediately — masked by the `|| true` on the next step, so the job
      # printed "Services started" and only failed ~2.5 minutes later at
      # "Wait for FastAPI health" once no container had actually started.
      - name: Prepare environment
        run: cp .env.example .env 2>/dev/null || true

      # TODO (Chunk 10.2): on a self-hosted GPU runner, bring up the full
      # dev-light profile including Ollama.  On the current GitHub-hosted runner
      # we start the infrastructure services only (postgres, redis, qdrant,
      # fastapi) and skip Ollama because the runner has no GPU and
      # the model download would exhaust the disk quota.
      #
      # 2026-08-15 — neo4j and martin dropped from this list: both were
      # removed from docker-compose.yml entirely (neo4j 2026-07-28 per B1;
      # martin earlier — see commit a0013db's "same class of gap" note).
      # `docker compose up -d <service>` fails immediately with
      # "no such service: neo4j" for any name not defined in the compose
      # file, and that failure was being swallowed by this step's `|| true`
      # exactly like the missing-.env gap above — the job was silently
      # never bringing up a stack, independent of that fix.
      - name: Start infrastructure services (dev-light without Ollama)
        run: |
          # Start core infrastructure — postgres, pgbouncer, redis, qdrant
          # are not profile-gated, so they start unconditionally.
          # fastapi + laravel-octane require --profile dev-light.
          docker compose --profile dev-light up -d \
            postgresql pgbouncer redis qdrant fastapi laravel-octane \
            2>&1 || true
          echo "Services started (Ollama excluded — see Chunk 10.2 TODO)."

      - name: Wait for FastAPI health
        # FastAPI /health endpoint is the gate before any tests run.
        # 30 retries × 5s = 150s maximum wait.
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "FastAPI healthy after ${i} attempts."
              exit 0
            fi
            echo "Attempt ${i}/30 — waiting 5s..."
            sleep 5
          done
          echo "ERROR: FastAPI did not become healthy within 150s."
          docker compose logs fastapi --tail=50
          exit 1

      - name: Wait for PostgreSQL health
        run: |
          for _ in $(seq 1 20); do
            if docker compose exec -T postgresql pg_isready -U georag > /dev/null 2>&1; then
              echo "PostgreSQL healthy."
              exit 0
            fi
            sleep 3
          done
          echo "ERROR: PostgreSQL did not become healthy."
          exit 1

      # ── Python test environment ────────────────────────────────────────────
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install FastAPI test dependencies
        working-directory: src/fastapi
        run: uv sync --extra dev

      # ── Integration tests (no LLM required) ───────────────────────────────
      # These are integration-marked tests that exercise the retrieval stack,
      # citation binding, and authentication without calling the LLM synthesis
      # path.  Run with continue-on-error: false — failure blocks the release.
      - name: Run integration tests (stack-required, no LLM)
        working-directory: src/fastapi
        continue-on-error: false
        env:
          FASTAPI_URL: "http://localhost:8000"
          # Live-Postgres integration modules (test_orphan_sweep,
          # test_stale_run_detector, test_ingest_progress_state_machine,
          # test_embed_pending_completion_sweep, and others) call
          # app.hatchet_workflows._progress._dsn(), which requires
          # POSTGRES_USER/POSTGRES_PASSWORD and reads POSTGRES_DIRECT_HOST/
          # POSTGRES_DIRECT_PORT/POSTGRES_DB. Each module module-skips when
          # POSTGRES_USER is unset — before this env block only FASTAPI_URL
          # was set here, so the modules silently skipped in this job too
          # even after being routed to it (2026-08-14 audit).
          #
          # pytest runs directly on this runner (via `uv run`), not inside
          # a container, so it cannot reach the `postgresql` compose
          # service by its service name — docker-compose.yml only
          # `expose`s 5432 internally for it (applications are meant to go
          # through PgBouncer). `pgbouncer` is the one service in this
          # stack that publishes a host port (${PGBOUNCER_PORT:-6432}:6432,
          # started above alongside postgresql), so route through it.
          # Credentials match the dev defaults in .env.example
          # (POSTGRES_USER/POSTGRES_DB default to "georag" in
          # docker-compose.yml too; POSTGRES_PASSWORD has no compose
          # default and must match whatever the stack was actually brought
          # up with).
          POSTGRES_USER: georag
          POSTGRES_PASSWORD: georag_dev_password
          POSTGRES_DIRECT_HOST: localhost
          POSTGRES_DIRECT_PORT: "6432"
          POSTGRES_DB: georag
        run: |
          uv run pytest tests/ -v --tb=short \
            -m "integration and not golden and not hallucination and not live" \
            --junit-xml=test-results-integration.xml \
            || exit $?

      # ── Golden query tests (LLM required) ─────────────────────────────────
      # These tests call the RAG pipeline end-to-end and require Ollama with
      # a loaded model.  On GitHub-hosted runners without GPU, they will fail
      # at the connection timeout.  continue-on-error: true until Chunk 10.2
      # provides a runner that can serve the model.
      # ── Golden query tests (LLM required) ─────────────────────────────────
      # These tests call the RAG pipeline end-to-end and require Ollama with
      # a loaded model.  continue-on-error: true until a staging URL with GPU
      # runner is configured (see top-of-file instructions).
      #
      # When secrets.STAGING_URL is configured and a self-hosted GPU runner is
      # registered, set continue-on-error: false here to make golden tests a
      # hard release gate.
      #
      # FASTAPI_URL: use the staging host URL when running against staging,
      # or localhost:8000 when running against the local docker compose stack.
      - name: Run golden query tests (LLM required)
        working-directory: src/fastapi
        # TODO: set continue-on-error: false once secrets.STAGING_URL is
        # configured and a self-hosted GPU runner is registered.
        # See ops/runbooks/_archived/secret-management.md "Items not yet closed".
        continue-on-error: true
        env:
          FASTAPI_URL: ${{ secrets.STAGING_URL || 'http://localhost:8000' }}
        run: |
          uv run pytest tests/ -v --tb=short \
            -m "golden" \
            --junit-xml=test-results-golden.xml \
            || exit $?

      # ── Hallucination failure tests (LLM required) ─────────────────────────
      # Same LLM dependency as golden tests.  Minimum pass rate for release
      # acceptance: 95% (≥ 19/20 adversarial cases).
      # continue-on-error: true for the same reason as golden tests above.
      - name: Run hallucination failure tests (LLM required)
        working-directory: src/fastapi
        # TODO: set continue-on-error: false once secrets.STAGING_URL is
        # configured and a self-hosted GPU runner is registered.
        # See ops/runbooks/_archived/secret-management.md "Items not yet closed".
        continue-on-error: true
        env:
          FASTAPI_URL: ${{ secrets.STAGING_URL || 'http://localhost:8000' }}
        run: |
          uv run pytest tests/ -v --tb=short \
            -m "hallucination" \
            --junit-xml=test-results-hallucination.xml \
            || exit $?

      # ── Upload test result artifacts ───────────────────────────────────────
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-test-results-${{ github.ref_name }}
          path: |
            src/fastapi/test-results-integration.xml
            src/fastapi/test-results-golden.xml
            src/fastapi/test-results-hallucination.xml
          retention-days: 30

      # ── Stack teardown ─────────────────────────────────────────────────────
      - name: Tear down Docker Compose stack
        if: always()
        run: docker compose --profile dev-light down -v --timeout 30 || true
