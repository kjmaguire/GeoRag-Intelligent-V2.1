kind: CronJob
metadata:
  name: georag-audit-chain-verify
  namespace: georag
  labels:
    helm.sh/chart: georag-0.2.0
    app.kubernetes.io/name: georag
    app.kubernetes.io/instance: georag
    app.kubernetes.io/version: "v1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  schedule: "0 3 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: georag
            app.kubernetes.io/instance: georag
            app.kubernetes.io/component: audit-chain-verify
        spec:
          restartPolicy: OnFailure
          
          containers:
            - name: verify
              image: ghcr.io/anthropics/georag/fastapi:v1.0.0
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "app.audit.chain_verify"]
              env:
                - name: POSTGRES_HOST
                  value: georag-postgresql
