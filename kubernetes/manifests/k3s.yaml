# Source: georag/templates/fastapi.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: georag-fastapi
  namespace: georag
  labels:
    helm.sh/chart: georag-0.2.0
    app.kubernetes.io/name: georag
    app.kubernetes.io/instance: georag
    app.kubernetes.io/version: "v1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: georag
      app.kubernetes.io/instance: georag
      app.kubernetes.io/component: fastapi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: georag
        app.kubernetes.io/instance: georag
        app.kubernetes.io/component: fastapi
    spec:
      
      containers:
        - name: fastapi
          image: ghcr.io/anthropics/georag/fastapi:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: POSTGRES_HOST
              value: georag-pgbouncer
            - name: POSTGRES_PORT
              value: "6432"
            - name: POSTGRES_DIRECT_HOST
              value: georag-postgresql
            - name: POSTGRES_DIRECT_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: georag_app
            - name: POSTGRES_DB
              value: georag
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: georag-secrets
                  key: PG_APP_PASSWORD
            - name: REDIS_HOST
              value: georag-redis
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: georag-secrets
                  key: REDIS_PASSWORD
            - name: QDRANT_HOST
              value: georag-qdrant
            - name: QDRANT_PORT
              value: "6333"
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: georag-secrets
                  key: QDRANT_API_KEY
            - name: FASTAPI_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: georag-secrets
                  key: FASTAPI_SERVICE_KEY
            - name: HATCHET_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: georag-secrets
                  key: HATCHET_CLIENT_TOKEN
            # COHERE_API_KEY: chat (LLM_BACKEND=cohere, the default) and Cohere
            # Parse OCR both read it, and the API process runs the production-
            # posture check that logs CRITICAL when it is empty. The worker gets
            # the whole Secret through envFrom; this Deployment lists its keys,
            # so the key must be named here or an on-prem install that set it
            # reaches only the worker. optional: true - an air-gapped install
            # (`ocr.engine: tesseract`, no egress) has no such key, and a
            # required reference would hold the pod in CreateContainerConfigError.
            - name: COHERE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: georag-secrets
                  key: COHERE_API_KEY
                  optional: true
            # ADR-0025 follow-up: set explicitly. The code default is now
            # "cohere", which an on-prem / air-gapped install cannot reach (no
            # COHERE_API_KEY here, and no egress), so an unset value would take
            # the hosted default instead of the self-hosted model. MUST be
            # identical on the fastapi (query) and hatchet-worker (ingest)
            # Deployments or one vector space is written and another queried.
            - name: EMBEDDING_BACKEND
              value: "local"
            # Cohere Parse is the default OCR engine (2026-10-04, same rule as
            # EMBEDDING_BACKEND: unset means the hosted engine). It needs
            # COHERE_API_KEY and egress to api.cohere.com; without the key the
            # worker logs one CRITICAL per process and runs Tesseract. An
            # air-gapped site sets `ocr.engine: tesseract` in values.
            - name: OCR_ENGINE
              value: "cohere_parse"
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
---
# Source: georag/templates/hatchet.yaml
# One merged worker Deployment, matching docker-compose.yml's
# `hatchet-worker` service and the AWS ECS Terraform: no `--pool` flag,
# the registered workflow set is selected entirely by the WORKER_POOL
# env var (ingestion | ai | all — default all). This used to be two
# Deployments (hatchet-worker-ai / hatchet-worker-ingestion) gated by
# `--pool`; that was the pre-merge architecture and has been collapsed
# to match. `hatchet.worker.pool` stays chart-configurable for an
# on-prem operator who wants to split pools across nodes for resource
# reasons (e.g. GPU nodes for `ai`) — do that by installing this chart
# twice, once per pool, under distinct release names, not by
# reintroducing a second Deployment template here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: georag-hatchet-worker
  namespace: georag
  labels:
    helm.sh/chart: georag-0.2.0
    app.kubernetes.io/name: georag
    app.kubernetes.io/instance: georag
    app.kubernetes.io/version: "v1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: georag
      app.kubernetes.io/instance: georag
      app.kubernetes.io/component: hatchet-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: georag
        app.kubernetes.io/instance: georag
        app.kubernetes.io/component: hatchet-worker
    spec:
      
      containers:
        - name: worker
          image: ghcr.io/anthropics/georag/fastapi:v1.0.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.hatchet_workflows.worker"]
          envFrom:
            - secretRef:
                name: georag-secrets
          env:
            - name: WORKER_POOL
              value: "all"
            - name: HATCHET_CLIENT_HOST
              value: "georag-hatchet:7077"
            - name: POSTGRES_HOST
              value: georag-pgbouncer
            - name: POSTGRES_PORT
              value: "6432"
            - name: POSTGRES_DIRECT_HOST
              value: georag-postgresql
            - name: POSTGRES_DIRECT_PORT
              value: "5432"
            # SEC-1 (2026-09-29): georag_app, as on AWS. Without these the
            # DSN fell back to POSTGRES_USER=georag — the superuser, which
            # bypasses RLS — with the superuser password from envFrom.
            # Explicit env wins over the envFrom Secret for the same key.
            - name: POSTGRES_USER
              value: georag_app
            - name: POSTGRES_DB
              value: georag
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: georag-secrets
                  key: PG_APP_PASSWORD
            - name: REDIS_HOST
              value: georag-redis
            - name: QDRANT_HOST
              value: georag-qdrant
            # ADR-0025 follow-up: set explicitly. The code default is now
            # "cohere", which an on-prem / air-gapped install cannot reach (no
            # COHERE_API_KEY here, and no egress), so an unset value would take
            # the hosted default instead of the self-hosted model. MUST be
            # identical on the fastapi (query) and hatchet-worker (ingest)
            # Deployments or one vector space is written and another queried.
            - name: EMBEDDING_BACKEND
              value: "local"
            # Cohere Parse is the default OCR engine (2026-10-04, same rule as
            # EMBEDDING_BACKEND: unset means the hosted engine). It needs
            # COHERE_API_KEY and egress to api.cohere.com; without the key the
            # worker logs one CRITICAL per process and runs Tesseract. An
            # air-gapped site sets `ocr.engine: tesseract` in values.
            - name: OCR_ENGINE
              value: "cohere_parse"
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: 500m
