# Source: georag/templates/redis.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: georag-redis
  namespace: georag
  labels:
    helm.sh/chart: georag-0.2.0
    app.kubernetes.io/name: georag
    app.kubernetes.io/instance: georag
    app.kubernetes.io/version: "v1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  serviceName: georag-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: georag
      app.kubernetes.io/instance: georag
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: georag
        app.kubernetes.io/instance: georag
        app.kubernetes.io/component: redis
    spec:
      
      containers:
        - name: redis
          image: redis:8.6-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              name: redis
          command: ["sh", "-c"]
          args:
            - |
              # maxmemory must stay at or under 80% of the container memory
              # limit. Redis accounts only its own dataset; client output
              # buffers, allocator fragmentation and the copy-on-write of
              # every AOF/RDB fork sit on top of it. Left uncapped, as this
              # was until 2026-08-22, the kernel OOM-kills the pod before
              # Redis ever gets the chance to evict anything.
              #
              # volatile-lru, not allkeys-lru: this instance holds Laravel
              # queue jobs (no TTL) alongside cache and sessions (TTL'd).
              # allkeys-lru would evict queued jobs silently. See
              # deploy/aws/terraform/services.tf for the full argument.
              redis-server \
                --requirepass "$REDIS_PASSWORD" \
                --appendonly yes \
                --dir /data \
                --maxmemory 1536mb \
                --maxmemory-policy volatile-lru
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: georag-secrets
                  key: REDIS_PASSWORD
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
            requests:
              cpu: 200m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" PING"]
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
